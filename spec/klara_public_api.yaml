        derivedHashedValue:
          description: This hash value is derived from the other value "hashedPrimaryValue".
          type: string
          example: adu7adsfnn3489asdfn334jk
        unhashedCredentials:
          allOf:
          - $ref: '#/components/schemas/UnhashedCredential'

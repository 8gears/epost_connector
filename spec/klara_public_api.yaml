  /core/latest/articles/article-numbers:
    get:
      tags:
      - Article
      summary: Find articles by article numbers
      description: Batch-resolve a list of article numbers to their priced article
        rows of the caller's company. Returns each row enriched with the price valid
        on `price-date` and the appropriate VAT rate. Unknown article numbers are
        silently skipped (returned list contains only matching rows). Requires permission
        `ARTICLE_READ_ONLY`.
      operationId: listArticlesByArticleNumbers
      parameters:
      - name: article-numbers
        in: query
        description: Article numbers to look up. Repeat the parameter for each value
          (e.g. `?article-numbers=ART-001&article-numbers=ART-002`). At most 100 entries;
          each entry up to 64 characters.
        schema:
          maxItems: 100
          type: array
          example: ART-001
      - name: export-vat
        in: query
        description: "If `true`, return ABROAD (export) VAT rate; otherwise NORMAL.\
          \ Defaults to false."
        schema:
          default: "false"
          type: boolean
      - name: price-date
        in: query
        description: "Date on which prices are evaluated. Format: yyyy-MM-dd. Defaults\
          \ to today when omitted."
        schema:
          format: date
          type: string
          example: 2026-06-01
      - name: should-validate-vat
        in: query
        description: "If `true`, cross-validate each row's VAT code against the company's\
          \ VAT setup on `price-date`. Defaults to false."
        schema:
          default: "false"
          type: boolean
      responses:
        "200":
          description: Matching articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleAndVariant'
        "400":
          description: Data invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
      security:
      - apiKeyAuth: []
      - bearerAuth: []

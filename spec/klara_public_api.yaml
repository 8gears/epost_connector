- name: Authentication
  description: KLARA Authentication flow
- name: ePost Communication Platform Delivery
  description: Including identity matching on delivery
- name: ePost Communication Platform Preview Services
  description: Offers preview of the delivery channels and prices without sending
    any document.
- name: ePost Communication Platform Monitoring
  description: "Monitoring data for deliveries done by oneAPI, independent of the\
    \ delivery channel."
- name: Standard ePost Digital Letterbox Identity Matching
  description: Including identity matching with simple responses
- name: ePost Digital Letterbox Onboarding and Profile Management
  description: ePost onboarding and profile management
- name: ePost Digital LetterBox Identity Matching with detailed recipient feedback
  description: Identity matching with detailed response
- name: eBill Network Partner
  description: manage/register as a biller of eBill via KLARA as your network partner.
- name: ePost Digital Letterbox
  description: Access and manage your digital letter box via public API
- name: ePost eArchive
  description: Operations related to directories of eArchive
- name: Article
  description: KLARA Article data
- name: Print partner
- name: SPS
- name: Customer
  description: KLARA CRM Contact data
- name: Location
  description: Geographical details
- name: Klara authentication generic
- name: Printer driver public API
- name: SHRM Booking
- name: Subscription
  description: Subscription management. Unlock features for KLARA users.
- name: Company
  description: Find/Create/Update a KLARA business company
- name: Individual
  description: Operations related to individual companies
- name: Accounting Interface
  description: External accounting
- name: Accounting
  description: "Klara Accounting public API — bookings and supporting master data.\
    \ Served under /core/v1. The identical operations under the older /core/latest\
    \ prefix are <strong>deprecated</strong>: they remain available for integrations\
    \ that predate versioning, but every new integration must use /core/v1. Deprecated\

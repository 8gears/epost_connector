          - description: Name of the platform that this customer uses
            example: FACEBOOK
        platformValue:
          description: Url of customer's online platform/webpage
          type: string
          example: www.linkedin.com/abc
    OnlinePlatformType:
      enum:
      - FACEBOOK
      - GOOGLE_PLUS
      - INSTAGRAM

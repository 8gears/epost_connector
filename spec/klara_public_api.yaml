  /core/v1/accounting/currencies/exchange-rate:
    get:
      tags:
      - Accounting
      summary: Get the CHF exchange rate for a currency on a given date.
      description: "Returns the Swiss National Bank reference rate that converts one\
        \ unit of <code>from-currency-code</code> into CHF on <code>exchange-date</code>.\
        \ When <code>from-currency-code</code> equals <code>CHF</code> (case-insensitive)\
        \ the rate is always <code>1</code>. The exchange-rate table is global SNB\
        \ data — the same response is returned for every tenant, so there are no tenant\
        \ or company path parameters. If no rate is stored for the requested day,\
        \ the downstream service transparently fetches the SNB feed for that date\
        \ and persists the result; if the feed has no entry either, the most recent\
        \ rate strictly before <code>exchange-date</code> is returned instead. The\
        \ endpoint is a pure read for the caller — idempotent. Requires a bearer token\
        \ whose principal carries the <code>ACCOUNTING</code> permission."
      operationId: getExchangeRateV1
      parameters:
      - name: exchange-date
        in: query
        description: "Reference date for the exchange rate, expressed as an ISO-8601\
          \ calendar date (<code>yyyy-MM-dd</code>)."
        required: true
        schema:
          format: date
          type: string
          example: 2024-09-30
        example: 2024-09-30
      - name: from-currency-code
        in: query
        description: ISO-4217 alpha-3 currency code of the source amount. Case-insensitive;
          <code>CHF</code> short-circuits to a rate of <code>1</code>.
        required: true
        schema:
          type: string
          example: EUR
        example: EUR
      responses:
        "200":
          description: Exchange rate as a JSON number; the value <code>1</code> when
            <code>from-currency-code</code> is CHF.
          content:
            application/json:
              schema:
                type: number
                example: 0.9421
        "400":
          description: "<code>exchange-date</code> is not a valid ISO-8601 calendar\
            \ date, or no rate could be resolved for the supplied <code>from-currency-code</code>."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "401":
          description: No Authorization header found or invalid token
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/v1/accounting/master-vats:
    get:
      tags:
      - Accounting
      summary: List the master VAT catalog used by Klara Accounting.
      description: "Returns the global master VAT catalog — the table of supported\
        \ VAT rates with their validity ranges and translated labels. The downstream\
        \ handler is a dispatcher driven by the query string: when <code>code</code>\
        \ is non-blank only rows whose <code>vatCode</code> matches one of the semicolon-separated\
        \ codes are returned (and when combined with <code>current-period=true</code>,\
        \ only the ones valid today); otherwise when <code>default-vat=true</code>\
        \ only the company-default rows are returned; otherwise the full catalog is\
        \ returned, ordered by rate ascending, optionally paginated via <code>offset</code>\
        \ / <code>limit</code>. Pagination is honoured only on the full-catalog branch\
        \ — it is silently ignored when <code>code</code> or <code>default-vat</code>\
        \ is set. The endpoint is a pure read and idempotent. Requires a bearer token\
        \ whose principal carries the <code>ACCOUNTING_GET_MASTER_VAT</code> permission."
      operationId: listMasterVatsV1
      parameters:
      - name: code
        in: query
        description: "Semicolon-separated list of <code>vatCode</code>s to filter\
          \ on. When set, switches the response to the by-code branch and ignores\
          \ <code>default-vat</code>."
        required: false
        schema:
          type: string
          example: 1;3;4
        example: 1;3;4
      - name: current-period
        in: query
        description: "When combined with <code>code</code>, restricts the result to\
          \ master VAT rows whose validity range covers today. Defaults to <code>false</code>."
        required: false
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      - name: default-vat
        in: query
        description: "When <code>true</code>, restricts the result to the company-default\
          \ master VAT rows. Defaults to <code>false</code>. Ignored when <code>code</code>\
          \ is set."
        required: false
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      - name: includeHiddenVatCase
        in: query
        description: "When <code>true</code>, the response also includes hidden VAT-case\
          \ ids that are not directly mapped to a master VAT row. Defaults to <code>false</code>."
        required: false
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      - name: limit
        in: query
        description: Maximum number of results to return. Only honoured on the full-catalog
          branch.
        required: false
        schema:
          type: integer
          example: 50
        example: 50
      - name: offset
        in: query
        description: Zero-based index of the first result. Only honoured on the full-catalog
          branch (when neither <code>code</code> nor <code>default-vat</code> is set).
        required: false
        schema:
          type: integer
          example: 0
        example: 0
      responses:
        "200":
          description: Array of master VAT rows matching the filters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicApiMasterVat'
        "401":
          description: No Authorization header found or invalid token
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
      - apiKeyAuth: []
      - bearerAuth: []

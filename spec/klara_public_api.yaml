  /core/v1/invoices/next-invoice-number:
    get:
      tags:
      - Finance
      summary: Get the next available invoice number for the authenticated company.
      description: "Returns the next available invoice number for the company resolved\
        \ from the bearer JWT. The caller must hold the <code>FINANCE</code> permission\
        \ on the target company. <strong>This operation is NOT idempotent</strong>\
        \ — each successful call advances the persisted next-invoice-number counter\
        \ on luzfin_finance, so the returned value is reserved and will not be returned\
        \ again. Do not retry on success."
      operationId: getNextInvoiceNumber
      responses:
        "200":
          description: Next available invoice number returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextInvoiceNumberResponse'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "404":
          description: Resource not found
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/v1/invoices/{id}:
    get:
      tags:
      - Finance
      summary: Get a single invoice by its numeric id.
      description: "Returns the fully-enriched invoice document for the given <code>id</code>\
        \ under the company resolved from the bearer JWT. The response includes order\
        \ items enriched with inventory selection data and accounting booking-status\
        \ fields (<code>bookingStatus</code>, <code>bookingDueDate</code>, <code>bookingSealed</code>)\
        \ populated by <code>luz_accounting</code>. The caller must hold the <code>FINANCE</code>\
        \ permission on the target company."
      operationId: getInvoiceById
      parameters:
      - name: id
        in: path
        description: Numeric primary key of the invoice to retrieve. Obtain this from
          the <code>id</code> field of a previously created invoice (<code>POST /core/v1/invoices</code>).
        required: true
        schema:
          type: integer
          example: 42
        example: 42
      responses:
        "200":
          description: Invoice found and returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "404":
          description: No invoice with the given id exists for the authenticated company.
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/v1/invoices/{id}/printed-document:
    post:
      tags:
      - Finance
      summary: Return the invoice as a PDF (rendering it if needed).
      description: "Returns the invoice document as a binary <code>application/pdf</code>\
        \ stream via the internal Klara printing pipeline (<code>luz_web</code> +\
        \ Aspose Words), mirroring the behaviour of the Klara GUI. The caller must\
        \ hold the <code>FINANCE</code> permission on the target company.<br/><br/><strong>Reuse\
        \ vs. render</strong> (mirrors the Klara GUI): if the invoice was already\
        \ printed, the previously rendered PDF is fetched from storage and returned\
        \ as-is; if it was not yet printed, it is rendered now and the <code>printedFileId</code>\
        \ is stored on the invoice record. In both cases the response body is the\
        \ binary PDF with a <code>Content-Disposition: attachment</code> header containing\
        \ the suggested filename. This is a <code>POST</code> (not <code>GET</code>)\
        \ because the first print persists the <code>printedFileId</code>."
      operationId: printInvoice
      parameters:
      - name: id
        in: path
        description: ID of the invoice to return as PDF. Must belong to the company
          resolved from the bearer JWT.
        required: true
        schema:
          type: integer
          example: 42
        example: 42
      responses:
        "200":
          description: "Invoice PDF returned as a binary <code>application/pdf</code>\
            \ stream with a <code>Content-Disposition: attachment</code> header —\
            \ either freshly rendered (first print) or the previously stored PDF (already\
            \ printed)."
          content:
            application/pdf: {}
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "404":
          description: Invoice not found.
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/v1/invoices/{id}/send:
    post:
      tags:
      - Finance
      summary: Send a booked invoice (smart delivery or a forced channel).
      description: "Sends an already-booked invoice to its recipient, synchronously,\
        \ under the company resolved from the bearer JWT.<br/><br/>Omit <code>channel</code>\
        \ for <strong>smart delivery</strong>: the system auto-routes through <code>EPOST</code>,\
        \ <code>EBILL</code>, <code>SEND_EMAIL</code> and Print&amp;Send and only\
        \ fails if none can deliver. Provide <code>channel</code> to <strong>force</strong>\
        \ that exact channel: if the recipient is not eligible (e.g. no email on file,\
        \ not eBill-registered, Print&amp;Send not subscribed) the call fails with\
        \ 400. The invoice PDF is rendered on demand when it has not been printed\
        \ yet.<br/><br/><strong>Prerequisites:</strong> the invoice must already be\
        \ booked — <code>DRAFT</code> and cancelled invoices are rejected with 400.\
        \ Create/book it via <code>POST /core/v1/invoices</code> (<code>status=INVOICED</code>)\
        \ first.<br/><br/><strong>Not idempotent:</strong> each successful call performs\
        \ a real delivery (sends an email / hands a letter to the postal channel)\
        \ and overwrites the invoice's recorded post method — do not retry blindly\
        \ on success.<br/><br/><code>channel</code> uses the same values as <code>Invoice.postMethod</code>,\
        \ except <code>PRINT_AND_MANUAL_SEND</code>, which is not a deliverable channel\
        \ and is rejected with 400. Authentication is API key + bearer JWT; the caller\
        \ must hold the <code>FINANCE</code> permission on the target company."
      operationId: sendInvoice
      parameters:
      - name: id
        in: path

              \ Pay once for the whole subscription period. </li><li> VOLUME: Pay\
              \ once for the whole subscription period and pay for each volume. </li><li>\
              \ MONTHLY: Pay monthly for the subscription period. </li><li> QUARTERLY:\
              \ Pay quarterly for the subscription period. </li><li> YEARLY: Pay yearly\
              \ for the subscription period. </li><li> FREE: Free subscription. </li><li>\
              \ PAY_PER_USE: Pay for each usage. </li></ul>"
            enum:
            - SINGLE
            - VOLUME
            - MONTHLY
            - QUARTERLY
            - YEARLY
            - FREE
            - PAY_PER_USE
            example: MONTHLY
        price:
          description: The price of this subscription at this moment
          type: number
          readOnly: true
          example: 10
        subscriptionFrom:
          format: date-time
          description: "Specify when the subscription will start effectively. By default,\
            \ the start date is today"
          type: string
          example: 2023-11-20 T10:15:30
        subscriptionUntil:
          format: date-time
          description: Specify when the subscription will end effectively after unsubscribe.
            This value will be calculated by service itself.
          type: string
          readOnly: true
          example: 2024-11-20 T10:15:30
        renewalDate:
          format: date
          description: Indicates the date that subscription will automatically renewed
            for another period if no cancellation is made before this date.
          type: string
          example: 2024-20-11
    SwissBank:
      type: object
      properties:
        id:
          format: int64
          description: Internal Swiss-bank master-data id.
          type: integer
          example: 100
        group:
          description: Master-data group code.
          type: string
          example: "1"
        bankClearingNumber:
          description: Bank clearing number (BCNR).
          type: string
          example: "100"
        branchId:
          description: Branch identifier.
          type: string
          example: "1"
        newBankClearingNumber:
          description: Successor BCNR if the bank has been replaced.
          type: string
          example: ""
        sicNumber:
          description: SIC member number.
          type: string
          example: "100000"
        headOfficeNumber:
          description: Head-office BCNR.
          type: string
          example: "100"
        bankClearingType:
          description: Bank-clearing classification code.
          type: string
          example: "1"
        euroSic:
          description: SIC participation in EUR.
          type: string
          example: ""
        language:
          description: Master-data language code.
          type: string
          example: de
        shortName:
          description: Bank short name.
          type: string
          example: PostFinance AG
        name:
          description: Bank legal name.
          type: string
          example: PostFinance AG
        address:
          description: Bank street address.
          type: string
          example: Mingerstrasse 20
        postalAddress:
          description: Postal address (PO Box).
          type: string
          example: Postfach
        place:
          description: City / locality.
          type: string
          example: Bern
        phone:
          description: Bank phone number.
          type: string
          example: +41 58 338 25 00
        fax:
          description: Bank fax number.
          type: string
          example: ""
        dailingCode:
          description: International dialling code.
          type: string
          example: "41"
    Tenant:
      description: A Company Tenant.
      type: object
      properties:
        tenant_id:
          type: string
          example: aaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        company_id:
          format: int64
          type: integer
          example: 1
        company_name:
          type: string
          example: ABC Company
    TenantDunning:
      type: object
      properties:
        id:
          format: int64
          type: integer
          example: 1
        dunningLevel:
          format: int32
          type: integer
          example: 0
        dunningDate:
          format: date-time
          type: string
          example: 2016-01-19T09:55:50
        amount:
          type: number
          example: 1200.0
    ThirdPartyStatus:
      description: Third party status
      enum:
      - RECEIVED
      - READY
      - SENDING
      - FINISHED
      - ERROR
      - UNDELIVERABLE
      type: string
    UnhashedCredential:
      description: Unhashed credential for identity matching process.
      type: object
      properties:
        universalName:
          description: "If you are not sure whether the recipient is a company or\
            \ a person, then this field can be used to put the name of the recipient"
          type: string
          example: KLARA Business AG / Peter Muster
        firstName:
          description: First name of a recipient.
          type: string
          example: Peter
        lastName:
          description: Last name of a recipient.
          type: string
          example: Muster
        companyName:
          description: "If the tenant entry is a business customer, i.e a Company,\
            \ enter the company name here."
          type: string
          example: KLARA
        companyUid:
          description: "If the tenant entry is a business customer, i.e a Company,\
            \ enter the company UID here.<br/>In case you are inputting the company\
            \ UID for delivery via eBill channel to a company recipient, pay attention\
            \ to not input any value for the billRecipientId. Otherwise, delivery\
            \ is only possible if both values are correct for the recipient of eBill."
          type: string
          example: CHE-123.456.789
        street:
          description: "Street name in the address of a recipient.<br/>As an option,\
            \ street name and street number can be added here together in this field.\
            \ In that case, leave the \"streetNumber\" field empty."
          type: string
          example: Bahnhofstrasse 10a
        streetNumber:
          description: Street number in the address of a recipient.
          type: string
          example: "20"
        zipCode:
          description: Zip code in the address of a recipient.
          type: string
          example: "3000"
        city:
          description: City in the address of a recipient.
          type: string
          example: Bern
        email:
          description: "Email of a recipient.<br/>In case you are inputting the email\
            \ of the recipient for delivery via eBill channel, pay attention to not\
            \ input any value for the billRecipientId. Otherwise, delivery is only\
            \ possible if both values are correct for the recipient of eBill."
          type: string
          example: peter.muster@gmail.com
        mobileNumber:
          description: "Mobile number of the recipient.<br/>Must be a valid international\
            \ phone number: Beginning with a '+' sign followed by a 1-3 digit country\
            \ code and the domestic phone number."
          type: string
          example: ' +41909112233'
        birthDate:
          format: date
          description: Birth date of a recipient in ISO 8601 format (yyyy-mm-dd)
          type: string
          example: 1990-01-02
        participantId:
          description: "This field is result of identity matching process, if value\
            \ is entered in request then it will have highest priority for matching\
            \ search process."
          type: string
        clientLegacyId:
          description: This id is optional and is used to support legacy systems.
          type: string
        minimumLevelOfTrust:
          allOf:
          - $ref: '#/components/schemas/LevelOfTrust'
          - description: "The Levels of Trust (LoT) define how strong a user is verified\
              \ in the KLARA ecosystem. Three possible level of trust: BRONZE, SILVER,\
              \ GOLD."
        socialSecurityNumber:
          description: Social security number of a recipient and must be unique.
          type: string
          example: 756.1234.5678.97
        taxId:
          description: Tax ID of a recipient and must be unique.
          type: string
          example: "263125"
        postOfficeBoxNumber:
          description: Post office box number
          type: string
          example: "12"
        postOfficeBoxZip:
          description: Post office box zipcode
          type: string
          example: "1212"
        postOfficeBoxTownName:
          description: Post office box town name
          type: string
          example: Vervey 1
        unstructuredAddressLine01:
          description: "If you are not sure which part of the address is name, street,\
            \ house number, city or postcode, then you can input your address in the\
            \ unstructured line 1 to 3. Keep in mind that sending unstructured addresses\
            \ will result to a lower matching rate"
          type: string
          example: Peter Muster
        unstructuredAddressLine02:
          description: "If you are not sure which part of the address is name, street,\
            \ house number, city or postcode, then you can input your address in the\
            \ unstructured line 1 to 3. Keep in mind that sending unstructured addresses\
            \ will result to a lower matching rate"
          type: string
          example: Bahnhofsstr 20
        unstructuredAddressLine03:
          description: "If your unstructured address has more than 3 lines, input\
            \ all the remaining in this line. Keep in mind that sending unstructured\
            \ addresses will result to a lower matching rate"
          type: string
          example: 8004 Zurich Switzerland
        billRecipientId:
          description: "Bill recipient Id from eBill. Using in eBill channel only.<br/>In\
            \ order to deliver via eBill channel, you can input this credential. If\
            \ you input more than 1 credential for eBill, delivery can happen only\
            \ if all of these credentials are found in the recipient of eBill by SIX."
          type: string
          example: "41010560425610173"
    UpdateModel:
      required:
      - status
      type: object
      properties:
        externalDocumentId:
          description: External document Id. ExternalDocumentId or letterId must be
            provided.
          type: string
          example: klara_KMUPLUS_test_183a317df11
        status:
          allOf:
          - $ref: '#/components/schemas/ThirdPartyStatus'
          - description: status of document
            example: RECEIVED
            nullable: false
        letterId:
          description: Letter id was printed and packed the letter in an envelope.
            ExternalDocumentId or letterId must be provided.
          type: string
          example: "75680215077246460037400000010310130015259013"
        errorMessage:
          description: ""
          type: string
          example: error message
    VAT:
      description: A VAT
      type: object
      properties:
        id:
          description: Id of the VAT.
          type: string
          example: "1"
        vatCode:
          description: Code of the VAT.
          type: string
          example: ABC
        rate:
          description: Rate of the VAT. Rate unit is percentage (%)
          type: number
          example: 5
        description:
          description: The additional infomation for VAT.
          type: string
          example: VAT's description
        validFrom:
          format: date
          description: The VAT is valid from this time.
          type: string
        validTo:
          format: date
          description: The VAT is invalid after this time.
          type: string
    Variant:
      description: An article variant.
      required:
      - number
      - accountingTags
      type: object
      properties:
        id:
          description: Id of the variant
          type: string
          example: "1"
        number:
          description: Article number
          type: string
          example: ABC123
        barcode:
          description: Barcode for the variant
          default: ""
          type: string
        accountingTags:
          description: "Tags used for accounting. Articles with the same tag, same\
            \ VAT case and same VAT rate are grouped together in the posting"
          type: array
          items:
            type: string
        articleSets:
          description: Name of the article sets that the variant is included in
          type: array
          items:
            type: string
        defaultQuantity:
          description: The default quantity of the article
          type: number
        active:
          description: Decide if this variant is active or not
          default: "false"
          type: boolean
        pricePeriods:
          description: "Price periods for the article variant.<br />If variant only\
            \ has 1 price, don't include validFrom and validTo in the PricePeriod.<br\
            \ />If variant have many prices, set value for validFrom for the date\
            \ that the price is active for each PricePeriod."
          type: array
          items:
            $ref: '#/components/schemas/PricePeriod'
        variantOptionValues:
          description: Values for the options that this article variant represent
          type: array
          items:
            type: string
    VatCase:
      description: A Vat case.
      type: object
      properties:
        id:
          description: Id of the VAT Case.
          type: string
          example: "1"
        vatCaseCode:
          description: Code of the VAT Case.
          type: string
          example: ABC
        description:
          description: The additional infomation for VAT.
          type: string
          example: VAT Case's description
        referenceMasterVat:
          description: The reference master for VAT.
          type: string
        vatCaseNames:
          description: The map contain VAT case names in many languages.
          type: object
          additionalProperties:
            type: string
        applicability:
          allOf:
          - $ref: '#/components/schemas/ApplicabilityVatCaseType'
          - description: The VAT case type.
            example: REVENUE
        orderNumber:
          format: int32
          description: This value present how this VAT case order in the list as sequence.
          type: integer
          example: 2
        createDate:
          format: date-time
          description: The date that VAT Case created.
          type: string
        updateDate:
          format: date-time
          description: The date that VAT Case updated.
          type: string
    VatClearingReport:
      description: VAT clearing report of a company for a given reporting period.
      type: object
      properties:
        id:
          format: int64
          description: Internal id of the report.
          type: integer
          example: 987
        codeBoxes:
          description: Code boxes that compose the VAT statement.
          type: array
          items:
            $ref: '#/components/schemas/VatClearingReportCodeBox'
        status:
          allOf:
          - $ref: '#/components/schemas/VatClearingReportStatus'
          - description: Current status of the report.
            example: CALCULATED
        year:
          format: int32
          description: Calendar year of the reporting period.
          type: integer
          example: 2024
        period:
          allOf:
          - $ref: '#/components/schemas/PeriodOfYear'
          - description: Reporting period within the year.
            example: Q1
        correctionCount:
          format: int32
          description: Number of booking corrections detected versus the sealed snapshot.
          type: integer
          example: 0
        formerVatRateReleaseDate:
          format: date
          description: Release date of the former VAT rates that still apply to a
            part of the period.
          type: string
          example: 2023-12-31T00:00:00Z
        newVatRatesReleased:
          description: Whether new VAT rates have been released and apply to part
            of the period.
          type: boolean
          example: false
        periodFrom:
          format: date
          description: Start date of the reporting period.
          type: string
          example: 2024-01-01T00:00:00Z
        periodTo:
          format: date
          description: End date of the reporting period.
          type: string
          example: 2024-03-31T00:00:00Z
    VatClearingReportCodeBox:
      description: Single code box of a VAT clearing report.
      type: object
      properties:
        id:
          format: int64
          description: Internal id of the code box.
          type: integer
          example: 1234
        code:
          description: Code of the box on the VAT statement.
          type: string
          example: "302"
        value:
          description: Computed amount of the box.
          type: number
          example: 12345.67
        description:
          description: Localized description of the box.
          type: string
          example: Steuerbarer Umsatz
        editable:
          description: Whether the value of this box is editable by the user.
          type: boolean
          example: false
        editableDescription:
          description: Whether the description of this box is editable by the user.
          type: boolean
          example: true
        rate:
          description: "VAT rate applied to this code box, in percent."
          type: number
          example: 8.1
    VatClearingReportLabel:
      description: Label data of a VAT clearing report code box.
      type: object
      properties:
        id:
          format: int64
          description: Internal id of the code box.
          type: integer
          example: 1234
        code:
          description: Code of the box on the VAT statement.
          type: string
          example: "302"
        value:
          description: Computed amount of the box.
          type: number
          example: 12345.67
        description:
          description: Localized description of the box.
          type: string
          example: Steuerbarer Umsatz
        editable:
          description: Whether the value of this box is editable by the user.
          type: boolean
          example: false
        editableDescription:
          description: Whether the description of this box is editable by the user.
          type: boolean
          example: true
    VatClearingReportStatus:
      description: Current status of a VAT clearing report.
      enum:
      - CALCULATED
      - SEALED
      type: string
      example: CALCULATED
    VatRate:
      description: A Vat rate.
      type: object
      properties:
        vatCode:
          type: string
        rate:
          type: number
        validFrom:
          type: string
        validTo:
          type: string
    WeightUnit:
      description: Weight unit used for shipping of the article
      enum:
      - GRAM
      - KILOGRAM
      type: string
    WindowLocation:
      enum:
      - LEFT
      - RIGHT
      type: string
    channel:
      description: "The channel we will use to contact the recipient with the request\
        \ to onboard to ePost. Currently, only EMAIL is supported."
      enum:
      - EMAIL
      type: string
    forcedOnboarding:
      description: |-
        This object is optional. Defines whether all recipients of this document should be forced to register to ePost in order to receive this document. If the recipient is already registered to ePost, the normal delivery flow applies. If the recipient is not yet registered to ePost, we will send him an email asking him to register to ePost in order to receive the document. The document is stored for up to 60 days and will be delivered to the recipient as soon as he registers to ePost. After 60 days the delivery will expire.
        Reminder emails are sent to the recipient after 2, 25, 40 and 55 days.
        Forced onboarding is only available for the delivery channel DIGITAL. Additionally the unhashed credential EMAIL is required for forced onboarding (onboarding request email will be sent to this email address) and the minimum level of trust must be BRONZE.
      type: object
      properties:
        channel:
          allOf:
          - $ref: '#/components/schemas/channel'
          - description: "The channel we will use to contact the recipient with the\
              \ request to onboard to ePost. Currently, only EMAIL is supported."
            example: EMAIL
            writeOnly: true
        language:
          allOf:
          - $ref: '#/components/schemas/language'
          - description: Language of the recipient. Defines the language we will use
              in the email we send to the recipient with the request to onboard to
              ePost.
            example: EN
            writeOnly: true
        emailToBeInformedWhenExpired:
          description: "This email address is used to inform the sender, in case the\
            \ forced onboarding eLetter expires after 60 days (recipient didn't register)\
            \ or should an error occur in the delivery of the forced onboarding eLetter."
          type: string
          example: peter.muster@gmail.com
    language:
      description: Language of the recipient. Defines the language we will use in
        the email we send to the recipient with the request to onboard to ePost.
      enum:
      - EN
      - DE
      - FR
      - IT
      type: string
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      name: X-API-KEY
      in: header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  /core/v1/payroll/contracts/{contractId}/payslips/{payslipId}/salary-items:
    post:
      tags:
      - Payroll
      summary: Add a salary item to an employee's payslip.
      description: "Adds a single salary item (Base / Percent / Quantity / Amount\
        \ / Comments) to the employee's editable (non-sealed) payslip identified by\
        \ <code>payslipId</code>, then recalculates that month unless <code>recalculate=false</code>.\
        \ Returns the added salary item with its server-assigned <code>id</code>.\
        \ This operation is <strong>not idempotent</strong>: repeated calls append\
        \ duplicate items or throw an error when the item is not duplicatable (subject\
        \ to the item's duplicatable flag). <strong>Prerequisite:</strong> call <code>GET\
        \ /payroll/employees/{employeeId}/addable-salary-items</code> first — its\
        \ response provides the <code>contractId</code> and <code>payslipId</code>\
        \ to target and the addable <code>code</code>s; resolve <code>employeeId</code>\
        \ beforehand via <code>GET /employees/short-info</code>. The tenant and company\
        \ are derived from the authenticated token; the caller must hold the <code>COMPENSATION</code>\
        \ permission on that company."
      operationId: addSalaryItem
      parameters:
      - name: contractId
        in: path
        description: "Id of the employee's contract to add the salary item to. Obtained\
          \ from the <code>contractId</code> field of the <code>GET /payroll/employees/{employeeId}/addable-salary-items</code>\
          \ response — call that endpoint first to select the employee and obtain\
          \ this id."
        required: true
        schema:
          type: integer
          example: 1
        example: 1
      - name: payslipId
        in: path
        description: "Id of the target (editable, non-sealed) payslip. Obtained from\
          \ the <code>payslipId</code> field of the <code>GET /payroll/employees/{employeeId}/addable-salary-items</code>\
          \ response — call that endpoint first to select the employee and obtain\
          \ this id."
        required: true
        schema:
          type: integer
          example: 26
        example: 26
      - name: recalculate
        in: query
        description: Whether to recalculate the payslip after adding the item. Defaults
          to true.
        required: false
        schema:
          default: "true"
          type: boolean
          example: true
        example: true
      requestBody:
        description: "<strong>Purpose:</strong> add one salary item to the target\
          \ payslip. The <code>code</code> must be one of the addable salary items\
          \ for this payslip, and only the value fields the item allows may be sent.<br/><strong>Prerequisite\
          \ APIs / value sources:</strong><ul><li><code>GET /employees/short-info</code>\
          \ &rarr; provides <code>employeeId</code></li><li><code>GET /payroll/employees/{employeeId}/addable-salary-items</code>\
          \ &rarr; provides the <code>contractId</code> and <code>payslipId</code>\
          \ path parameters, plus <code>salaryItems[].code</code> (&rarr; <code>code</code>)\
          \ and each item's <code>editableFields</code> (which of <code>baseValue</code>/<code>rate</code>/<code>quantity</code>/<code>value</code>\
          \ may be sent)</li></ul><strong>Top-level fields:</strong><ul><li><code>code</code>\
          \ (string, required) — salary-type code from the addable-salary-items response.</li><li><code>salaryItemValues</code>\
          \ (object, optional) — the numeric values; see below.</li><li><code>remark</code>\
          \ (string, optional, max 1024) — free-text comment (GUI \"Comments\").</li></ul><strong>Nested\
          \ <code>salaryItemValues</code>:</strong><ul><li><code>baseValue</code>\
          \ — GUI \"Base\".</li><li><code>rate</code> — GUI \"Percent (%)\", but expressed\
          \ as a decimal <strong>multiplier</strong>, not a percentage number: <code>1</code>\
          \ = 100%, <code>0.5</code> = 50%, <code>2</code> = 200%. If GUI implementation\
          \ wants to keep a normal percentage input for the user (e.g. typing 50 for\
          \ 50%), it must divide that value by 100 before sending it here (50 / 100\
          \ = 0.5).</li><li><code>quantity</code> — GUI \"Quantity\".</li><li><code>value</code>\
          \ — GUI \"Amount\".</li></ul><strong>Rules:</strong> the payslip must be\
          \ editable (non-sealed); the <code>code</code> must be addable to this payslip\
          \ (returned by the addable-salary-items endpoint); only fields listed in\
          \ the item's <code>editableFields</code> should be provided and the GUI\
          \ implementation should also only show input boxes for those fields; with\
          \ salary items that are not duplicatable (<code>duplicatable=false</code>),\
          \ the GUI implementation should have a mechanism to recall the <code>GET\
          \ /payroll/employees/{employeeId}/addable-salary-items</code> endpoint after\
          \ each add to refresh the list of addable items and prevent adding duplicates,\
          \ or automatically remove the added item from the list of addable items\
          \ in the GUI; <code>salaryItemValues.rate</code> is a decimal multiplier\
          \ (1 = 100%, 0.5 = 50%, 2 = 200%), not a percentage number — do not send\
          \ a raw percentage like 50 for 50%, send 0.5."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayslipSalaryItemRequest'
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayslipSalaryItem'
        "400":
          description: Data invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage1'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage1'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage1'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
      security:
      - apiKeyAuth: []
      - bearerAuth: []

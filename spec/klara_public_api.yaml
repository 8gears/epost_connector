  /core/latest/token:
    post:
      tags:
      - Authentication
      summary: Generate tokens to access other KLARA core endpoints
      description: "After obtaining tenant id and company id for the desired tenant,\
        \ use this endpoint to get the access token for a specific tenant, and refresh\
        \ token. <br />A grant_type of <strong>password</strong> is used for a Password\
        \ grant, which requires username, password, tenant and company id to produce\
        \ access token, refresh token from scratch.<br />A grant_type of <strong>refresh_token</strong>\
        \ is used for a Refresh token grant, which is used for acquiring the access\
        \ token using refresh token.<br />A grant_type of <strong>token_exchange</strong>\
        \ performs an OAuth 2.0 Token Exchange (RFC 8693). Provide <strong>subject_token</strong>\
        \ (the raw upstream Bearer token, without the 'Bearer ' prefix) and <strong>audience</strong>\
        \ to identify the target token type.<br />Supported audience values:<ul><li><strong>cossa</strong>\
        \ &mdash; exchanges a COSSA bearer token for a ePost access token.</li></ul><strong>Note:</strong>\
        \ subject_token must be the raw token value without the 'Bearer ' prefix."
      operationId: createPublicApiToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  default: ""
                  type: string
                password:
                  default: ""
                  type: string
                grant_type:
                  default: ""
                  type: string
                tenant_id:
                  default: ""
                  type: string
                company_id:
                  default: ""
                  type: string
                refresh_token:
                  default: ""
                  type: string
                subject_token:
                  default: ""
                  type: string
                audience:
                  default: ""
                  type: string
      responses:
        "200":
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAPIToken'
        "400":
          description: Could not get token
        "401":
          description: Invalid credentials
        "429":
          description: API rate limit exceeded
        "500":
          description: Internal server error

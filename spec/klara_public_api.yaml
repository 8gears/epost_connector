    DocumentErrorDetail:
      description: Document error detail
      type: object
      properties:
        documentTitle:
          description: The title of this document
          type: string
          example: My document
        senderEndToEndId:
          description: The sender end to end Id.
          type: string
          example: "1"
        deliveryChannelPreference:
          allOf:
          - $ref: '#/components/schemas/DeliveryChannelPreference'
          - description: Type of delivery channel preference of this document
            example: digital
        detail:
          description: The detail error message that failed to import
          type: array
          items:
            $ref: '#/components/schemas/DetailStatusV2'
    DocumentErrorResponse:
      description: A document error response.
      type: object
      properties:
        documentId:
          format: int64
          description: The id of this document
          type: integer
          example: 1
        errorMessage:
          description: Detail message if document have errors during delivery
          type: string
          example: errorMessage
        errorCode:
          allOf:
          - $ref: '#/components/schemas/ExternalDocumentStatus'
          - description: "Status of document: <ul><li><b>FAILED</b>: Check error code\
              \ for more information</li><li><b>DELIVERED_WITH_ERROR</b>: Fail to\
              \ deliver to some recipients. Check detail field for more information</li><li><b>NOT_MATCH_ALL_RECIPIENTS</b>:\
              \ Unable to find matching for all recipients. Note: Only available in\
              \ case allRecipientsRequired attribute on. Check detail field to know\
              \ which recipients could not do the matching</li></ul>"
    DocumentMetadata:
      description: Metadata of one document.
      required:
      - deliveryChannelPreferences
      - recipients
      type: object
      properties:
        documentId:
          description: Id of created document.
          type: string
          readOnly: true
        allCredentialShouldMatch:
          description: "Decides if this document should be delivered to ONLY the recipients\
            \ that have their credentials all matched or not.<br />If not specified,\
            \ then default value of TRUE is used.<br/>This flag is only considered\
            \ for the <b>DIGITAL</b> delivery in ePost."
          type: boolean
        deliveryChannelPreferences:
          description: |-
            This value defines your preference & priority among delivery channels. It defines that your letter/message/document should be delivered via which one of the available channels. You can input more than one delivery channel. <br><br>
            The order of delivery channels defines the priority of each channel. Meaning, at first we try to deliver via the first mentioned delivery channel, if it's unsuccessful, we would try via the second channel mentioned, and so on. <br><br>
            If delivery is not successful via any of the delivery methods, then an error response will be returned to the sender.<br><br>
            <b>DIGITAL</b> delivering it to the recipient's ePost letterbox (available for all types of documents/letters/messages)<br>
            <b>PHYSICAL</b> printing and sending the letter physically (only specific pdf formats are accepted)<br>
            <b>SMS</b> delivering the "simple short message" as a SMS to the recipient's mobile phone. (only for simple short message media type)
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/DeliveryChannelPreference'
          writeOnly: true
        senderName:
          description: This value will be shown to the recipient as the delivery sender
            name.
          type: string
          example: Canton Bern
          writeOnly: true
        senderEndToEndId:
          description: This id provided by the sender. It helps the sender to reference
            the document during the whole process.
          type: string
          writeOnly: true
        senderCaseId:
          description: This id provided by the sender. If multiple Documents are related
            to one case (e.g. insurance) it helps the receiver to group received documents
          type: string
          writeOnly: true
        documentReferenceDate:
          format: date
          description: "This date is relevant for a document from a business point\
            \ of view, it differs from the date at which the document is entered in\
            \ the \"Klara Documents\" system."
          type: string
          example: 1990-01-02
          writeOnly: true
        documentTitle:
          description: This title will be shown to the recipient of the delivery on
            the application.
          type: string
          example: nameOfTheFile
        documentDescription:
          description: A short description of the document shown to the recipient
            as a preview text.
          type: string
          example: Your health check invitation with questionnaire.
        documentTypes:
          description: "This is the types of the document. Accepted values: message,\
            \ invoice, contract, hr."
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'
          writeOnly: true
        recipients:
          description: Recipients's informations include hashed and unhashed datas
            for identity matching process.
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        allRecipientsRequired:
          description: True if all recipients are required to be valid in case digital
            channel otherwise not send to anyone and mark as failed
          type: boolean
    DocumentMetadataV2:
      description: Metadata of one file.
      required:
      - fileName
      - deliveryChannelPreferences
      - recipients
      type: object
      properties:
        allCredentialShouldMatch:
          description: "Decides if this document should be delivered to ONLY the recipients\
            \ that have their credentials all matched or not.<br />If not specified,\
            \ then default value of TRUE is used.<br/>This flag is only considered\
            \ for the <b>DIGITAL</b> delivery in ePost."
          type: boolean
        fileName:
          description: Name of document file.
          type: string
        mediaType:
          description: "Indicate the specific media type of the document. For sending\
            \ a standard classic letter like a PDF leave this field empty. <br/>Acceptable\
            \ values: <br/>\"application/vnd.ch.klara.epost.smartletter.v1+json\"\
            \ for smart letter. Indicate that if this document file is a smart letter.\
            \                        <br/>\"application/vnd.ch.klara.epost.v1+simple_short_message\"\
            \ for simple short message. To send simple short message, leave the document\
            \ type empty.                        <br/>\"application/vnd.ch.klara.epost.v1+incamail\"\
            \ Please use SecureSend instead of IncaMail.                        <br/>\"\
            application/vnd.ch.klara.epost.v1+securesend\" for SecureSend.\t\t\t\t\
            \t\t <br/>null for Physical delivery."
          type: string
          example: application/vnd.ch.klara.epost.smartletter.v1+json
        deliveryChannelPreferences:
          description: "This value defines your preference & priority among delivery\
            \ channels. It defines that your letter/message/document should be delivered\
            \ via which one of the available channels. You can input more than one\
            \ delivery channel. <br><br>\nThe order of delivery channels defines the\
            \ priority of each channel. Meaning, at first we try to deliver via the\
            \ first mentioned delivery channel, if it's unsuccessful, we would try\
            \ via the second channel mentioned, and so on. <br><br>\nIf delivery is\
            \ not successful via any of the delivery methods, then an error response\
            \ will be returned to the sender.<br><br>\n<b>DIGITAL</b> delivering it\
            \ to the recipient's ePost letterbox (available for all types of documents/letters/messages)<br>\n\
            <b>PHYSICAL</b> printing and sending the letter physically (only specific\
            \ pdf formats are accepted)<br>\n<b>SMS</b> delivering the \"simple short\
            \ message\" as a SMS to the recipient's mobile phone. (only for simple\
            \ short message media type)<br>\n<b>EBILL</b> delivering it to the recipient's\
            \ eBill (available for invoice document type with pdf format)<br>\n<b>EMAIL</b>\
            \ delivering it to the recipient who using email<br>\n<b>AUTO</b> will\
            \ try to find most suitable one from all available channel in order like\
            \ this (<b>DIGITAL</b>, <b>SMS</b>, <b>EBILL</b>, <b>PHYSICAL</b>, <b>EMAIL</b>)\
            \ then do the delivering "
          type: array
          items:
            $ref: '#/components/schemas/DeliveryChannelPreference'
          writeOnly: true
        senderName:
          description: This value will be shown to the recipient as the delivery sender
            name.
          type: string
          example: Canton Bern
          writeOnly: true
        senderEndToEndId:
          description: This id provided by the sender. It helps the sender to reference
            the document during the whole process.
          type: string
          writeOnly: true
        senderCaseId:
          description: This id provided by the sender. If multiple Documents are related
            to one case (e.g. insurance) it helps the receiver to group received documents
          type: string
          writeOnly: true
        documentReferenceDate:
          format: date
          description: |-
            This date is relevant for a document from a business point of view, it differs from the date at which the document is entered in the "Klara Documents" system.
            For eBill, The business case date can not be more than 90 days in the past and it can not be in the future.
          type: string
          example: 1990-01-02
          writeOnly: true
        documentTitle:
          description: This title will be shown to the recipient of the delivery on
            the application.
          type: string
          example: nameOfTheFile
        documentDescription:
          description: A short description of the document shown to the recipient
            as a preview text.
          type: string
          example: Your health check invitation with questionnaire.
        documentTypes:
          description: "This is the types of the document. In order to send a simple\
            \ short message, leave this field empty.<br />Accepted values: message,\
            \ invoice, contract, hr."
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'
          writeOnly: true
        recipients:
          description: Recipients's informations include hashed and unhashed datas
            for identity matching process.
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        allRecipientsRequired:
          description: True if all recipients are required to be valid in case Digital
            channel otherwise not send to anyone and mark as failed.<br />If this
            flag true we just consider Digital delivery channel.
          type: boolean
        displayDeliveredDocument:
          description: "When this flag true, the delivered document with show more\
            \ information like senderEndToEndId, senderUserId and documentTitle "
          type: boolean
        documentMessage:
          description: The message content of the simple short message
          type: string
          example: "Dear Peter \n Your appointment on 28.05.2022 has been cancelled.\
            \ Please contact us to arrange a new one"
        ebillAdditionalInfo:
          $ref: '#/components/schemas/EbillAdditionalInfo'
        emailAdditionalInfo:
          $ref: '#/components/schemas/EmailAdditionalInfo'
        digitalAdditionalInfo:
          $ref: '#/components/schemas/DigitalAdditionalInfo'
        documentSignature:
          allOf:
          - $ref: '#/components/schemas/DocumentSignature'
          - description: Singature's info if document required Singature.
        forcedOnboarding:
          allOf:
          - $ref: '#/components/schemas/forcedOnboarding'
          - description: "This object is optional. Defines whether all recipients\
              \ of this document should be forced to register to ePost in order to\
              \ receive this document. If the recipient is already registered to ePost,\
              \ the normal delivery flow applies. If the recipient is not yet registered\
              \ to ePost, we will send him an email asking him to register to ePost\
              \ in order to receive the document. The document is stored for up to\
              \ 60 days and will be delivered to the recipient as soon as he registers\
              \ to ePost. After 60 days the delivery will expire.<br/>Reminder emails\
              \ are sent to the recipient after 2, 25, 40 and 55 days.<br/>Forced\
              \ onboarding is only available for the delivery channel DIGITAL. Additionally\
              \ the unhashed credential EMAIL is required for forced onboarding (onboarding\
              \ request email will be sent to this email address) and the minimum\
              \ level of trust must be BRONZE. (It is only supported in the async\
              \ deliveries API.)"
        physicalAdditionalInfo:
          $ref: '#/components/schemas/PhysicalAdditionalInfo'

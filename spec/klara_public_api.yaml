          description: Free-text comment attached to the salary item (GUI "Comments").
          type: string
          example: Adjustment for March
    PayslipSalaryItemRequest:
      description: "The salary item to add to a payslip: the salary-type code plus\
        \ its numeric values and an optional comment."
      required:
      - code
      type: object
      properties:
        code:
          description: "Salary-type code identifying the item to add. Must be one\
            \ of the codes returned by GET /payroll/employees/{employeeId}/addable-salary-items\
            \ (salaryItems[].code)."
          maxLength: 64
          pattern: \S
          type: string
          example: "1005"
          nullable: false
        salaryItemValues:
          allOf:
          - $ref: '#/components/schemas/PayslipSalaryItemValues'
          - description: "The numeric value fields (Base / Percent / Quantity / Amount).\
              \ Only fields listed in the salary item's editableFields, which are\
              \ also returned by GET /payroll/employees/{employeeId}/addable-salary-items\
              \ (salaryItems[].editableFields), should be provided."
        remark:
          description: Optional free-text comment (GUI "Comments").
          maxLength: 1024
          type: string
          example: Adjustment for March
    PayslipSalaryItemValues:
      description: Numeric value fields of a salary item (GUI Base / Percent / Quantity
        / Amount). Only fields listed in the salary item's editableFields may be provided.
      type: object
      properties:
        baseValue:
          description: GUI "Base" value.
          type: number
          example: 5000.0
        rate:
          description: "GUI \"Percent (%)\" value, expressed as a decimal multiplier\
            \ — NOT a percentage number. 1 = 100%, 0.5 = 50%, 2 = 200%. If GUI implementation\
            \ wants to keep a normal percentage input for the user (typing 50 for\
            \ 50%) instead of a multiplier (0.5), it must divide that input by 100\
            \ before sending it here (50 / 100 = 0.5)."
          type: number
          example: 0.5
        quantity:
          description: GUI "Quantity" value.
          type: number
          example: 1
        value:
          description: GUI "Amount" value.
          type: number
          example: 425.0

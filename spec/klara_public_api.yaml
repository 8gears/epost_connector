  /epost/v2/letters:
    get:
      tags:
      - ePost Digital Letterbox
      summary: Get letters of current user.
      parameters:
      - name: from-date
        in: query
        description: "Filter letters with the send date (yyyy-MM-dd). Letters were\
          \ sent since 'from-date' value will be return.<br/>Both <b>from-date</b>\
          \ and <b>to-date</b> need to be specified to filter letters within a time\
          \ period.<br/>Example: 2021-10-01"
        schema:
          type: string
      - name: is-business-tenant
        in: query
        schema:
          type: boolean
      - name: letter-folder
        in: query
        description: Filter letters in specific folder<br/>Acceptable values:<br/><b>INBOX_FOLDER</b>
          for inbox letters<br/><b>SENT_FOLDER</b> for outbox letters<br/><br /><br/><b>INBOX_FOLDER</b>
          is chosen <b>by default</b>
        schema:
          allOf:
          - $ref: '#/components/schemas/LetterFolder'
          - default: INBOX_FOLDER
      - name: letter-types
        in: query
        description: Filter letters with this media type<br/>Acceptable values:<br/><b>CLASSIC_LETTER</b>
          for classic letters<br/><b>SMART_LETTER</b> for smart letters<br/><b>SMART_LETTER_ANSWER</b>
          for smart letter answers<br/><b>SIMPLE_SHORT_MESSAGE</b> for simple short
          message<br/><b>INCAMAIL</b> for IncaMail<br/><b>SECURESEND</b> for SecureSend<br
          /><br/><b>CLASSIC_LETTER</b> is chosen <b>by default</b>
        required: true
        schema:
          default: CLASSIC_LETTER
          type: array
          items:
            $ref: '#/components/schemas/LetterType'
      - name: limit
        in: query
        description: "Define the limit of the letter list that this API returns.<br\
          \ />For example, if a user have 20 letters in their inbox, and this <b>limit</b>\
          \ parameter is 5, and the <b>offset</b> parameter is 0,<br />then this API\
          \ will return letter list containing the first 5 letters<br />If not set,\
          \ then default value of 48 is used"
        schema:
          format: int32
          default: "48"
          maximum: 1000
          minimum: 1
          type: integer
      - name: offset
        in: query
        description: "Define which position to start getting letter list.<br />For\
          \ example, if a user have 20 letters in their inbox, and this <b>offset</b>\
          \ parameter is 5,<br />then this API will return letter list from the 5th\
          \ letter.<br />If not set, then default value of 0 is used"
        schema:
          format: int32
          default: "0"
          minimum: 0
          type: integer
      - name: read-status
        in: query
        description: Filter letters with read status<br/>Acceptable values:<br/><b>READ</b>
          for read letters<br/><b>UNREAD</b> for unread letters<br/><b>ALL</b> for
          all letters<br/><b>ALL</b> is chosen <b>by default</b>
        schema:
          allOf:
          - $ref: '#/components/schemas/LetterReadStatusFilterParam'
          - default: ALL
      - name: senderCaseId
        in: query
        description: Filter letters with sender case id
        schema:
          type: string
      - name: senderEndToEndId
        in: query
        description: Filter letters with sender end to end id
        schema:
          type: string
      - name: senderParticipantId
        in: query
        description: Filter letters with sender participant id
        schema:
          type: string
      - name: senderUserId
        in: query
        description: Filter letters with sender user id
        schema:
          type: string
      - name: to-date
        in: query
        description: "Filter letters with the send date (yyyy-MM-dd). Letters were\
          \ sent before 'to-date' value will be return<br/>Both <b>from-date</b> and\
          \ <b>to-date</b> need to be specified to filter letters within a time period.<br/>Example:\
          \ 2021-10-01"
        schema:
          type: string
      - name: with-reminder
        in: query
        schema:
          type: boolean
      responses:
        "200":
          description: Retrieve letters successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Letter'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
      - apiKeyAuth: []
      - bearerAuth: []

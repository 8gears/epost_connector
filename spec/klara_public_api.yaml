  /core/latest/vat-clearing-reports/{year}/{quarter}:
    post:
      tags:
      - Accounting
      summary: Get or recompute the VAT clearing report of a company for a given period.
      description: "Returns the VAT clearing report of the caller's company for the\
        \ requested calendar <code>year</code> and reporting <code>quarter</code>\
        \ (quarter, semester or yearly). When <code>recalculate=true</code> the report\
        \ is recomputed from the current bookings and the stored <code>CALCULATED</code>\
        \ snapshot is rewritten before being returned; this is why the operation uses\
        \ <code>POST</code> rather than <code>GET</code>. When <code>recalculate=false</code>\
        \ the latest <code>CALCULATED</code> snapshot is returned as-is, or — if only\
        \ a <code>SEALED</code> snapshot exists — that one. The caller must hold the\
        \ <code>ACCOUNTING</code> permission on the targeted company."
      operationId: getVatClearingReportByQuarter
      parameters:
      - name: quarter
        in: path
        description: "Reporting period within the year. Allowed values: Q1, Q2, Q3,\
          \ Q4, S1, S2, YEAR_NET_TAX_RATE, YEAR_EFFECTIVE."
        required: true
        schema:
          description: Reporting period of a VAT clearing report.
          enum:
          - Q1
          - Q2
          - Q3
          - Q4
          - S1
          - S2
          - YEAR_NET_TAX_RATE
          - YEAR_EFFECTIVE
          type: string
          example: Q1
        example: Q1
      - name: year
        in: path
        description: Calendar year of the reporting period.
        required: true
        schema:
          type: integer
          example: 2024
        example: 2024
      - name: recalculate
        in: query
        description: "If true, recompute the report from current bookings and overwrite\
          \ the stored CALCULATED snapshot before returning. Defaults to false."
        required: false
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      - name: Accept-Language
        in: header
        description: "Preferred language for localized labels in the response. Examples:\
          \ de-CH, de, fr-CH, it-CH, en."
        required: false
        schema:
          type: string
          example: de-CH
        example: de-CH
      responses:
        "200":
          description: The VAT clearing report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VatClearingReport'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:

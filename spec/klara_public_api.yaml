components:
  schemas:
    AccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          format: int64
          type: integer
        refresh_expires_in:
          format: int64
          type: integer
        refresh_token:
          type: string
        token_type:
          type: string
        id_token:
          type: string
        not-before-policy:
          format: int32
          type: integer
        session_state:
          type: string
        otherClaims:
          type: object
          additionalProperties:
            type: object
    Account:
      required:
      - currencyCode
      - iban
      type: object
      properties:
        currencyCode:
          description: The currency code in ISO-4217<br />We only accept CHF.
          pattern: "[A-Z]{3}"
          type: string
          example: CHF
        iid:
          description: The required institution identification of the associated financial
            institute.<br />Please use leading zeroes to reach the 5 digit value.
          pattern: "[0-9]{5}"
          type: string
          example: "00100"
        iban:
          description: We only accept QR iban for a biller registration.<br />In case
            the account number is of type QR-IBAN the account supplement can be used
            as additional information to this account number for distinguishing billers
            using the same QR-IBAN. <br />The combination of QR-IBAN and account supplement
            must be unique. <br />The account supplement is used during business case
            validation (if an account supplement is defined the QR-Reference has to
            start with these exact digits) and during direct subscription from online
            banking (if an account supplement is defined the QR-Reference has to start
            with these exact digits to produce a match for direct subscription).
          type: string
          example: CH5489144989413742586
        esrParticipantNumber:
          type: string
        qrIbanAccountSupplement:
          type: string
    AddablePayslipSalaryItems:
      description: "The salary items that can be added to an employee's editable payslip,\
        \ plus the resolved contract/payslip to chain into the add-salary-item call."
      type: object
      properties:
        employeeId:
          format: int64
          description: Id of the employee the addable salary items were resolved for.
          type: integer
          example: 3487
        contractId:
          format: int64
          description: Id of the employee's resolved main (latest) contract. Pass
            this to the add-salary-item call.
          type: integer
          example: 9021
        payslipId:
          format: int64
          description: Id of the resolved editable payslip. Pass this to the add-salary-item
            call.
          type: integer
          example: 9542
        periodFrom:
          format: date-time
          description: Month (first day) of the resolved payslip (yyyy-MM-ddT00:00:00Z).
          type: string
          example: 2018-03-01T00:00:00Z
        salaryItems:
          description: "Addable salary items as blank templates (value fields cleared),\
            \ distinct by code."
          type: array
          items:
            $ref: '#/components/schemas/AddableSalaryItem'
    AddableSalaryItem:
      description: "A salary-item type that can be added to an employee's payslip\
        \ (blank template, value fields cleared)."
      type: object
      properties:
        code:
          description: Salary-type code. Send this as the salary item code when adding
            it to the payslip.
          type: string
          example: "1005"
        name:
          description: Canonical (non-localized) name of the salary item.
          type: string
          example: Hourly Salary
        description:
          description: Localised description/label of the salary item (localised via
            the Accept-Language header).
          type: string
          example: Stundenlohn
        editableFields:
          description: "Comma-separated list of the value fields that can be provided\
            \ when adding this salary item (baseValue, rate, quantity, value). The\
            \ GUI implementation must base on this list to only show input box for\
            \ fields that exist in this list."
          type: string
          example: "baseValue,quantity"
        duplicatable:
          description: "Whether more than one instance of this salary item can be\
            \ added to the same payslip. When false, only one instance of this salary\
            \ item can be added, try to add another one will result in an error."
          type: boolean
          example: true
        showOnPayslip:
          description: Whether the salary item is shown on the payslip.
          type: boolean
          example: true
        employerRelated:
          description: Whether the salary item is employer-related (as opposed to
            employee-related).
          type: boolean
          example: false
        paymentTypeSit:
          allOf:
          - $ref: '#/components/schemas/PaymentType'
          - description: "How the salary item is paid out. Allowed values: BANK, PAYINSLIP,\
              \ CASH."
            example: BANK
        salaryItemTypeId:
          format: int64
          description: Id of the underlying salary-item type definition.
          type: integer
          example: 42
        accountingGroup:
          description: Accounting group the salary item belongs to.
          type: string
          example: SALARY
        printSequence:
          format: int32
          description: Print/order sequence of the salary item on the payslip.
          type: integer
          example: 100
    AdditionalBookingExportLine:
      description: A booking item used for SHRM booking
      type: object
      properties:
        sequenceNumber:
          format: int64
          description: Sequence number of booking item
          type: integer
          example: 1
        salaryRunId:
          description: Id of salary run
          type: string
          example: "1"
        accountingCompany:
          description: Accounting company code
          type: number
          example: 12345
        itemGroup:
          description: Item group
          type: string
          example: "001"
        documentDate:
          format: date
          description: Document date
          type: string
          example: 2021-11-01T00:00:00Z
        documentNumber:
          description: Document number
          type: string
          example: "1"
        bookingDate:
          format: date
          description: Booking date
          type: string
          example: 2021-11-01T00:00:00Z
        valueDate:
          format: date
          description: valuta date
          type: string
          example: 2021-11-01T00:00:00Z
        accountNumber:
          description: Account number
          type: string
          example: 2021-11-01T00:00:00Z
        debitAmount:
          description: Debit amount. Presented when account type of booking item is
            Debit
          type: number
          example: 100.25
        creditAmount:
          description: Credit amount. Presented when account type of booking item
            is Credit
          type: number
          example: 100.25
        amount:
          description: Amount
          type: number
          example: 100.25
        debitCreditFlag:
          description: Debit or credit signal
          type: string
          example: +
        quantity:
          description: Quantity
          type: number
          example: 1
        costCenter:
          description: Affected cost center code extracted by priority with booking
            rule
          type: string
          example: CC001
        bookingText:
          description: Booking text. Extracted by priority SITExtension first and
            then account system configuration
          type: string
          example: Booking additional text for salary salary item
        bookingAdditionalText:
          description: Booking text. Extracted by priority SITExtension first and
            then account system configuration
          type: string
          example: Booking additional text for salary salary item
        vatCode:
          description: VAT code. Extracted by priority with booking rule
          type: string
          example: Soreco-001
        vatRate:
          description: VAT rate. This attr is not supported at the moment
          type: number
        vatType:
          description: VAT type. This attr is not supported at the moment
          type: string
        vatUID:
          description: VAT UID. Extracted from salary item additional info if presented
          type: string
        vatName:
          description: VAT name. Extracted from salary item additional info if presented
          type: string
        period:
          description: Period of booking item
          type: string
          example: 2019/03
    AdditionalBookingExportLinesWrapper:
      type: object
      properties:
        bookingLines:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalBookingExportLine'
        bookingType:
          $ref: '#/components/schemas/AdditionalBookingHistoryType'
    AdditionalBookingHistoryType:
      enum:
      - DEFAULT
      - PROVISION
      type: string
    AdditionalEmailInfo:
      description: Contain email and its name
      type: object
      properties:
        email:
          description: Email address
          type: string
          example: abc@klara.ch
          writeOnly: true
        name:
          description: Name of email
          type: string
          example: ABC
          writeOnly: true
    Address:
      description: An Address of a customer.
      required:
      - addressLines
      - addressType
      - cityName
      - countryIso2Code
      type: object
      properties:
        id:
          description: Id of this Address. Does not need to be included when creating
            customer
          type: string
          example: "1"
        validFrom:
          format: date
          description: The timestamp from which this address is valid
          type: string
        validTo:
          format: date
          description: The timestamp to which this address is valid
          type: string
        addressLines:
          description: The address lines for this Address
          type: string
          example: Chemin de la Caquerette 12
        addressType:
          description: "The type of address, could be [PRIVATE, WORK, SHIPPING]. For\
            \ company, address type <strong>MUST</strong> be <strong>PRIVATE</strong>. "
          pattern: \S
          type: string
          example: WORK
          nullable: false
        cityName:
          description: Name of this City
          pattern: \S
          type: string
          example: Bern
          nullable: false
        cityZipCode:
          description: The postal code of a city for this address
          type: string
          example: "3003"
        countryIso2Code:
          description: "2 letter country code. For company, only accept Switzerland"
          pattern: \S
          type: string
          example: CH
          nullable: false
        countryIso3Code:
          description: "3 letter country code. For company, only accept Switzerland"
          type: string
          example: CHE
        countryNumericCode:
          description: "ISO-numeric code. For company, only accept Switzerland"
          type: string
          example: "756"
        city_href:
          description: "The path to get City object by city's id, /cities/{}"
          type: string
          readOnly: true
          example: https://api.klara.ch/core/latest/cities/1
        definitionName:
          description: "definition name of this address; in case main address, value\
            \ is null; else value is not blank"
          type: string
          example: 2nd address
        additionalAddress:
          description: Additional address for more specific
          type: string
          example: "No. 13, street 123"
    ApplicabilityVatCaseType:
      enum:
      - REVENUE
      - COST
      type: string
    ArchiveUploadMetadataRequest:
      description: Metadata of the document to be archived.
      required:
      - fileName
      - documentTitle
      - documentReferenceDate
      type: object
      properties:
        fileName:
          description: Original file name (with extension).
          pattern: \S
          type: string
          example: sample.xlsx
          nullable: false
        documentTitle:
          description: Display title shown in eArchive.
          pattern: \S
          type: string
          example: sample
          nullable: false
        documentReferenceDate:
          description: Reference date of the document in ISO local-date format (yyyy-MM-dd).
          pattern: \S
          type: string
          example: 2026-05-06
          nullable: false
        documentTypes:
          description: "Document types (free-form tags such as <code>invoice</code>,\
            \ <code>receipt</code>, <code>contract</code>, <code>HR</code>). Defaults\
            \ to an empty list when omitted."
          type: array
          items:
            type: string
          example: []
        senderName:
          description: Display name of the sender.
          type: string
          example: ABC AG
        description:
          description: Display description shown in eArchive.
          type: string
          example: Invoice file
    ArchiveUploadRequest:
      description: Single file to archive together with its metadata. Standard / large-file
        routing is decided automatically by the adapter from the request <code>Content-Length</code>;
        callers do not need to flag large uploads explicitly.
      type: object
      properties:
        file:
          allOf:
          - $ref: '#/components/schemas/BinaryFileV2'
          - description: |-
              The binary file to upload to the ePost archive.<br>
              The file must be provided as part of a multipart/form-data request and must not exceed &le; 200MB.<br>
              Supported file types are [ .pdf, .jpg, .png, .gif, .xlsx,  .docx, .txt, .rtf].
        metadata:
          description: metadata
          required:
          - fileName
          - documentTitle
          - documentReferenceDate
          type: object
          properties:
            fileName:
              description: Original file name (with extension).
              pattern: \S
              type: string
              example: sample.xlsx
              nullable: false
            documentTitle:
              description: Display title shown in eArchive.
              pattern: \S
              type: string
              example: sample
              nullable: false
            documentReferenceDate:
              description: Reference date of the document in ISO local-date format
                (yyyy-MM-dd).
              pattern: \S
              type: string
              example: 2026-05-06
              nullable: false
            documentTypes:
              description: "Document types (free-form tags such as <code>invoice</code>,\
                \ <code>receipt</code>, <code>contract</code>, <code>HR</code>). Defaults\
                \ to an empty list when omitted."
              type: array
              items:
                type: string
              example: []
            senderName:
              description: Display name of the sender.
              type: string
              example: ABC AG
            description:
              description: Display description shown in eArchive.
              type: string
              example: Invoice file
        directoryIds:
          description: |-
            The IDs of the archive directories in which the uploaded document should be stored.
            All provided directory IDs must belong to the authenticated tenant. If no directory ID is provided, the document is stored without a directory assignment.
          type: array
          items:
            type: string
    ArchiveUploadResponse:
      description: Response returned after a document is successfully archived.
      type: object
      properties:
        documentId:
          description: Identifier of the newly archived document.
          type: string
          example: 6a028c8e3a805659063bde2f
        fileName:
          description: File name of the stored document (post sanitization).
          type: string
          example: Invoice_2026_05_08.pdf
        documentTitle:
          description: Display title of the archived document.
          type: string
          example: Invoice 2026-05-08
        documentReferenceDate:
          description: Reference date of the document (yyyy-MM-dd).
          type: string
          example: 2026-05-08
        description:
          description: |-
            Display description of the archived document.<br>
            Sourced from the BFF response field <code>documentDescription</code> and renamed here to <code>description</code> so the public API uses one consistent term across request and response.
          type: string
          example: Monthly partner export for invoicing reconciliation
        directoryIds:
          description: |-
            Directory ids the document is stored in, as resolved by the eArchive backend (after permission checks and root-directory normalization). Omitted when the document is stored at the root.<br>
            Sourced from the BFF response field <code>folderIds</code> and renamed here to <code>directoryIds</code> so the public API uses one consistent term across request and response.
          type: array
          items:
            type: string
          example:
          - 637b04533b81694d793c2159
        createdBy:
          description: User identifier (typically email) that created the document.
          type: string
          example: kiendong2411@axongroupio.ch
        createdDate:
          description: Creation timestamp in ISO-8601 format (UTC).
          type: string
          example: 2026-05-12T02:12:30.691Z
        updatedBy:
          description: User identifier (typically email) of the last update. Equal
            to <code>createdBy</code> on initial upload.
          type: string
          example: kiendong2411@axongroupio.ch
        updatedDate:
          description: Last update timestamp in ISO-8601 format (UTC). Equal to <code>createdDate</code>
            on initial upload.
          type: string
          example: 2026-05-12T02:12:30.691Z
        link:
          allOf:
          - $ref: '#/components/schemas/ArchiveUploadResponseLink'
          - description: Resource link references for the archived document.
        versionNumber:
          format: int32
          description: Monotonically increasing version number of the document. Starts
            at <code>1</code> on initial upload.
          type: integer
          example: 1
    ArchiveUploadResponseLink:
      description: Resource link references for the archived document.
      type: object
      properties:
        self:
          description: "Self link to the archived document, relative to the eArchive\
            \ backend (<code>{tenantId}/documents/{documentId}</code>)."
          type: string
          example: 064f1c76-ed3e-4d3d-800b-9195e13edcbe/documents/6a028c8e3a805659063bde2f

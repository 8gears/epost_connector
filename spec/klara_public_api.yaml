        code:
          description: Identifier code for each product-should be unique across all
            products
          pattern: \S
          type: string
          example: PRINTANDSENT
          nullable: false
        name:
          description: The name of the product
          type: string
          example: Print and sent
    ProductType:
      description: Type of product used for an article
      enum:
      - SERVICE
      - PRODUCTION
      - TRADE
      - OTHER
      - GIFT_CARD
      - PREPAYMENT
      type: string
    PublicAPIToken:
      description: A public api token object. This object holds info of tokens that
        can be used to access KLARA Public API
      type: object
      properties:
        access_token:
          description: "Token used to access KLARA Public API endpoints, should be\
            \ place at Authorization header of request. Access token is valid only\
            \ for one company tenant"
          type: string
        expires_in:
          format: int64
          description: Amount of time in seconds left that the access token is valid
            for
          type: integer
        refresh_expires_in:
          format: int64
          description: Amount of time in seconds left that the refresh token is valid
            for
          type: integer
        refreshToken:
          description: Token used to renew the access token
          type: string
        token_type:
          description: Type of access token that should be included in the Authorziation
            header of each request
          type: string
    PublicApiAccount:
      description: A master account from Klara's global chart of accounts.
      type: object
      properties:
        id:
          format: int64
          description: Internal identifier of the master account.
          type: integer
          example: 42
        code:
          format: int32
          description: Numeric account code as printed on the chart of accounts.
          type: integer
          example: 1020
        name:
          description: "Localized account name. Resolved against the request's <code>Accept-Language</code>\
            \ and, when <code>legal-form</code> is supplied, against the legal-form-specific\
            \ translation."
          type: string
          example: Bank
        tags:
          description: "Free-text keyword tokens associated with the account, used\
            \ by client-side search. Tokens are delimited by comma or semicolon."
          type: string
          example: bank;konto
        links:
          description: Linked-account references used by report computations.
          type: string
          example: bank_account
        accountReportLinks:
          description: Report-grouping references used to assemble balance-sheet /
            P&L groupings.
          type: string
          example: bank_account
        initialBalanceSheet:
          description: True when the account is part of the initial opening-balance
            sheet.
          type: boolean
          example: false
        visibleFirstFiscalYear:
          description: True when the account is visible during the first fiscal year
            of a new company.
          type: boolean
          example: true
        visibleFromSecondFiscalYear:
          description: True when the account becomes visible from the second fiscal
            year onwards.
          type: boolean
          example: true
        vatAccount:
          description: True when the account is reserved for VAT postings.
          type: boolean
          example: false
        accountReportFilters:
          description: Report-grouping configuration rows attached to this account.
          type: array
          items:
            $ref: '#/components/schemas/PublicApiAccountReportFilter'
        notManuallyAdded:
          description: True when the account was seeded automatically (not added by
            an end user).
          type: boolean
          example: true
    PublicApiAccountDisplaying:
      description: "One account-displaying row for the manual-booking picker. Each\
        \ row is a flat (account × optional sub-account) combination. When the account\
        \ has no sub-account definitions, exactly one row is emitted with the link\
        \ fields set to <code>null</code>. When the account has sub-account link specifications,\
        \ one row is emitted per individual sub-account entry, numbered sequentially\
        \ across all link types with a 0-based counter suffix."
      type: object
      properties:
        combinedCode:
          description: "Picker key. <code>\"&lt;accountCode&gt;-&lt;i&gt;\"</code>\
            \ when a sub-account exists (e.g. <code>\"1020-0\"</code>); the bare account\
            \ code string (e.g. <code>\"3000\"</code>) when <code>linkType</code>\
            \ is <code>null</code>. The suffix index is a flat 0-based counter per\
            \ account, spanning all link types in declaration order."
          type: string
          example: 1020-0
        combinedName:
          description: Picker label. <code>"&lt;accountName&gt; (&lt;subAccountDisplay&gt;)"</code>
            when a sub-account exists (e.g. <code>"Bank (UBS)"</code>); the bare account
            name (e.g. <code>"Bürobedarf"</code>) when <code>linkType</code> is <code>null</code>.
          type: string
          example: Bank (UBS)
        parentAccount:
          allOf:
          - $ref: '#/components/schemas/PublicApiAccount'
          - description: The full master account this row belongs to. Identical across
              every row produced for the same account.
        linkType:
          description: "Link-type category. Identifies the kind of entity the sub-account\
            \ refers to. Common values: <code>VAT_RATE</code>, <code>VAT_CASE</code>,\
            \ <code>BANK</code>, <code>CUSTOMER</code>, <code>SUPPLIER</code>, <code>EMPLOYEE</code>,\
            \ <code>SOCIAL_INSURANCE</code>, <code>TAX_AT_SOURCE</code>, <code>EQUITY</code>,\
            \ <code>TANGIBLE_ASSET</code>, <code>IMMOBILE_TANGIBLE_ASSET</code>, <code>UNFINISHED_PRODUCTS</code>,\
            \ <code>FINISHED_PRODUCTS</code>, <code>NON_BILLED_SERVICES</code>, <code>INVENTORY_CHANGE_MATERIAL</code>,\
            \ <code>INVENTORY_CHANGE_GOODS</code>, <code>LONG_TERM_INTEREST_BEARING</code>,\
            \ <code>OTHER_LONG_TERM_INTEREST_BEARING</code>, <code>GIFT_CARD</code>,\
            \ <code>VARIOUS</code>. <code>null</code> when the account has no sub-account\
            \ definitions."
          type: string
          example: BANK
        linkDisplay:
          description: Human-readable label for the link type in the requested <code>Accept-Language</code>.
            Falls back to the German label when no translation exists for the requested
            language. <code>null</code> when <code>linkType</code> is <code>null</code>.
          type: string
          example: Bank account
        linkOptional:
          description: "<code>true</code> when the sub-account selection is optional\
            \ for the user (link keys are separated by <code>;</code> in the account\
            \ definition); <code>false</code> when selecting a sub-account is mandatory\
            \ (link keys separated by <code>,</code>); <code>null</code> when the\
            \ account has no sub-account definitions."
          type: boolean
          example: false
        specificationItem:
          allOf:
          - $ref: '#/components/schemas/PublicApiFieldEntry'
          - description: The resolved sub-account entry for this row. <code>null</code>
              when the account has no sub-account definitions.
    PublicApiAccountReportFilter:
      description: Report-grouping configuration row attached to a master account.
      type: object
      properties:
        display:
          description: Human-readable label of the report bucket this account contributes
            to.
          type: string
          example: Operating expenses
        linkAccountValue:
          description: Underlying linked-account value used by the accounting engine
            to resolve the bucket.
          type: string
          example: "6000"
    PublicApiAccountingCompany:
      description: Accounting configuration of one company — dunning waiting periods
        plus the canonical company URI.
      type: object
      properties:
        id:
          format: int64
          description: Internal id of the accounting-configuration row. Null when
            no configuration has been persisted yet for the company.
          type: integer
          example: 17
        companyUri:
          description: "Canonical compensation-side URI of the company, of the form\
            \ /luz_compensation/api/{tenant}/companies/{companyId}."
          type: string
          example: /luz_compensation/api/c60d31fa-f335-4957-872a-90b035632081/companies/1
        waitingDunningTime:
          format: int64
          description: Number of days to wait after the invoice due date before starting
            the dunning cycle. Defaults to 5 when no configuration exists yet.
          type: integer
          example: 5
        dunningWaitingTimeLevelOne:
          format: int64
          description: Days to wait between the level-1 dunning notice and the level-2
            escalation. Defaults to 10 when no configuration exists yet.
          type: integer
          example: 10
        dunningWaitingTimeLevelTwo:
          format: int64
          description: Days to wait between the level-2 dunning notice and the level-3
            escalation. Defaults to 10 when no configuration exists yet.
          type: integer
          example: 10
        dunningWaitingTimeLevelThree:
          format: int64
          description: Days to wait between the level-3 dunning notice and the final
            escalation. Defaults to 10 when no configuration exists yet.
          type: integer
          example: 10
    PublicApiArticleSetItem:
      type: object
      properties:
        id:
          description: Id of the article set
          type: string
          example: "1"
        articleName:
          description: Article name of the article
          type: string
          example: Mobile phone
        number:
          description: The number of the article
          type: string
          example: "1"
        productType:
          allOf:
          - $ref: '#/components/schemas/ProductType'
          - description: Product type of the article
            example: PRODUCTION
        price:
          description: Price of the article
          type: number
        vat:
          allOf:
          - $ref: '#/components/schemas/ArticleVat'
          - description: Vat of the article
        optionValues:
          description: Options for the set item if it is a variant
          type: array
          items:
            type: string
        href:
          description: Reference resource link
          type: string
          example: https://api.klara.ch/core/latest/articles/1
    PublicApiBookingDetail:
      description: One debit or credit line of a booking.
      required:
      - accountCode
      - crdrType
      - description
      - amount
      - tags
      - bookingTypeCode
      type: object
      properties:
        id:
          format: int64
          description: Internal id of the booking detail. Assigned by the server on
            creation; omit when sending a new booking.
          type: integer
          example: 1001
        accountCode:
          format: int32
          description: Ledger account number the amount is posted to (Swiss SME chart
            of accounts).
          minimum: 1
          type: integer
          example: 1020
        crdrType:
          description: "Whether this line is a credit or a debit. Allowed values:\
            \ CR, DR."
          type: string
          example: DR
          nullable: false
        description:
          description: Free-text description shown on the journal report.
          pattern: \S
          type: string
          example: Office supplies — invoice 2024-019
          nullable: false
        amount:
          description: Absolute posting amount in the company main currency. Always
            positive; sign is carried by crdrType.
          type: number
          example: 150.0
          nullable: false
        partialPaymentAmount:
          description: "Amount already paid against this line — only used for open-position\
            \ bookings (invoices, credit notes)."
          type: number
          example: 0.0
        tags:
          description: Comma-separated list of string tags. Each tag is free-form
            and should represent a topic that the booking line should be associated
            with. Provide at least one tag per line.
          type: string
          example: "project-alpha,q2"
          nullable: false
        links:
          description: "Comma-separated list of structured links of entities that\
            \ are considered the sub-accounts associated with an account code when\
            \ making a booking line.This string can be empty when no sub-account is\
            \ required for the current account code of the booking line.Each link\
            \ has the format <code>key:uri-path</code>. <strong>Important:</strong>\
            \ the exact URI values — including the tenant UUID and company ID segments\
            \ — are returned verbatim by <code>GET /core/v1/accounting/accounts/account-displaying</code>\
            \ in the account's <code>specificationItem.link</code> field; copy them\
            \ as-is, do not construct them manually.<br/><br/><strong>Supported link\
            \ type keys:</strong><br/><em>Bank / cash sub-accounts</em> (secondary\
            \ dropdown in GUI for accounts 1000, 1020, 1030, 1040, and similar):<br/><ul><li><code>bank_account</code>\
            \ — company bank account; URI from <code>/luzfin_finance/api/{tenant}/companies/{cid}/bank-accounts/{id}</code></li><li><code>cash</code>\
            \ — cash register; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/cash/{id}</code></li><li><code>transfer_account</code>\
            \ — transfer account; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/transfer/{id}</code></li><li><code>interest_bearing_current_account</code>\
            \ — interest-bearing current account; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/interest-bearing-current/{id}</code></li><li><code>non_interest_bearing_current_account</code>\
            \ — non-interest-bearing current account; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/non-interest-bearing/{id}</code></li></ul><em>Counterpart\
            \ links</em> (customer / supplier / employee sub-ledger):<br/><ul><li><code>customer</code>\
            \ — accounts-receivable customer; URI from <code>/luzfin_finance/api/{tenant}/companies/{cid}/customers/{id}</code></li><li><code>supplier</code>\
            \ — accounts-payable supplier; URI from <code>/luzfin_finance/api/{tenant}/companies/{cid}/customers/{id}</code></li><li><code>employee</code>\
            \ — employee (payroll/HR); URI from <code>/luz_compensation/api/{tenant}/companies/{cid}/employees/{id}</code></li></ul><em>Tax\
            \ / VAT links</em>:<br/><ul><li><code>vat_case</code> — VAT case; URI\
            \ from <code>/luz_accounting/api/vat-cases/{id}</code> (obtain from <code>GET\
            \ /core/latest/vat-cases</code>)</li><li><code>vat_rate</code> — master\
            \ VAT rate; URI from <code>/luz_accounting/api/master-vats/{id}</code>\
            \ (obtain from <code>GET /core/v1/accounting/master-vats</code>)</li><li><code>social_insurance</code>\
            \ — social insurance contract; URI from <code>/luz_compensation/api/{tenant}/companies/{cid}/insurance-contracts/{id}</code></li><li><code>tax_at_source</code>\
            \ — tax-at-source (withholding tax) state; URI from <code>/luz_person/api/states/{id}</code></li></ul><em>Asset\
            \ / liability / equity links</em>:<br/><ul><li><code>financial_asset</code>\
            \ — financial asset; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/financial-asset/{id}</code></li><li><code>intangible_asset</code>\
            \ — intangible asset; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/intangible-asset/{id}</code></li><li><code>equity</code>\
            \ — equity account; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/equity/{id}</code></li><li><code>long_term_interest_bearing_liability</code>\
            \ — long-term loan; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/long-term-interest-bearing/{id}</code></li><li><code>statutory_profit_reserve</code>\
            \ — statutory profit reserve; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/statutory-profit-reserve/{id}</code></li><li><code>deferrals</code>\
            \ — accrual/deferral position; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/deferral/{id}</code></li></ul><em>Revenue\
            \ / inventory / other links</em>:<br/><ul><li><code>gift_card</code> —\
            \ gift card; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/gift-cards/{id}</code></li><li><code>not_billed_services</code>\
            \ — unbilled service position; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/not-billed-services/{id}</code></li><li><code>various</code>\
            \ — miscellaneous counterpart; URI from <code>/luz_accounting/api/{tenant}/companies/{cid}/various/{id}</code></li><li><code>inventory_change_goods</code>\
            \ — inventory type (static); URI: <code>/luz_accounting/api/inventory-types/inventory-change-goods</code></li><li><code>inventory_change_material</code>\
            \ — inventory type (static); URI: <code>/luz_accounting/api/inventory-types/inventory-change-material</code></li><li><code>non_billed_services</code>\
            \ — inventory type (static); URI: <code>/luz_accounting/api/inventory-types/non-billed-services</code></li><li><code>finished_products</code>\
            \ — inventory type (static); URI: <code>/luz_accounting/api/inventory-types/finished-products</code></li><li><code>unfinished_products</code>\
            \ — inventory type (static); URI: <code>/luz_accounting/api/inventory-types/unfinished-products</code></li></ul>Multiple\
            \ entries are comma-separated. Leave empty when none apply."
          type: string
          example: "bank_account:/luzfin_finance/api/388c822c-7860-41ae-94ac-330684bb63e0/companies/1/bank-accounts/85,vat_case:/luz_accounting/api/vat-cases/1"
        seq:
          format: int32
          description: "Ordering of the line inside the booking, starting at 0."
          type: integer
          example: 0
        vatAccountCode:
          format: int32
          description: "GUI-style VAT input, used only with <code>autoCalculateVat=true</code>:\
            \ the account the automatically generated VAT counterpart line is posted\
            \ to (the GUI \"VAT account\", e.g. 1170). Required on a VAT-bearing line\
            \ when the line carries a <code>vat_rate</code> link and omits its own\
            \ VAT line. Ignored when <code>autoCalculateVat</code> is false (caller\
            \ pre-splits the lines)."
          type: integer
          example: 1170
        vatTypeDescription:
          description: "How VAT is recorded for this line. Allowed values: INCLUSIVE,\
            \ EXCLUSIVE, NONE."
          type: string
          example: INCLUSIVE
        vatBookingDetailLink:
          description: "URI of the companion VAT booking detail, when one was generated\
            \ automatically."
          type: string
        vatAmount:
          description: "VAT amount carried on this line, in the company main currency."
          type: number
          example: 11.4
        vatRate:
          description: Effective VAT rate (percent) applied to this line.
          type: number
          example: 7.7
        vatRateDisplay:
          description: Display string of the VAT rate as rendered in the UI.
          type: string
          example: 7.7%
        vatBookingDetail:
          description: True when this line is the automatically generated VAT counterpart
            of another line.
          type: boolean
          example: false
        bookingTypeCode:
          description: "Business meaning of the booking line. Allowed values include\
            \ GENERAL_LEDGER, AR_INVOICE, AP_INVOICE, AR_PAYMENT, AP_PAYMENT, AR_CREDIT_NOTE,\
            \ AP_CREDIT_NOTE."
          type: string
          example: GENERAL_LEDGER
          nullable: false
        openPositionStatus:
          description: "Lifecycle of the open position represented by this line. Allowed\
            \ values include OPEN, PARTIALLY_PAID, PAID, CLOSED."
          type: string
          example: OPEN
        creditorReference:
          description: Creditor reference (QR-bill / ISO 11649) attached to the open
            position.
          type: string
        isrReference:
          description: ISR reference number attached to the open position.
          type: string
        isrMember:
          description: ISR participant (member) number of the creditor.
          type: string
        partnerIban:
          description: IBAN of the counterpart used for outgoing payments.
          type: string
        endToEndId:
          description: "Pain.001 end-to-end id, propagated to the outgoing payment\
            \ instruction."
          type: string
        isExcludeVatAmount:
          description: "When true, the gross amount on this line excludes VAT; otherwise\
            \ it includes VAT."
          type: boolean
          example: false
        foreignCurrencyAmount:
          description: "Posting amount in the foreign currency, when the line is booked\
            \ in a non-main currency."
          type: number
        foreignCurrencyUnit:
          description: ISO 4217 code of the foreign currency.
          type: string
          example: EUR
        paidDate:
          format: date-time
          description: Date on which the open position was settled (yyyy-MM-ddT00:00:00Z).
          type: string
          example: 2024-06-15T00:00:00Z
        dueDate:
          format: date-time
          description: Date on which the open position becomes overdue (yyyy-MM-ddT00:00:00Z).
          type: string
          example: 2024-06-30T00:00:00Z
        paymentDate:
          format: date-time
          description: Date on which the payment instruction is scheduled (yyyy-MM-ddT00:00:00Z).
          type: string
          example: 2024-06-28T00:00:00Z
        servicePeriodFrom:
          format: date-time
          description: Start of the service period covered by the line (yyyy-MM-ddT00:00:00Z).
          type: string
          example: 2024-06-01T00:00:00Z
        servicePeriodTo:
          format: date-time
          description: End of the service period covered by the line (yyyy-MM-ddT00:00:00Z).
          type: string
          example: 2024-06-30T00:00:00Z
        paymentPercentage:
          description: Percentage of the open-position amount already settled.
          type: number
          example: 0
        isDunningBlocked:
          description: "When true, dunning reminders are suppressed for this open\
            \ position."
          type: boolean
          example: false
    PublicApiBookingDocument:
      description: Document metadata to attach to (or replace on) an existing accounting
        booking.
      type: object
      properties:
        documentDate:
          format: date
          description: "Date printed on the underlying paper document (e.g. supplier\
            \ invoice date). When omitted or null, the booking's existing documentDate\
            \ is cleared."
          type: string
          example: 2024-06-15
        documentIds:
          description: "Identifiers of supporting documents attached to the booking.\
            \ Replaces the current set on the booking; pass an empty array to clear.\
            \ Obtain each id by first uploading a file with POST /core/latest/companies/{company-id}/documents\
            \ and then copying the returned documentId into this array."
          maxItems: 50
          type: array
          items:
            type: string
          example:
          - "98765"
    PublicApiBookingHeader:
      description: A booking (manual journal entry) together with its debit/credit
        lines.
      required:
      - documentDate
      - bookingDate
      - bookingDetails
      type: object
      properties:
        id:
          format: int64
          description: Internal id of the booking. Assigned by the server on creation;
            omit when sending a new booking.
          type: integer
          example: 12345
        companyId:
          format: int64
          description: Internal id of the company this booking belongs to. Filled
            by the server from the caller's session; ignored on input.
          type: integer
          example: 1
        documentDate:
          format: date-time
          description: "Date printed on the underlying document, e.g. supplier invoice\
            \ date (yyyy-MM-ddT00:00:00Z)."
          type: string
          example: 2024-06-15T00:00:00Z
        bookingDate:
          format: date-time
          description: Effective accounting date of the booking; must fall inside
            an open fiscal year unless confirmDontMindClosingFiscalYear is set (yyyy-MM-ddT00:00:00Z).
          type: string
          example: 2024-06-15T00:00:00Z
          nullable: false
        documentIds:
          description: Ids of supporting documents (uploaded files / e-mails) attached
            to this booking.
          type: array
          items:
            type: string
        businessCase:
          description: Free-text business case label shown on the journal.
          type: string
          example: Office supplies
        snippets:
          description: "Snippet identifiers applied to this booking, copied from the\
            \ booking template."
          type: array
          items:
            type: string
        bookingStatus:
          description: "Status of the booking. Allowed values: DRAFT, BOOKED, CANCELLED."
          type: string
          example: BOOKED
        internalComment:
          description: "Internal comment, visible only to accounting users."
          type: string
        businessCaseId:
          description: "Reference to the business-case document (workflow id) that\
            \ produced this booking, when applicable."
          type: string
        relatedBookingHeaderLinks:
          description: "URIs of bookings that are related to this one (e.g. payment\
            \ ↔ invoice, original ↔ delimitation)."
          type: array
          items:
            type: string
        bookingDetails:
          description: Debit and credit lines of the booking. Must contain at least
            two lines whose debit and credit totals balance.
          minItems: 2
          type: array
          items:
            $ref: '#/components/schemas/PublicApiBookingDetail'
          nullable: false
        invoiceNumber:
          description: Invoice number printed on the document.
          type: string
          example: 2024-019
        orderManagementInvoiceLink:
          description: Klara order-management invoice URI when the booking was generated
            from a Klara invoice.
          type: string
        bookingTemplateId:
          format: int64
          description: Id of the booking template the user picked when creating this
            entry.
          type: integer
          example: 501
        bookingTitle:
          description: Short title of the booking shown in lists.
          type: string
          example: Office supplies — June 2024
        totalAmount:
          description: "Sum of the absolute amounts of the booking lines, in the company\
            \ main currency."
          type: number
          example: 150.0
        bookingTypeCode:
          description: "Business meaning of the booking. Allowed values include GENERAL_LEDGER,\
            \ AR_INVOICE, AP_INVOICE, AR_PAYMENT, AP_PAYMENT, AR_CREDIT_NOTE, AP_CREDIT_NOTE."
          type: string
          example: GENERAL_LEDGER
    PublicApiBookingType:
      description: A master booking type from Klara's global accounting catalog.
      type: object
      properties:
        code:
          description: Stable machine-readable code of the booking type.
          enum:
          - GENERAL_LEDGER
          - AP_INVOICE
          - AP_PAYMENT
          - AR_INVOICE
          - AR_PAYMENT
          - AP_PREPAYMENT
          - AP_PREPAYUSE
          - AR_PREPAYMENT
          - AR_PREPAYUSE
          - AR_CREDITNOTE
          - AR_CREDITUSE
          - AP_CREDITNOTE
          - AP_CREDITUSE
          - AMORTIZATION
          - SELLOFF_AMORTIZATION
          - DELIMIT
          type: object
          example: AP_INVOICE
        description:
          description: Localized human-readable description of the booking type. Resolved
            against the request's <code>Accept-Language</code> header; falls back
            to the German translation when no translation exists for the requested
            language.
          type: string
          example: Kreditorenrechnung
    PublicApiBusinessCase:
      description: "Hydrated business-case aggregate: template, dates the company-VAT\
        \ and fiscal year resolve to, and the snippet / field tree used by the booking\
        \ form."
      type: object
      properties:
        businessCaseId:
          format: int64
          description: Identifier of the business case instance when persisted; null
            on a freshly hydrated template.
          type: integer
          example: "null"
        businessCaseTemplateId:
          format: int64
          description: Identifier of the business-case template this aggregate was
            hydrated from.
          type: integer
          example: 101
        documentId:
          description: Identifier of the underlying document the business case is
            attached to; null when the booking is not yet linked to a document.
          type: string
          example: "null"
        display:
          description: Pre-translated display label of the business-case template
            for the request's Accept-Language.
          type: string
          example: Bürobedarf
        bookingNumbers:
          description: Comma-separated list of booking numbers already generated for
            this business case; empty on a fresh template.
          type: string
          example: ""
        effectiveCompanyVatDate:
          format: date
          description: Date used to resolve the company-VAT regime applicable to this
            business case (ISO yyyy-MM-dd).
          type: string
          example: 2024-06-15
        documentDate:
          format: date
          description: Document date associated with the business case (ISO yyyy-MM-dd).
          type: string
          example: 2024-06-15
        effectiveFiscalYearDate:
          format: date
          description: Date used to resolve the fiscal year applicable to this business
            case (ISO yyyy-MM-dd).
          type: string
          example: 2024-06-15
        fiscalYearHasCreatedAuto:
          description: True when the downstream service had to auto-create the fiscal
            year covering the resolved date.
          type: boolean
          example: false
        withOP:
          description: True when this business case is tracked as an open item (OP).
            May be null when not applicable.
          type: boolean
          example: false
        fields:
          description: "Recursive snippet-and-field tree driving the booking form,\
            \ keyed by snippet code. The shape of each entry follows the downstream\
            \ BusinessCaseField model (see analysis report §8.2)."
          type: object
          additionalProperties:
            type: object
          example:
            PAYMENT:
              snippetId: 42
              nestedFields: {}
        entriesDefinition:
          description: Per-field entries definitions used by the booking form to resolve
            enum-like fields. Each entry mirrors the downstream FieldEntriesDefinition
            model (see analysis report §8.2).
          type: array
          items:
            type: object
            additionalProperties:
              type: object
    PublicApiBusinessCasePeriod:
      description: A financial-year period and the business-case templates valid for
        the company within it.
      type: object
      properties:
        companyId:
          format: int64
          description: Internal id of the company this period belongs to.
          type: integer
          example: 1
        periodFrom:
          format: date
          description: Inclusive start date of the financial year (ISO yyyy-MM-dd).
          type: string
          example: 2024-01-01
        periodTo:
          format: date
          description: Inclusive end date of the financial year (ISO yyyy-MM-dd).
          type: string
          example: 2024-12-31
        legalForm:
          description: "Legal form of the company during this period. Allowed values\
            \ include EINZEL, GMBH, AG, KOLLEKTIV, KOMMANDIT, GENOSSENSCHAFT, VEREIN,\
            \ STIFTUNG."
          type: string
          example: EINZEL
        companyVat:
          allOf:
          - $ref: '#/components/schemas/PublicApiCompanyVatType'
          - description: VAT regime active during this period.
        status:
          description: "Status of the fiscal year. Allowed values: OPEN, CLOSING,\
            \ CLOSED."
          type: string
          example: OPEN
        businessCaseTemplates:
          description: "Business-case templates valid for the company's legal form\
            \ and VAT regime within this period, sorted by code."
          type: array
          items:
            $ref: '#/components/schemas/PublicApiBusinessCaseTemplate'
    PublicApiBusinessCaseTemplate:
      description: "A manual-journal category usable for bookings, with its catalogue\
        \ code and translations."
      type: object
      properties:
        id:
          format: int64
          description: Internal id of the template in the Klara catalogue.
          type: integer
          example: 101
        code:
          description: Stable catalogue code of the template.
          type: string
          example: OFFICE_SUPPLIES
        display:
          description: "Label of the template, already translated for the request's\
            \ Accept-Language."
          type: string
          example: Bürobedarf
        i18n:
          description: "All translations of the label, keyed by IETF language tag."
          type: object
          additionalProperties:
            type: string
          example:
            de: Bürobedarf
            fr: Fournitures de bureau
        keywordI18ns:
          description: "All translations of the search keywords, keyed by IETF language\
            \ tag."
          type: object
          additionalProperties:
            type: string
          example:
            de: Büro Material
            fr: Fournitures
        group:
          description: Catalogue group the template belongs to.
          type: string
          example: Operating expenses
    PublicApiCompanyVatType:
      description: VAT regime of a company within a fiscal period.
      type: object
      properties:
        id:
          format: int64
          description: Internal id of the company VAT row.
          type: integer
          example: 42
        reportingVat:
          description: "Reporting method used to declare VAT. Allowed values: EFFECTIVE,\
            \ NET_TAX_RATE, FLAT_TAX_RATE."
          type: string
          example: EFFECTIVE
        billing:
          description: "Billing method used to determine VAT liability. Allowed values:\
            \ AGREED, RECEIVED."
          type: string
          example: AGREED
        code:
          description: "Composite VAT code combining reporting method and billing,\
            \ or NON_VAT when the company is not VAT-liable."
          type: string
          example: EFFECTIVE_AGREED
        hasVat:
          description: True when the company is VAT-liable in this period.
          type: boolean
          example: true
        validFrom:
          format: date
          description: Inclusive start date of the VAT regime (ISO yyyy-MM-dd).
          type: string
          example: 2024-01-01
        validTo:
          format: date
          description: Inclusive end date of the VAT regime (ISO yyyy-MM-dd).
          type: string
          example: 2024-12-31
        yearlySettlement:
          description: "True for yearly VAT settlement, false for quarterly/semi-annual."
          type: boolean
          example: false
    PublicApiCrDrType:
      enum:
      - CR
      - DR
      type: string
    PublicApiEmployeeShortInfo:
      description: "Lightweight employee entry (identity, contact and workplace) for\
        \ directory/lookup listings."
      type: object
      properties:
        id:
          format: int64
          description: Employee id. Use this as employeeId in employee-scoped endpoints.
          type: integer
          example: 3487
        firstName:
          description: Employee's first name (resolved from the person record).
          type: string
          example: Anna
        lastName:
          description: Employee's last name (resolved from the person record).
          type: string
          example: Müller
        employeeNumber:
          description: Company-assigned employee number.
          type: string
          example: E-00123
        email:
          description: Employee's primary email (resolved from the person record).
          type: string
          example: anna.mueller@example.com
        workplaceId:
          format: int64
          description: Id of the workplace of the employee's current contract.
          type: integer
          example: 12
        personnelNumber:
          description: Personnel number of the employee.
          type: string
          example: P-4711
        numberOfChildren:
          format: int64
          description: Number of children registered for the employee.
          type: integer
          example: 2
        cashPayment:
          description: Whether the employee is paid in cash.
          type: boolean
          example: false
        status:
          description: "Contract status of the employee. Allowed values: ACTIVE, INACTIVE,\
            \ DRAFT."
          type: string
          example: ACTIVE
    PublicApiFailArticle:
      description: Contain error information and data of unsaved article
      type: object
      properties:
        errorCode:
          description: Error code
          type: string
          example: article.number.could.not.be.duplicated
        errorMessage:
          description: Error message
          type: string
          example: Article number could not be duplicated
        unsavedArticle:
          allOf:
          - $ref: '#/components/schemas/Article'
          - description: Article data which could not be saved
    PublicApiFieldEntry:
      description: One concrete sub-account choice; carries the URI to round-trip
        to the booking endpoint and the display label.
      type: object
      properties:
        id:
          description: "Stable identifier of the underlying entity (e.g. bank-account\
            \ id, VAT-rate id, customer id). May be <code>null</code> for synthesized\
            \ entries."
          type: string
          example: "42"
        filteredBy:
          description: Optional filter token used by the Accounting UI to narrow the
            picker. Empty for most link types.
          type: string
          example: ""
        display:
          description: "Human-readable label shown in the picker (e.g. <code>\"UBS\"\
            </code> for a bank account, <code>\"8.1 %\"</code> for a VAT rate)."
          type: string
          example: UBS
        link:
          description: Canonical URI for this sub-account choice. MUST be round-tripped
            verbatim to the booking-creation endpoint when the row is selected.
          type: string
          example: bank_account:/luz_finance/api/5fe76717-60a0-4b20-9819-255a957f3eb9/companies/1/bank-accounts/42
        additionalAttribute:
          description: Free-form additional attribute attached by the link-type supplier.
            Most types leave this empty.
          type: string
          example: ""
        snippetReference:
          description: Optional snippet reference returned by the underlying entity
            (used by some link types to carry a template hint).
          type: string
          example: ""
        value:
          description: Optional raw value associated with the entry (e.g. the VAT
            percentage as a decimal string).
          type: string
          example: "8.1"
        validFrom:
          format: date
          description: Inclusive start of the validity window of the underlying entity
            (ISO <code>yyyy-MM-dd</code>). <code>null</code> when not applicable.
          type: string
          example: 2024-01-01
        validTo:
          format: date
          description: Inclusive end of the validity window of the underlying entity
            (ISO <code>yyyy-MM-dd</code>). <code>null</code> when open-ended.
          type: string
          example: 2024-12-31
    PublicApiMasterVat:
      description: "Global master VAT row: code, rate, validity range and translated\
        \ labels."
      type: object
      properties:
        id:
          format: int64
          description: Internal id of the master VAT row.
          type: integer
          example: 12
        vatCode:
          description: Short numeric VAT code as configured in the Klara accounting
            plan.
          type: string
          example: "1"
        rate:
          description: VAT rate as a percentage value (8.10 means 8.10 %).
          type: number
          example: 8.1
        validFrom:
          format: date
          description: Inclusive start date of the validity range (ISO yyyy-MM-dd).
            May be null when open-ended.
          type: string
          example: 2024-01-01
        validTo:
          format: date
          description: Inclusive end date of the validity range (ISO yyyy-MM-dd).
            May be null when open-ended.
          type: string
          example: 2030-12-31
        defaultVat:
          description: True when the row is one of the company-default VAT entries.
          type: boolean
          example: true
        masterVatMulties:
          description: Localized labels keyed by language tag.
          type: array
          items:
            $ref: '#/components/schemas/PublicApiMasterVatMulti'
        referenceVatCaseId:
          description: Optional reference to a hidden VAT case id not directly mapped
            to a master VAT.
          type: string
          example: VC-7
        createDate:
          format: date-time
          description: Timestamp when the row was created (ISO yyyy-MM-dd'T'HH:mm:ss).
          type: string
          example: 2024-01-01T08:00:00
        updateDate:
          format: date-time
          description: Timestamp of the last update (ISO yyyy-MM-dd'T'HH:mm:ss).
          type: string
          example: 2024-06-15T14:30:00
    PublicApiMasterVatMulti:
      description: Translated label of a master VAT row.
      type: object
      properties:
        id:
          format: int64
          description: Internal id of the translation row.
          type: integer
          example: 101
        language:
          description: Language tag of the translation (ISO 639-1).
          type: string
          example: de
        description:
          description: Human-readable VAT description in the matching language.
          type: string
          example: Normalsatz 8.1 %
    PublicApiSuitableOpenPosition:
      description: "An accounting open-position booking detail line returned by the\
        \ bank-reconciliation suggestion service. Carries the canonical booking-detail\
        \ fields plus reconciliation-specific enrichments (partner-name display, business-case\
        \ message id, computed open amount)."
      type: object
      properties:
        id:
          format: int64
          description: Booking-detail row id (database primary key).
          type: integer
          example: 98765
        bookingHeaderId:
          format: int64
          description: Id of the booking header this detail belongs to.
          type: integer
          example: 4321
        bookingHeaderComment:
          description: Free-text comment of the booking header.
          type: string
          example: Invoice 2026-0123 from Migros AG
        businessCaseId:
          format: int64
          description: Id of the parent business case.
          type: integer
          example: 12345
        accountCode:
          description: Numeric account code on which the booking is posted.
          type: string
          example: "1100"
        accountLinkDisplay:
          description: Localized account label.
          type: string
          example: Forderungen aus L+L
        crdrType:
          description: Credit / debit indicator.
          enum:
          - CR
          - DR
          type: object
          example: DR
        description:
          description: Free-text description of the booking line.
          type: string
          example: Rechnung Nr. 2026-0123
        bookingTypeCode:
          description: Stable booking-type code of the underlying business case.
          enum:
          - GENERAL_LEDGER
          - AP_INVOICE
          - AP_PAYMENT
          - AR_INVOICE
          - AR_PAYMENT
          - AP_PREPAYMENT
          - AP_PREPAYUSE
          - AR_PREPAYMENT
          - AR_PREPAYUSE
          - AR_CREDITNOTE
          - AR_CREDITUSE
          - AP_CREDITNOTE
          - AP_CREDITUSE
          - AMORTIZATION
          - SELLOFF_AMORTIZATION
          - DELIMIT
          type: object
          example: AR_INVOICE
        openPositionStatus:
          description: Open-position lifecycle status.
          enum:
          - OPEN
          - PARTLY_PAID
          - PAID
          - PARTLY_CLEARED
          - CLEARED
          type: object
          example: OPEN
        amount:
          description: Gross posted amount of the booking line.
          type: number
          example: 1250.0
        partialPaymentAmount:
          description: Sum of payments / clearings already applied to this position.
          type: number
          example: 0.0
        openAmount:
          description: Computed remaining amount still to be cleared (<code>amount
            - partialPaymentAmount</code>).
          type: number
          example: 1250.0
        vatAmount:
          description: VAT amount included in the gross posting.
          type: number
          example: 94.05
        vatRate:
          description: VAT rate applied to the line as a decimal (e.g. <code>0.077</code>).
          type: number
          example: 0.081
        vatRateDisplay:
          description: Localized VAT-rate display string.
          type: string
          example: 8.1 %
        vatBookingDetailLink:
          description: "Self-link of the companion VAT booking-detail line, when present."
          type: string
        vatBookingDetail:
          description: Whether this row is itself a derived VAT booking-detail line.
          type: boolean
          example: false
        foreignCurrencyAmount:
          description: "Posted amount in the document's foreign currency, when applicable."
          type: number
          example: 1250.0
        foreignCurrencyUnit:
          description: ISO-4217 currency code of <code>foreignCurrencyAmount</code>.
          type: string
          example: EUR
        tags:
          description: Free-form tag string attached to the booking line.
          type: string
          example: test manual
        documentDate:
          format: date
          description: Document (invoice) date of the underlying business case.
          type: string
          example: 2026-04-15
        bookingDate:
          format: date
          description: Date the booking was journaled.
          type: string
          example: 2026-04-15
        paidDate:
          format: date
          description: "Date the position was last (partially) paid, if any."
          type: string
          example: 2026-05-10
        dueDate:
          format: date
          description: Due date for payment.
          type: string
          example: 2026-05-15
        paymentDate:
          format: date
          description: Effective payment date of the booking line.
          type: string
          example: 2026-05-12
        servicePeriodFrom:
          format: date
          description: Inclusive lower bound of the service period this booking covers.
          type: string
          example: 2026-04-01
        servicePeriodTo:
          format: date
          description: Inclusive upper bound of the service period this booking covers.
          type: string
          example: 2026-04-30
        createDate:
          format: date-time
          description: Timestamp at which the booking detail was created.
          type: string
          example: 2026-04-15T08:30:00
        updateDate:
          format: date-time
          description: Timestamp at which the booking detail was last updated.
          type: string
          example: 2026-05-12T14:15:00
        documentId:
          description: List of document ids attached to the booking line.
          type: array
          items:
            type: string
          example:
          - "1771764"
        partnerName:
          description: Resolved partner display name for the position.
          type: string
          example: Migros AG
        bookingDetailUri:
          description: "Stable URI of the booking-detail row, for cross-service linking."
          type: string
          example: "/api/luz_accounting/api/{tenantId}/companies/{companyId}/booking-headers/4321/booking-details/98765"
        orderManagementInvoiceLink:
          description: "Self-link of the linked order-management invoice, when applicable."
          type: string
        orderManagementInvoiceNumber:
          description: Resolved order-management invoice number for display.
          type: string
          example: INV-2026-0123
        msgId:
          description: "Business-case message id, used by the eletter / inbox subsystems."
          type: string
          example: MSG-7788
        creditorReference:
          description: Creditor reference (Swiss QR-IBAN reference number) of the
            position.
          type: string
        isrReference:
          description: "ISR reference of the position, when applicable."
          type: string
        isrMember:
          description: "ISR member number, when applicable."
          type: string
        partnerIban:
          description: IBAN of the partner / counterparty.
          type: string
        endToEndId:
          description: End-to-end identifier carried on the bank transaction.
          type: string
    PublicApiVatProfile:
      description: The company's VAT reporting profile.
      type: object
      properties:
        hasVat:
          description: Whether the company is VAT-registered.
          type: boolean
          example: true
        reportingMode:
          description: VAT regime. EFFECTIVE_CLEARING or REPORTING_USING_NET_TAX_RATES.
          type: string
          example: EFFECTIVE_CLEARING
        billing:
          description: Billing method. BILLED or COLLECTED.
          type: string
          example: BILLED
        sss1:
          description: "Flat net-tax rate 1 (percent), when reporting under net tax\
            \ rates."
          type: number
          example: 1.0
        sss2:
          description: "Flat net-tax rate 2 (percent), when reporting under net tax\
            \ rates."
          type: number
          example: 0.5
    PublicApiVatSuggestion:
      description: A ready-to-use VAT case/rate/account bundle.
      type: object
      properties:
        label:
          description: Human-meaningful label. Use it as the option text in the VAT-rate
            dropdown.
          type: string
          example: Domestic purchase — 8.1%
        recommended:
          description: True on the server's recommended default bundle — preselect
            this row in the dropdowns.
          type: boolean
          example: true
        reason:
          description: Why this bundle is suggested.
          type: string
          example: Default VAT rate for DOMESTIC_PURCHASE.
        vatCaseCode:
          description: VAT case code. Group rows by this value to build the VAT-case
            dropdown.
          type: string
          example: DOMESTIC_PURCHASE
        vatCaseLink:
          description: Verbatim link to copy into a booking line's links (comma-joined
            with vatRateLink).
          type: string
          example: vat_case:/luz_accounting/api/vat-cases/1
        vatRateDisplay:
          description: Display string of the VAT rate — the VAT-rate dropdown option
            within the selected VAT case.
          type: string
          example: 8.1%
        vatRateLink:
          description: Verbatim link to copy into a booking line's links (comma-joined
            with vatCaseLink).
          type: string
          example: vat_rate:/luz_accounting/api/master-vats/59
        vatAccountCode:
          format: int32
          description: Suggested VAT account for the generated VAT line — preselect
            this in the VAT-account dropdown; the first of vatAccountCodes (confirm
            against your chart of accounts).
          type: integer
          example: 1170
        vatAccountCodes:
          description: All VAT accounts the company's chart maps to this account +
            VAT case; the options for the GUI's VAT-account dropdown.
          type: array
          items:
            format: int32
            type: integer
          example:
          - 1170
          - 1171
        previewNet:
          description: Net amount preview — the Debit/Credit preview shown in the
            GUI. Null until an amount is supplied; refreshes when amount/amountKind
            change.
          type: number
          example: 925.93
        previewVat:
          description: VAT amount preview — the VAT portion shown in the GUI. Null
            until an amount is supplied; refreshes when amount/amountKind change.
          type: number
          example: 74.07
    PublicApiVatType:
      description: A VAT-type row from Klara's global VAT-type catalogue.
      type: object
      properties:
        vatTypeCode:
          description: Klara VAT-type code that identifies the row.
          type: string
          example: M81
        companyType:
          description: Company-type bucket the VAT type applies to.
          type: string
          example: LIMITED_LIABILITY
        description:
          description: "Localized description, resolved against the request <code>Accept-Language</code>\
            \ header (German fallback)."
          type: string
          example: Vorsteuer Material- und Dienstleistungsaufwand
        vatTypeShortName:
          description: "Localized short name, resolved against the request <code>Accept-Language</code>\
            \ header (German fallback)."
          type: string
          example: VSt MA
        i18n:
          description: Raw description translations keyed by lowercase IETF language
            tag. Useful when a client renders its own language picker; otherwise prefer
            the resolved <code>description</code> field.
          type: object
          additionalProperties:
            type: string
        i18nShortName:
          description: Raw short-name translations keyed by lowercase IETF language
            tag.
          type: object
          additionalProperties:
            type: string
        vatTypeFormula:
          description: "Posting formulas attached to this VAT type, one per associated\
            \ VAT case."
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/PublicApiVatTypeFormula'
    PublicApiVatTypeFormula:
      description: Posting formula attached to a Klara VAT type.
      type: object
      properties:
        vatCaseCode:
          description: Linked VAT-case code this formula belongs to.
          type: string
          example: VAT_RECEIVABLE
        vatTypeCode:
          description: VAT-type code this formula belongs to.
          type: string
          example: M81
        companyType:
          description: Company-type bucket the formula applies to.
          type: string
          example: LIMITED_LIABILITY
        account:
          description: Account number on which the VAT entry is booked.
          type: string
          example: "2200"
        contraAccount:
          description: Contra-account number for the VAT entry.
          type: string
          example: "1170"
        linkedBookingAccount:
          description: "Linked auxiliary account, when applicable."
          type: string
          example: "2201"
        specialRatesType:
          description: Special-rates flag (enum name from the upstream model). Surfaced
            as a string so future internal enum additions stay backwards compatible.
          type: string
          example: STANDARD
        value:
          description: Formula value flag (enum name from the upstream model). Surfaced
            as a string for forward compatibility.
          type: string
          example: NORMAL
    QrCodeAddress:

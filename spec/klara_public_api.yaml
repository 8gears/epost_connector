    SendInvoiceResult:
      description: "Result of sending a single, already-booked invoice. Reports whether\
        \ the invoice was delivered, whether the channel was auto-selected (smart\
        \ delivery), the channel actually used, the OneAPI delivery id and the archived\
        \ PDF's printedFileId."
      type: object
      properties:
        delivered:
          description: <code>true</code> when delivery was confirmed via the channel
            actually used.
          type: boolean
          example: true
        smart:
          description: "<code>true</code> when the channel was auto-selected (smart\
            \ delivery, i.e. no <code>channel</code> was forced); <code>false</code>\
            \ when a channel was forced."
          type: boolean
          example: true
        channel:
          description: The channel actually used to deliver the invoice. For physical
            post this is the resolved postage method (e.g. <code>A_POST</code>).
          enum:
          - A_POST
          - B_POST
          - SEND_EMAIL
          - PRINT_AND_MANUAL_SEND
          - EPOST
          - EBILL
          type: object
          example: SEND_EMAIL
        deliveryId:
          description: "OneAPI delivery id, when available (forced sends only; <code>null</code>\
            \ for smart delivery)."
          type: string
          example: 9b1f4c8e-2d3a-4f6b-8c7d-1e2f3a4b5c6d
        printedFileId:
          description: The printedFileId of the archived invoice PDF rendered/reused
            during the send.
          type: string
          example: "1771764"
    SenderAddress:

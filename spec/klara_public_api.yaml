  /core/latest/bookings:
    post:
      tags:
      - Accounting
      summary: Create a new manual booking for the authenticated company.
      description: Records a manual journal entry against the authenticated caller's
        company and returns the persisted booking with its server-assigned identifiers.
        The booking must contain at least two debit/credit lines whose totals balance
        — the downstream service rejects unbalanced postings. By default the <code>bookingDate</code>
        must fall inside an open fiscal year; set <code>confirmDontMindClosingFiscalYear</code>
        to <code>true</code> to accept a booking that targets a closing fiscal year.
        Set <code>ignore-unsubscripted-dates</code> to <code>true</code> to bypass
        the subscription-period guard that normally rejects bookings outside the active
        Klara Accounting subscription window. Tenant and company are derived from
        the bearer token — the request body's <code>id</code> and <code>companyId</code>
        are ignored. The caller must hold the <code>ACCOUNTING</code> permission on
        the targeted company.
      operationId: createBooking
      parameters:
      - name: autoCalculateVat
        in: query
        description: "When <code>true</code>, the server recalculates VAT like the\
          \ Manual booking GUI: each VAT-bearing line sends a single gross/net <code>amount</code>\
          \ + a <code>vat_rate</code> link + <code>vatAccountCode</code> + <code>isExcludeVatAmount</code>\
          \ and <strong>omits</strong> its VAT counterpart line; the server derives\
          \ the net/VAT split and generates the VAT line so the entry balances. When\
          \ <code>false</code> (default), the caller must pre-split and pre-compute\
          \ every line (current behaviour). Obtain valid VAT values from <code>GET\
          \ /core/latest/vat-cases</code> and <code>GET /core/latest/accounting/master-vats</code>."
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      - name: confirmDontMindClosingFiscalYear
        in: query
        description: "When <code>true</code>, accept the booking even if its <code>bookingDate</code>\
          \ falls in a closing fiscal year. Defaults to <code>false</code>."
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      - name: ignore-unsubscripted-dates
        in: query
        description: "When <code>true</code>, accept the booking even if its date\
          \ falls outside the active Klara Accounting subscription period. Defaults\
          \ to <code>false</code>."
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      - name: Accept-Language
        in: header
        description: "Preferred language for any localized error messages produced\
          \ downstream. Examples: de-CH, fr-CH, it-CH, en. Defaults to the tenant's\
          \ configured language when omitted."
        schema:
          type: string
          example: de-CH
        example: de-CH
      requestBody:
        description: "The booking to create, including its at-least-two balanced debit/credit\
          \ lines.<br/><br/><strong>Prerequisite APIs — call these first to obtain\
          \ valid values:</strong><br/><ul><li><code>GET /core/latest/accounting/accounts</code>\
          \ → provides valid <code>accountCode</code> values (e.g. 1020, 1100, 2000,\
          \ 3200). Only use this endpoint when you want to implement a seperate combobox\
          \ with a flat master account list without sub-account context.</li><li><code>GET\
          \ /core/latest/accounting/accounts/account-displaying</code> → provide full\
          \ details about all valid, selectable accounts (combine name, combine code,\
          \ master account, sub-account details when available). <strong>PREFERRED</strong>\
          \ to use this endpoint as the booking line for some account code <strong>MUST</strong>\
          \ include sub-account links if the sub-account exists.</li><li><code>POST\
          \ /core/latest/companies/{company-id}/documents</code> → upload supporting\
          \ documents (invoices, receipts, bank statements) and collect the returned\
          \ <code>documentId</code> values to populate <code>documentIds</code>. <strong>This\
          \ step should be done BEFORE invoking the booking creation</strong>. <strong>Important:</strong>\
          \ when calling this endpoint for booking creation, always use <code>category\
          \ = LIABILITY_UPLOAD</code> — no other category is permitted in this context\
          \ (the documents are automatically moved to <code>LIABILITIES</code> when\
          \ the booking is created successfully). The GUI for booking creation must\
          \ always provide a document-upload step using the <code>LIABILITY_UPLOAD</code>\
          \ category.</li><li><code>GET /core/latest/accounting/booking-types</code>\
          \ → provides valid <code>bookingTypeCode</code> values (e.g. AR_PAYMENT,\
          \ AP_INVOICE, GENERAL_LEDGER)</li><li><code>GET /core/latest/vat-cases</code>\
          \ → provides VAT case IDs for the <code>vat_case</code> link key</li><li><code>GET\
          \ /core/latest/accounting/master-vats</code> → provides master VAT rate\
          \ IDs for the <code>vat_rate</code> link key</li><li><code>GET /core/latest/accounting/vat-suggestions?direction=PURCHASE|SALE&amp;amount=…\
          &amp;date=…</code> → <strong>RECOMMENDED for VAT.</strong> Returns ready-to-use\
          \ bundles; from the <code>recommended</code> row copy <code>vatCaseLink</code>\
          \ and <code>vatRateLink</code> straight into the line's <code>links</code>\
          \ (comma-joined) and <code>vatAccountCode</code> onto the line. Use with\
          \ <code>autoCalculateVat=true</code> (see VAT auto-calculation below).</li><li><code>GET\
          \ /core/latest/accounting/vat-profile?date=…</code> → the company VAT regime\
          \ (effective vs net-tax-rate). Informational: it explains how the server\
          \ will split the amount; you do not copy it into the booking.</li></ul><strong>Top-level\
          \ fields:</strong><br/><ul><li><code>id</code> (long) — Server-assigned.\
          \ Set to <code>0</code> for new bookings.</li><li><code>companyId</code>\
          \ (long) — Server-derived from token. Set to <code>0</code>.</li><li><code>bookingDate</code>\
          \ (string, yyyy-MM-ddT00:00:00Z, <strong>required</strong>) — Must fall\
          \ in an open fiscal year.</li><li><code>documentIds</code> (array of string)\
          \ — IDs of attached documents (gather from <code>POST /core/latest/companies/{company-id}/documents</code>\
          \ with <code>category = LIABILITY_UPLOAD</code>). The documents are automatically\
          \ moved to <code>LIABILITIES</code> on success booking creation. <strong>A\
          \ GUI implementing booking creation must always provide a document-upload\
          \ step</strong> — omitting it is only acceptable for purely internal adjustments\
          \ where no document exists, in which case <code>documentIds</code> may be\
          \ left empty (<code>[]</code>).</li><li><code>internalComment</code> (string)\
          \ — Internal note visible only to accounting users.</li><li><code>bookingStatus</code>\
          \ (string) — Allowed: <code>DRAFT</code>, <code>BOOKED</code>, <code>CANCELLED</code>.</li><li><code>bookingDetails</code>\
          \ (array, <strong>required</strong>) — At least 2 balanced debit/credit\
          \ lines (see below).</li><li><code>expand</code> (boolean) — UI hint. Use\
          \ <code>false</code>.</li><li><code>viewDocument</code> (boolean) — UI hint.\
          \ Use <code>false</code>.</li></ul><strong>bookingDetails[] fields:</strong><br/><ul><li><code>id</code>\
          \ (long) — Server-assigned. Set to <code>0</code>.</li><li><code>seq</code>\
          \ (int) — Line order starting at 0.</li><li><code>accountCode</code> (int,\
          \ <strong>required</strong>) — From <code>GET /core/latest/accounting/accounts</code>\
          \ or <code>GET /core/latest/accounting/accounts/account-displaying</code>\
          \ (preferred; includes sub-account context when it exists).</li><li><code>crdrType</code>\
          \ (string, <strong>required</strong>) — <code>DR</code> (debit) or <code>CR</code>\
          \ (credit).</li><li><code>description</code> (string) — Free-text line description.</li><li><code>amount</code>\
          \ (decimal, <strong>required</strong>) — Always positive. Total DR must\
          \ equal total CR.</li><li><code>tags</code> (string, <strong>required</strong>)\
          \ — Comma-separated list of string tags. Each tag should represent a topic\
          \ that the booking line should be associated with, e.g. Operating Expenses.\
          \ Tags are free-form and have no semantic meaning to Klara; they are simply\
          \ stored and returned as-is. Provide at least one tag per line.</li><li><code>links</code>\
          \ (string) — Comma-separated structured links. Two uses: (a) sub-account\
          \ entities for the line's account code (from <code>GET /core/latest/accounting/accounts/account-displaying</code>);\
          \ and (b) VAT links <code>vat_case:…</code> + <code>vat_rate:…</code> (from\
          \ <code>GET /core/latest/accounting/vat-suggestions</code>) when this line\
          \ carries VAT. Can be empty when neither applies.</li><li><code>bookingTypeCode</code>\
          \ (string) — From <code>GET /core/latest/accounting/booking-types</code>.</li><li><code>vatAccountCode</code>\
          \ (int) — <strong>Only with <code>autoCalculateVat=true</code>.</strong>\
          \ The account the generated VAT line posts to (e.g. 1170); from the <code>vatAccountCode</code>\
          \ of a <code>vat-suggestions</code> row.</li><li><code>isExcludeVatAmount</code>\
          \ (boolean) — <strong>Only with <code>autoCalculateVat=true</code>.</strong>\
          \ <code>false</code> = <code>amount</code> includes VAT (gross); <code>true</code>\
          \ = <code>amount</code> excludes VAT (net base).</li><li><code>isrReference</code>\
          \ (string) — ISR/QR-bill reference. Empty if not applicable.</li><li><code>isrMember</code>\
          \ (string) — ISR participant number. Empty if not applicable.</li><li><code>partnerIban</code>\
          \ (string) — Counterpart IBAN for payments. Empty if not applicable.</li><li><code>vatBookingDetail</code>\
          \ (boolean) — Set to <code>false</code> for manual lines.</li></ul><strong>VAT\
          \ auto-calculation (<code>autoCalculateVat=true</code>) — book like the\
          \ Manual booking GUI without doing VAT math:</strong><br/><ol><li>Call <code>GET\
          \ /core/latest/accounting/vat-suggestions?direction=PURCHASE|SALE&amp;amount=&lt;gross&gt;&amp;date=&lt;bookingDate&gt;</code>\
          \ and take the <code>recommended</code> row.</li><li>On the VAT-bearing\
          \ line set: <code>links = \"&lt;vatCaseLink&gt;,&lt;vatRateLink&gt;\"</code>\
          \ (both values verbatim from that row), <code>vatAccountCode = &lt;row.vatAccountCode&gt;</code>,\
          \ <code>amount = &lt;your gross or net&gt;</code>, and <code>isExcludeVatAmount</code>\
          \ matching the <code>amountKind</code> you queried (<code>false</code> =\
          \ gross).</li><li><strong>Do NOT add the VAT counterpart line yourself</strong>\
          \ — the server derives the net/VAT split and generates it (matching the\
          \ row's <code>previewNet</code>/<code>previewVat</code>). Provide only your\
          \ account line(s) + the balancing line.</li></ol>The split depends on the\
          \ company VAT regime from <code>vat-profile</code> (effective → net + VAT\
          \ line; net-tax-rate → flat-rate split; reverse-charge → an extra reverse\
          \ VAT line). When <code>autoCalculateVat</code> is omitted/<code>false</code>\
          \ you must instead pre-split and pre-compute every line yourself (see the\
          \ \"Invoice received/sent\" examples).<br/><br/><strong>Rules:</strong>\
          \ Minimum 2 lines; total DR = total CR (after server VAT expansion when\
          \ <code>autoCalculateVat=true</code>); amounts always positive; bookingDate\
          \ in open fiscal year."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicApiBookingHeader'
            examples:
              Money received:
                description: Customer pays an outstanding receivable via bank transfer
                  (AR_PAYMENT). The bank line (1020) uses bank_account in links to
                  identify the receiving bank sub-account.
                value:
                  id: 0
                  companyId: 0
                  bookingDate: 2024-06-15T00:00:00Z
                  documentIds: []
                  internalComment: Customer payment for invoice INV-2024-001
                  bookingStatus: BOOKED
                  expand: false
                  viewDocument: false
                  bookingDetails:
                  - id: 0
                    seq: 0
                    accountCode: 1020
                    crdrType: DR
                    description: Receipt from customer A. Bassi AG
                    amount: 1080.0
                    tags: "sales,project-alpha"
                    links: bank_account:/luzfin_finance/api/388c822c-7860-41ae-94ac-330684bb63e0/companies/1/bank-accounts/85
                    bookingTypeCode: GENERAL_LEDGER
                    partnerIban: CH5604835012345678009
                    isrReference: ""
                    isrMember: ""
                    vatBookingDetail: false
                  - id: 0
                    seq: 1

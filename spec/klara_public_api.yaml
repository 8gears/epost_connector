  /core/v1/bookings/{id}/documents:
    put:
      tags:
      - Accounting
      summary: Replace the document attachments and document date of an existing booking.
      description: "Replaces the set of supporting-document identifiers and the document\
        \ date stored on an existing accounting booking. The operation is a full replacement\
        \ &mdash; pass an empty <code>documentIds</code> array to clear all existing\
        \ attachments, or omit <code>documentDate</code> / set it to <code>null</code>\
        \ to clear it. By default the operation fails when the booking's existing\
        \ <code>bookingDate</code> falls outside the active Klara Accounting subscription\
        \ window; set <code>ignore-unsubscripted-dates</code> to <code>true</code>\
        \ to bypass this guard. Tenant and company are derived from the bearer token\
        \ &mdash; the booking <code>{id}</code> must belong to the caller's company.\
        \ The caller must hold the <code>ACCOUNTING</code> permission on that company.\
        \ The endpoint is idempotent: re-sending the same body produces the same state.\
        \ Returns HTTP 200 with no body on success."
      operationId: updateBookingDocumentsV1
      parameters:
      - name: id
        in: path
        description: Internal id of the booking whose documents should be replaced.
          Obtain from the <code>id</code> field returned by <code>POST /core/v1/bookings</code>.
        required: true
        schema:
          format: int64
          type: integer
          example: 12345
        example: 12345
      - name: ignore-unsubscripted-dates
        in: query
        description: "When <code>true</code>, accept the update even if the booking's\
          \ <code>bookingDate</code> falls outside the active Klara Accounting subscription\
          \ period. Defaults to <code>false</code>."
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      requestBody:
        description: "Document metadata to apply to the booking. The operation is\
          \ a full replacement of both <code>documentDate</code> and <code>documentIds</code>.<br/><br/><strong>Prerequisite\
          \ APIs &mdash; call these first to obtain valid values:</strong><ul><li><code>POST\
          \ /core/v1/bookings</code> &rarr; provides the booking <code>id</code> used\
          \ in the URL.</li><li><code>POST /core/latest/companies/{company-id}/documents</code>\
          \ &rarr; upload the file first and use the returned <code>documentId</code>\
          \ as an entry in <code>documentIds</code>. Each entry is either a numeric\
          \ Klara document id (e.g. <code>\"98765\"</code>) or a Klara document URI.</li></ul><strong>Top-level\
          \ fields:</strong><ul><li><code>documentDate</code> (string, ISO date <code>yyyy-MM-dd</code>,\
          \ optional) &mdash; date printed on the underlying paper document. Set to\
          \ <code>null</code> or omit to clear the existing value.</li><li><code>documentIds</code>\
          \ (array of string, optional, max 50 entries, each &le; 512 chars) &mdash;\
          \ full replacement of the attached document references. Send <code>[]</code>\
          \ to clear.</li></ul><strong>Rules:</strong><ul><li>Replacement semantics\
          \ &mdash; missing or empty <code>documentIds</code> clears all existing\
          \ attachments on the booking.</li><li>The booking must belong to the caller's\
          \ company; tenant and company are derived from the bearer token.</li><li>By\
          \ default the booking's existing <code>bookingDate</code> must fall in an\
          \ active Klara Accounting subscription window; use <code>ignore-unsubscripted-dates=true</code>\
          \ to bypass.</li></ul>"
        content:
          application/json:
            schema:
              description: Document metadata to attach to (or replace on) an existing
                accounting booking.
              type: object
              properties:
                documentDate:
                  format: date
                  description: "Date printed on the underlying paper document (e.g.\
                    \ supplier invoice date). When omitted or null, the booking's\
                    \ existing documentDate is cleared."
                  type: string
                  example: 2024-06-15
                documentIds:
                  description: "Identifiers of supporting documents attached to the\
                    \ booking. Replaces the current set on the booking; pass an empty\
                    \ array to clear. Obtain each id by first uploading a file with\
                    \ POST /core/latest/companies/{company-id}/documents and then\
                    \ copying the returned documentId into this array."
                  maxItems: 50
                  type: array
                  items:
                    type: string
                  example:
                  - "98765"
              example:
                documentDate: 2024-06-15
                documentIds:
                - "98765"
        required: true
      responses:
        "200":
          description: Document attachments and date applied to the booking (or accepted
            as a no-op when the booking does not exist on the downstream side).
        "400":
          description: Data invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/v1/company-bank-accounts:
    get:
      tags:
      - Finance
      summary: List the bank accounts of the authenticated company.
      description: "Returns the bank accounts of the company resolved from the bearer\
        \ JWT, optionally filtered by business <code>type</code>. The caller must\
        \ hold the <code>FINANCE_BANK_ACCOUNT</code> permission on the target company.\
        \ The result is sorted by Swiss-bank name then IBAN. This operation is idempotent\
        \ and read-only — it can be safely retried."
      operationId: listCompanyBankAccounts
      parameters:
      - name: iban-number
        in: query
        description: "Optional IBAN filter. When provided, the response contains the\
          \ single matching bank account (returned as a one-element array for a uniform\
          \ response shape) or HTTP 404 if no account exists with that IBAN. Spaces\
          \ in the IBAN are tolerated. When provided, the <code>type</code> parameter\
          \ is ignored."
        required: false
        schema:
          type: string
          example: CH7109000000252946932
        example: CH7109000000252946932
      - name: type
        in: query
        description: "Optional business-type filter. Allowed values: <code>AR</code>\
          \ (Accounts Receivable), <code>AP</code> (Accounts Payable), <code>HR</code>\
          \ (Salary / HR payments). When omitted, all bank accounts are returned.\
          \ Ignored when <code>iban-number</code> is provided."
        required: false
        schema:
          enum:
          - AR
          - AP
          - HR
          type: string
          example: AR
        example: AR
      responses:
        "200":
          description: Bank accounts of the authenticated company.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyBankAccount'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "404":
          description: Resource not found
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/v1/customers:
    get:
      tags:
      - Customer
      summary: Search and page the customers of the caller's company.
      description: "Returns a page of customers (<code>Persons</code> + <code>Companies</code>)\
        \ of the caller's company, with optional free-text search (<code>search-key</code>)\
        \ and status filter (<code>status</code>). Results are paged with <code>offset</code>\
        \ and <code>limit</code>: to retrieve every customer, iterate <code>offset=0,&nbsp;limit,&nbsp;2&times;limit,&nbsp;…\
        </code> until a response returns fewer than <code>limit</code> rows. All query\
        \ parameters are optional; without any, the endpoint returns the first <code>50</code>\
        \ active customers (downstream default ordering). This is a read-only, idempotent\
        \ operation. <br/><br/>The tenant and company are derived from the JWT (<code>@CurrentSession\
        \ Token</code>) and are never accepted as parameters. The caller must be authenticated\
        \ (<code>apiKeyAuth</code> + <code>bearerAuth</code>) and must hold the <code>FINANCE_GET_CUSTOMER</code>\
        \ permission on that company; otherwise the endpoint returns <code>403</code>."
      operationId: listCustomersV1
      parameters:
      - name: limit
        in: query
        description: Page size. Defaults to <code>50</code>; hard cap <code>100</code>.
          Requests above the cap are rejected with <code>400</code>.
        schema:
          default: "50"
          maximum: 100
          minimum: 1
          type: integer
          example: 50
      - name: offset
        in: query
        description: 0-based pagination offset — the number of customers to skip before
          the returned page. Defaults to <code>0</code>. Combine with <code>limit</code>
          to walk the full list.
        schema:
          default: "0"
          minimum: 0
          type: integer
          example: 0
      - name: search-key
        in: query
        description: "Free-text search across customer <code>name</code>, <code>email</code>,\
          \ <code>phone</code> and <code>customer number</code>. Tokenised on whitespace;\
          \ matches are case-insensitive substring matches. Maximum length 256 characters."
        schema:
          maxLength: 256
          type: string
          example: müller
      - name: status
        in: query
        description: "Filter by customer state. Allowed values: <code>ACTIVE</code>,\
          \ <code>ALL</code>, <code>ARCHIVED</code>. When omitted, the downstream\
          \ service applies its default (active customers only)."
        schema:
          maxLength: 16
          enum:
          - ACTIVE
          - ALL
          - ARCHIVED
          type: string
          example: ACTIVE
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        "400":
          description: Data invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "429":
          description: API rate limit exceeded
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/v1/employees/short-info:
    get:
      tags:
      - Payroll
      summary: "List the company's employees as short-info entries, filtered and sorted."
      description: "Returns a lightweight directory of the authenticated company's\
        \ employees (id, name, email, employee number, workplace, status), resolved\
        \ from the compensation and person records. Each entry's <code>id</code> is\
        \ the <code>employeeId</code> consumed by other employee-scoped endpoints\
        \ (e.g. <code>GET /payroll/employees/{employeeId}/addable-salary-items</code>)\
        \ — call this endpoint first to resolve an employee's id. Results can be narrowed\
        \ with a free-text <code>search-key</code> (matched against name, employee\
        \ number and email), restricted to specific workplaces via <code>workplace-ids</code>,\
        \ and filtered by contract <code>filter-by-status</code>; ordering is controlled\
        \ by <code>sort-field</code> and <code>sort-direction</code>. The tenant and\
        \ company are derived from the authenticated token; the caller must hold the\
        \ <code>COMPENSATION_TIME_TRACKING</code> permission on that company."
      operationId: listEmployeesShortInfo
      parameters:
      - name: filter-by-status
        in: query
        description: "Contract-status filter. Allowed values: ALL, ACTIVE, INACTIVE,\
          \ DRAFT. Defaults to ALL."
        required: false
        schema:
          description: "Contract-status filter. Allowed values: ALL, ACTIVE, INACTIVE,\
            \ DRAFT. Defaults to ALL."
          default: ALL
          enum:
          - ALL
          - ACTIVE
          - INACTIVE
          - DRAFT
          type: string
          example: ALL
        example: ALL
      - name: search-key
        in: query
        description: "Case-insensitive substring matched against the employee's full\
          \ name, employee number and email. When omitted, no text filter is applied."
        required: false
        schema:
          maxLength: 256
          type: string
      - name: sort-direction
        in: query
        description: "Sort direction. Allowed values: ASC, DESC."
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
      - name: sort-field
        in: query
        description: "Field to sort by. Allowed values: NAME, EMAIL, EMPLOYEE_NUMBER.\
          \ Defaults to NAME."
        required: false
        schema:
          description: "Field to sort the employee listing by. Allowed values: NAME,\
            \ EMAIL, EMPLOYEE_NUMBER."
          default: NAME
          enum:
          - NAME
          - EMAIL
          - EMPLOYEE_NUMBER
          type: string
          example: NAME
        example: NAME
      - name: workplace-ids
        in: query
        description: "Restrict results to employees whose current contract workplace\
          \ is in this set. Repeat the parameter for multiple ids (e.g. workplace-ids=12&workplace-ids=13).\
          \ When omitted, employees of all workplaces are returned."
        required: false
        schema:
          type: array
          items:
            format: int64
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicApiEmployeeShortInfo'
        "400":
          description: Data invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage1'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage1'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage1'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/v1/invoices:
    put:
      tags:
      - Finance
      summary: Update an existing DRAFT invoice for the authenticated company.
      description: "Updates a DRAFT invoice identified by <code>invoice.id</code>\
        \ in the request body. Only invoices in <code>DRAFT</code> status can be updated\
        \ — any other status returns 400. If the incoming <code>status</code> is <code>INVOICED</code>\
        \ or <code>SENT</code>, the invoice is booked into KLARA accounting and inventory\
        \ transactions are created, identical to the booking behavior of <code>POST\
        \ /core/v1/invoices</code>. This is the call that finalizes a DRAFT — the\
        \ GUI equivalent of posting in the final step; <strong>status is caller-controlled</strong>,\
        \ so keep it <code>DRAFT</code> to re-save without booking. <strong>This endpoint\
        \ does not send/deliver the invoice</strong> (no email/ePost/eBill/print&amp;send),\
        \ regardless of <code>postMethod</code>; retrieve the PDF via <code>POST /core/v1/invoices/{id}/printed-document</code>\
        \ and deliver it yourself. The caller must hold the <code>FINANCE</code> permission\
        \ on the target company.<br/><br/><strong>Important — finalizing a DRAFT books\
        \ it without a printed invoice.</strong> Setting <code>status=INVOICED</code>/<code>SENT</code>\
        \ here creates the accounting booking but <strong>renders/stores no PDF</strong>.\
        \ To attach the printed invoice to the booking, after this call run (1) <code>POST\
        \ /core/v1/invoices/{id}/printed-document</code> to render and store the <code>printedFileId</code>,\
        \ then (2) <code>PUT /core/v1/bookings/{id}/documents</code> to link that\
        \ <code>printedFileId</code> (in <code>documentIds</code>) to the booking\
        \ from <code>bookingNumbers</code>."
      operationId: updateInvoice
      parameters:
      - name: confirmDontMindClosingFiscalYear
        in: query
        description: "When <code>true</code>, allows save/booking even if the document\
          \ date falls inside a closing or closed fiscal year. Defaults to false."
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      requestBody:
        description: "<strong>Updates an existing DRAFT invoice.</strong> The body\
          \ structure is identical to <code>POST /core/v1/invoices</code> with one\
          \ critical difference: <code>id</code> must be the numeric primary key of\
          \ an existing invoice currently in <code>DRAFT</code> status.<br/><br/><strong>Typical\
          \ flow:</strong><ol><li>Call <code>POST /core/v1/invoices</code> with <code>status=DRAFT</code>\
          \ to create the invoice.</li><li>Call <code>GET /core/v1/invoices/{id}</code>\
          \ to retrieve the current state.</li><li>Modify the desired fields (items,\
          \ amounts, dates, etc.).</li><li>Call this endpoint to update — or to book\
          \ it by changing <code>status</code> to <code>INVOICED</code>/<code>SENT</code>.</li></ol><strong>Prerequisite\
          \ APIs (call these first if modifying related data):</strong><ul><li><code>GET\
          \ /core/v1/invoices/{id}</code> → provides the current invoice body to modify\
          \ and re-submit.</li><li><code>GET /core/v1/company-bank-accounts</code>\
          \ → provides updated <code>ibanNumberCHF</code> / <code>ibanNumberCHW</code>.</li><li><code>GET\
          \ /core/latest/articles/search?keyword=...</code> → search for articles\
          \ to add/change order items.</li><li><code>GET /core/v1/bank-reconciliation/open-positions</code>\
          \ → provides <code>openPositionsLinkedToInvoice[]</code> for reconciliation.</li><li><code>GET\
          \ /core/latest/company-configuration/including-vat</code> → provides <code>usingVAT</code>\
          \ default.</li></ul><br/><strong>Key differences from POST (create):</strong><ul><li><code>id</code>\
          \ (long, required) — must be &gt; 0 and match an existing DRAFT invoice.\
          \ Returns 400 if the stored invoice is not in DRAFT status.</li><li><code>invoiceCode</code>\
          \ — uniqueness is NOT re-validated; retain the original value.</li><li><code>order.id</code>\
          \ — must match the existing order; retain from the original invoice.</li><li><code>status</code>\
          \ — set to <code>INVOICED</code> or <code>SENT</code> to book the invoice\
          \ (triggers accounting); set to <code>DRAFT</code> to save without booking.</li></ul><br/><strong>Top-level\
          \ fields:</strong><ul><li><code>id</code> (long, required) — must be &gt;\
          \ 0 (existing DRAFT invoice id).</li><li><code>invoiceCode</code> (String,\
          \ required) — must not be empty; retain the original value.</li><li><code>orderType</code>\
          \ (String, required) — must be <code>INVOICE</code>.</li><li><code>status</code>\
          \ (String, required) — <code>DRAFT</code> (saves without booking), <code>INVOICED</code>\
          \ (saves and books into accounting), <code>SENT</code> (saves and books;\
          \ does <strong>not</strong> send/deliver the invoice).</li><li><code>postMethod</code>\
          \ (String, optional) — distribution channel recorded on the invoice only;\
          \ not delivered. Allowed: <code>A_POST</code>, <code>B_POST</code>, <code>SEND_EMAIL</code>,\
          \ <code>PRINT_AND_MANUAL_SEND</code>, <code>EPOST</code>, <code>EBILL</code>.</li><li><code>documentDate</code>\
          \ (date, required) — invoice issue date, format <code>yyyy-MM-dd</code>;\
          \ must fall inside the active subscription period.</li><li><code>paymentDate</code>\
          \ (date, required when amount &gt; 0) — must be on or after <code>documentDate</code>.</li><li><code>ibanNumberCHF</code>\
          \ (String, conditional) — CHF IBAN; format validated when provided.</li><li><code>ibanNumberCHW</code>\
          \ (String, optional) — WIR IBAN; format validated when provided.</li><li><code>wirAcceptanceRate</code>\
          \ (int, optional) — WIR acceptance percentage (0–100).</li><li><code>amount</code>\
          \ (BigDecimal, required) — total invoice amount. Caller-supplied; not recomputed\
          \ by the server.</li><li><code>usingVAT</code> (boolean) — GUI checkbox\
          \ <em>\"VAT included in amount of each item\"</em>: item <code>price</code>/<code>amount</code>\
          \ are VAT-inclusive (<code>true</code>, gross) or VAT-exclusive (<code>false</code>,\
          \ net). It does <strong>not</strong> switch VAT on/off. Same VAT-handling\
          \ rules as <code>POST /core/v1/invoices</code> (server stores amounts verbatim).</li><li><code>usingExportVat</code>\
          \ (boolean, optional) — GUI checkbox <em>\"Export\"</em>; when <code>true</code>\
          \ set every <code>orderItems[].vat.rate</code> to <code>0</code>. Defaults\
          \ to <code>false</code>.</li><li><code>subject</code>, <code>ourReference</code>,\
          \ <code>yourReference</code>, <code>companyCityAndDate</code>, <code>closeAndSignature</code>\
          \ — optional text fields.</li></ul><br/><strong>Nested fields — <code>order</code>\
          \ (required):</strong><ul><li><code>order.id</code> (long) — must be the\
          \ existing order id; retain from the original invoice.</li><li><code>order.orderNumber</code>\
          \ (int) — retain from the original invoice.</li><li><code>order.companyId</code>\
          \ (long) — must match the authenticated company; set from bearer token on\
          \ the downstream.</li><li><code>order.customer</code> (object, required)\
          \ — existing customer; retain from original invoice.</li></ul><br/><strong>Nested\
          \ fields — <code>orderItems[]</code> (required, at least 1):</strong><ul><li>Same\
          \ structure as <code>POST /core/v1/invoices</code>. Existing item ids (&gt;\
          \ 0) update items in-place; id = 0 adds new items.</li><li><code>orderItems[].tag</code>\
          \ (String, required when booking) — must not be empty when status is <code>INVOICED</code>/<code>SENT</code>.</li></ul><br/><strong>Nested\
          \ fields — <code>attachments[]</code> and <code>openPositionsLinkedToInvoice[]</code>:</strong><ul><li>Same\
          \ structure and semantics as <code>POST /core/v1/invoices</code>.</li></ul><br/><strong>Validation\
          \ rules:</strong><ul><li><code>id</code> must be &gt; 0 (adapter guard)\
          \ and the stored invoice must be DRAFT (downstream guard).</li><li><code>paymentDate</code>\
          \ must be on or after <code>documentDate</code> when amount &gt; 0.</li><li>IBAN\
          \ format is validated when provided.</li><li>Each <code>orderItems[].tag</code>\
          \ must be present when status triggers booking (<code>INVOICED</code>/<code>SENT</code>).</li><li>Subscription\
          \ for Order Management must be active for <code>documentDate</code>.</li></ul><br/><strong>Server-managed\
          \ fields (same as POST):</strong> <code>vatDate</code>, <code>lastModified</code>,\
          \ <code>createDate</code>, <code>bookingDueDate</code>, <code>bookingNumbers</code>,\
          \ <code>businessCaseId</code>, <code>bookingStatus</code>, <code>bookingMessage</code>,\
          \ <code>bookingSealed</code>."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invoice'
            examples:
              Update DRAFT to INVOICED:
                summary: Book an existing DRAFT invoice by changing status to INVOICED
                value:
                  id: 42
                  invoiceCode: "123457736"
                  paymentDate: 2026-06-28
                  ibanNumberCHF: CH7109000000252946932
                  wirAcceptanceRate: 0
                  invoiceType: MANUAL
                  order:
                    id: 55
                    orderNumber: 377
                    orderName: Updated invoice
                    customer:
                      id: 40
                      company:
                        id: 34
                        name: A. Bassi AG
                        emails:
                        - id: "35"
                          emailAddress: chris.sutter@klara.ch
                          type: PRIVATE
                        addresses:
                        - id: 280
                          companyName: A. Bassi AG
                          type: COMPANY
                          addressType: WORK
                          street: Ahornstrasse
                          homeNumber: "12"
                          city:
                            id: 3713
                            addressPostcode: "8962"
                            cityName18: Bergdietikon
                        language: de
                      customerType: COMPANY
                      termsOfPayment: 30
                    companyId: 1
                  status: INVOICED
                  amount: 500.0
                  orderItems:
                  - position: 1
                    itemNumer: P0000061123
                    description: Mobile Prepayment
                    quantity: 1.0
                    unit: Unit
                    price: 500.0
                    discount: 0.0
                    vat:
                      vatCode: "1"
                      rate: 5.3
                      description: Reduced VAT rate
                      masterId: 42
                    amount: 500.0
                    tag: prepayment
                    vatCase: TAXABLE_SUPPLY
                    articleType: PREPAYMENT
                    id: 0
                  attachments: []
                  openPositionsLinkedToInvoice: []
                  subject: Updated invoice
                  usingVAT: true
                  orderType: INVOICE
                  documentDate: 2026-05-29
                  postMethod: PRINT_AND_MANUAL_SEND
        required: true
      responses:
        "200":
          description: Invoice updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        "400":
          description: Data invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "404":
          description: Resource not found
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
      security:
      - apiKeyAuth: []
      - bearerAuth: []
    post:
      tags:
      - Finance
      summary: Create a new KLARA invoice for the authenticated company.
      description: "Creates a new invoice for an existing customer under the company\
        \ resolved from the bearer JWT. The request body's <code>id</code> must be\
        \ <code>0</code> or omitted — this endpoint does not support updating existing\
        \ invoices.<br/><br/><strong>Typical flow:</strong><ol><li>Call <code>GET\
        \ /core/v1/invoices/next-invoice-number</code> to obtain the next invoice\
        \ number.</li><li>Look up the customer via <code>GET /core/v1/customers</code>\
        \ (with search filters and pagination).</li><li>Look up company bank accounts\
        \ via <code>GET /core/v1/company-bank-accounts</code>.</li><li>Search articles\
        \ via <code>GET /core/latest/articles/search</code> or <code>GET /core/latest/articles/article-numbers</code>\
        \ to populate order items.</li><li>(Optional) Look up open positions via <code>GET\
        \ /core/v1/bank-reconciliation/open-positions</code> to reconcile prepayments\
        \ / credit notes.</li><li>(Optional) Call <code>POST /core/v1/orders/next-order-number</code>\
        \ to obtain the next <code>order.orderNumber</code>.</li><li>(Optional) Call\
        \ <code>GET /core/latest/company-configuration/including-vat</code> to determine\
        \ the company default for <code>usingVAT</code>.</li><li>Build the invoice\
        \ payload with order items.</li><li>Call this endpoint with <code>status=INVOICED</code>\
        \ to save and book, or <code>status=DRAFT</code> to save without booking.</li></ol>On\
        \ status <code>INVOICED</code> or <code>SENT</code> the invoice is also booked\
        \ into KLARA accounting, inventory transactions are created and the HubSpot\
        \ indicator is synchronised. <strong>This endpoint does not send/deliver the\
        \ invoice</strong> (no email/ePost/eBill/print&amp;send), regardless of <code>postMethod</code>\
        \ or a <code>SENT</code> status; retrieve the PDF via <code>POST /core/v1/invoices/{id}/printed-document</code>\
        \ and deliver it yourself. The caller must hold the <code>FINANCE</code> permission\
        \ on the target company.<br/><br/><strong>Status is caller-controlled.</strong>\
        \ The Klara GUI keeps an invoice in <code>DRAFT</code> until the user posts\
        \ it in the final step; via the API you choose — send <code>status=DRAFT</code>\
        \ to save without booking, or <code>status=INVOICED</code> (or <code>SENT</code>)\
        \ to book immediately. A DRAFT can be finalized later with <code>PUT /core/v1/invoices</code>\
        \ (<code>status=INVOICED</code>).<br/><br/><strong>Important — booking is\
        \ created without a printed invoice.</strong> When you book via this endpoint\
        \ (<code>status=INVOICED</code>/<code>SENT</code>), the accounting booking\
        \ is created but <strong>no PDF is rendered or stored</strong> — the invoice\
        \ and its booking have no printed document (unlike the GUI, which renders,\
        \ stores and books in one step). To attach the printed invoice, run two follow-up\
        \ calls: (1) <code>POST /core/v1/invoices/{id}/printed-document</code> to\
        \ render the PDF and store its <code>printedFileId</code> on the invoice,\
        \ then (2) <code>PUT /core/v1/bookings/{id}/documents</code> to link that\
        \ <code>printedFileId</code> (in <code>documentIds</code>) to the booking\
        \ returned in <code>bookingNumbers</code>."
      operationId: createInvoice
      parameters:
      - name: confirmDontMindClosingFiscalYear
        in: query
        description: "When <code>true</code>, allows save/booking even if the document\
          \ date falls inside a closing or closed fiscal year. Defaults to false."
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      - name: Accept-Language
        in: header
        description: "Preferred response language as a BCP-47 tag (e.g. <code>en</code>,\
          \ <code>de</code>, <code>fr</code>, <code>it</code>). Forwarded to luzfin_finance."
        schema:
          type: string
          example: en
        example: en
      requestBody:
        description: "<strong>Creates a new invoice for an existing customer.</strong>\
          \ The <code>id</code> field must be <code>0</code> or omitted. This endpoint\
          \ does not support updating existing invoices.<br/><br/><strong>Prerequisite\
          \ APIs (call these first):</strong><ul><li><code>GET /core/v1/invoices/next-invoice-number</code>\
          \ → provides <code>invoiceCode</code> and <code>invoiceNumber</code> (the\
          \ next available invoice number for the company).</li><li><code>GET /core/v1/customers?search-key=...&amp;limit=...</code>\
          \ → provides <code>order.customer.id</code>, <code>order.customer.company</code>\
          \ (with addresses, emails), and <code>order.customer.customerType</code>.</li><li><code>GET\
          \ /core/v1/company-bank-accounts</code> → provides <code>ibanNumberCHF</code>\
          \ / <code>ibanNumberCHW</code> for payment accounts.</li><li><code>GET /core/latest/articles/search?keyword=...</code>\
          \ → search articles by keyword for the autocomplete; provides <code>orderItems[].itemNumer</code>,\
          \ <code>description</code>, <code>price</code>, <code>vat</code>, <code>unit</code>.</li><li><code>GET\
          \ /core/latest/articles/article-numbers?article-numbers=...</code> → fetch\
          \ full article data by article number(s) to fill <code>orderItems[]</code>.</li><li><code>GET\
          \ /core/latest/articles/{article-id}/article-set-items</code> → expands\
          \ article set/bundle into component line items for <code>orderItems[]</code>.</li><li><code>GET\
          \ /core/v1/bank-reconciliation/open-positions</code> → lists customer's\
          \ open prepayments / credit notes that can be reconciled; provides <code>openPositionsLinkedToInvoice[].bookingTypeCode</code>,\
          \ <code>bookingDetailUri</code>, <code>partialPaymentAmount</code>.</li><li>(Optional)\
          \ <code>POST /core/v1/orders/next-order-number</code> → provides <code>order.orderNumber</code>;\
          \ each call advances the in-memory counter — call immediately before creating\
          \ the invoice, not speculatively.</li><li>(Optional) <code>GET /core/latest/company-configuration/including-vat</code>\
          \ → provides the company-level default for <code>usingVAT</code>; returns\
          \ <code>false</code> when no configuration record exists.</li><li><code>printedFileId</code>\
          \ (String, server-assigned) — populated automatically by <code>POST /core/v1/invoices/{id}/printed-document</code>\
          \ after PDF generation; omit on creation.</li></ul><br/><strong>Top-level\
          \ fields:</strong><ul><li><code>id</code> (long, required) — must be <code>0</code>\
          \ for creation.</li><li><code>invoiceCode</code> (String, required) — unique\
          \ invoice code; obtain from <code>GET /core/v1/invoices/next-invoice-number</code>.</li><li><code>orderType</code>\
          \ (String, required) — must be <code>INVOICE</code>.</li><li><code>status</code>\
          \ (String, required) — determines booking behavior (not delivery). Allowed:\
          \ <code>DRAFT</code> (saves without booking), <code>INVOICED</code> (saves\
          \ and books into accounting), <code>SENT</code> (saves and books; does <strong>not</strong>\
          \ send/deliver the invoice).</li><li><code>postMethod</code> (String, optional)\
          \ — distribution channel <strong>recorded on the invoice only</strong>;\
          \ this endpoint does not deliver the invoice. Allowed: <code>A_POST</code>,\
          \ <code>B_POST</code>, <code>SEND_EMAIL</code>, <code>PRINT_AND_MANUAL_SEND</code>,\
          \ <code>EPOST</code>, <code>EBILL</code>.</li><li><code>documentDate</code>\
          \ (date, required) — invoice issue date, format <code>yyyy-MM-dd</code>.</li><li><code>paymentDate</code>\
          \ (date, required) — payment due date, must be on or after <code>documentDate</code>.</li><li><code>ibanNumberCHF</code>\
          \ (String, conditional) — CHF IBAN for payment; required when booking is\
          \ triggered.</li><li><code>ibanNumberCHW</code> (String, optional) — WIR\
          \ IBAN for combined payments.</li><li><code>wirAcceptanceRate</code> (int,\
          \ optional) — WIR acceptance percentage (0–100).</li><li><code>invoiceType</code>\
          \ (String, required) — <code>MANUAL</code> or <code>RECURRING</code>.</li><li><code>amount</code>\
          \ (BigDecimal, required) — total invoice amount over all items. Caller-supplied;\
          \ not recomputed by the server. With <code>usingVAT=false</code> this is\
          \ net + VAT; with <code>usingVAT=true</code> it is the sum of the gross\
          \ item amounts.</li><li><code>usingVAT</code> (boolean) — GUI checkbox <em>\"\
          VAT included in amount of each item\"</em>. Controls whether item <code>price</code>/<code>amount</code>\
          \ are VAT-inclusive (<code>true</code>, gross) or VAT-exclusive (<code>false</code>,\
          \ net). It does <strong>not</strong> switch VAT on/off (that is the company's\
          \ VAT registration). Use <code>GET /core/latest/company-configuration/including-vat</code>\
          \ for the company default. See <em>VAT handling</em> below.</li><li><code>usingExportVat</code>\
          \ (boolean, optional) — GUI checkbox <em>\"Export\"</em>. When <code>true</code>,\
          \ the invoice is an export: set every <code>orderItems[].vat.rate</code>\
          \ to <code>0</code> so no VAT is charged. Defaults to <code>false</code>.</li><li><code>subject</code>\
          \ (String, optional) — invoice subject/title.</li><li><code>ourReference</code>\
          \ / <code>yourReference</code> (String, optional) — reference texts.</li><li><code>companyCityAndDate</code>\
          \ (String, optional) — city and date line printed on invoice.</li><li><code>closeAndSignature</code>\
          \ (String, optional) — closing text and signature block.</li><li><code>printedFileId</code>\
          \ (String, optional) — document ID of uploaded PDF from partner system.</li></ul><br/><strong>Nested\
          \ fields — <code>order</code> (required):</strong><ul><li><code>order.id</code>\
          \ (long) — must be <code>0</code> for new orders.</li><li><code>order.orderNumber</code>\
          \ (int, required) — unique order number; must be &gt; 0 (validated). Obtain\
          \ from <code>POST /core/v1/orders/next-order-number</code> (not idempotent\
          \ — each call advances the counter).</li><li><code>order.orderName</code>\
          \ (String, optional) — order description.</li><li><code>order.companyId</code>\
          \ (long, required) — company ID from bearer token scope.</li><li><code>order.customer</code>\
          \ (object, required) — existing customer; obtain from <code>GET /core/v1/customers</code>.\
          \ Must include <code>customer.id</code>, <code>customer.company</code> (with\
          \ addresses), and <code>customer.customerType</code> (<code>COMPANY</code>\
          \ or <code>PERSON</code>).</li></ul><br/><strong>Nested fields — <code>orderItems[]</code>\
          \ (required, at least 1):</strong><ul><li><code>orderItems[].position</code>\
          \ (int) — line item position (1-based).</li><li><code>orderItems[].itemNumer</code>\
          \ (String) — article number.</li><li><code>orderItems[].description</code>\
          \ (String) — item description.</li><li><code>orderItems[].quantity</code>\
          \ (double) — quantity.</li><li><code>orderItems[].unit</code> (String) —\
          \ unit of measure (e.g. <code>Unit</code>, <code>Hour</code>).</li><li><code>orderItems[].price</code>\
          \ (double) — unit price (negative for credit notes). VAT-inclusive (gross)\
          \ when <code>usingVAT=true</code>, VAT-exclusive (net) when <code>usingVAT=false</code>.\
          \ Both variants are available from the article lookup APIs.</li><li><code>orderItems[].discount</code>\
          \ (double) — discount percentage.</li><li><code>orderItems[].amount</code>\
          \ (double) — line total = <code>quantity × price × (1 − discount/100)</code>,\
          \ rounded to the nearest 0.05. Gross or net following <code>usingVAT</code>\
          \ (same basis as <code>price</code>).</li><li><code>orderItems[].tag</code>\
          \ (String, <strong>required for booking</strong>) — tags field; must not\
          \ be empty when status is <code>INVOICED</code>/<code>SENT</code>.</li><li><code>orderItems[].vatCase</code>\
          \ (String) — <code>TAXABLE_SUPPLY</code>, <code>EXEMPT_SUPPLY</code>, <code>REVERSE_CHARGE</code>.</li><li><code>orderItems[].articleType</code>\
          \ (String) — <code>PRODUCTION</code>, <code>PREPAYMENT</code>, <code>SERVICE</code>.</li><li><code>orderItems[].vat</code>\
          \ (object) — VAT details: <code>vatCode</code>, <code>rate</code>, <code>description</code>,\
          \ <code>masterId</code>. For an export invoice (<code>usingExportVat=true</code>)\
          \ set <code>rate=0</code> and the export/zero <code>vatCode</code>.</li><li><code>orderItems[].id</code>\
          \ (long) — must be <code>0</code> for new items.</li></ul><br/><strong>VAT\
          \ handling — the server does not recalculate amounts.</strong> Unlike the\
          \ Klara GUI (which recomputes line amounts, VAT and totals whenever you\
          \ toggle the <em>\"VAT included in amount of each item\"</em> or <em>\"\
          Export\"</em> checkbox), this endpoint stores the amounts you send <em>verbatim</em>\
          \ and performs no VAT recalculation or consistency check. Send <code>orderItems[].price</code>,\
          \ <code>orderItems[].amount</code>, <code>orderItems[].vat</code> and the\
          \ document <code>amount</code> already consistent with the two flags:<ul><li><code>usingVAT=false</code>\
          \ (VAT-exclusive) — <code>price</code>/<code>amount</code> are net; document\
          \ <code>amount</code> = net + VAT.</li><li><code>usingVAT=true</code> (VAT-inclusive)\
          \ — <code>price</code>/<code>amount</code> are gross (VAT already inside);\
          \ document <code>amount</code> = sum of gross item amounts.</li><li><code>usingExportVat=true</code>\
          \ (export) — set every <code>orderItems[].vat.rate</code> to <code>0</code>;\
          \ VAT = 0 and document <code>amount</code> = sum of net item amounts.</li></ul>To\
          \ reproduce the GUI figures exactly: per line <code>amount = round0.05(quantity\
          \ × price × (1 − discount/100))</code>; VAT per rate group = <code>amount\
          \ × rate/100</code> when VAT-exclusive, or <code>amount × (rate/100) / (1\
          \ + rate/100)</code> when VAT-inclusive — each rounded to the nearest 0.05\
          \ (Swiss commercial rounding). Article unit prices for the inclusive, exclusive\
          \ and export cases come from the article lookup APIs above (each article\
          \ exposes both a VAT-inclusive and a VAT-exclusive price); pick the one\
          \ matching <code>usingVAT</code>/<code>usingExportVat</code>.<br/><br/><strong>Nested\
          \ fields — <code>attachments[]</code> (optional):</strong><ul><li><code>attachments[].fileId</code>\
          \ (String) — document file ID uploaded via partner system.</li><li><code>attachments[].orderDetailId</code>\
          \ (long) — set to <code>0</code> for new invoices.</li><li><code>attachments[].id</code>\
          \ (long) — set to <code>0</code> for new attachments.</li></ul><br/><strong>Nested\
          \ fields — <code>openPositionsLinkedToInvoice[]</code> (optional, for reconciliation):</strong><ul><li><code>openPositionsLinkedToInvoice[].bookingTypeCode</code>\
          \ (String) — <code>AR_PREPAYMENT</code> or <code>AR_CREDITNOTE</code>.</li><li><code>openPositionsLinkedToInvoice[].bookingDetailUri</code>\
          \ (String) — internal URI of the booking detail to reconcile (format: <code>/luz_accounting/api/{tenant-id}/companies/{companyId}/bookings/{bookingId}/booking-details/{detailId}</code>).</li><li><code>openPositionsLinkedToInvoice[].partialPaymentAmount</code>\
          \ (BigDecimal) — amount to offset from this open position.</li></ul><br/><strong>Validation\
          \ rules:</strong><ul><li><code>paymentDate</code> must be on or after <code>documentDate</code>\
          \ (when amount &gt; 0).</li><li><code>order.orderNumber</code> must be &gt;\
          \ 0.</li><li><code>invoiceCode</code> must be unique within the company.</li><li><code>status</code>\
          \ must not be null.</li><li>IBAN format is validated when provided.</li><li>When\
          \ status is <code>SENT</code>, credit notes (negative total) are not allowed.</li><li>Each\
          \ <code>orderItems[].tag</code> must be present when status triggers booking\
          \ (<code>INVOICED</code>/<code>SENT</code>).</li></ul><br/><strong>Server-managed\
          \ fields (ignored on input, populated on output):</strong> <code>vatDate</code>,\
          \ <code>lastModified</code>, <code>createDate</code>, <code>bookingDueDate</code>,\
          \ <code>bookingNumbers</code>, <code>businessCaseId</code>, <code>bookingStatus</code>,\
          \ <code>bookingMessage</code>, <code>bookingSealed</code>, <code>fiscalYearHasCreatedAuto</code>,\
          \ <code>createBy</code>, <code>issuedDate</code>."

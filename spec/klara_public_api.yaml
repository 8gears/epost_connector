          \ <code>OFFER</code>, <code>CONFIRMATION</code>, <code>DELIVERY_NOTE</code>,\
          \ <code>INVOICE</code>. Other enum values (<code>CREDIT_NOTE</code>, <code>FRIENDLY_REMINDER</code>,\
          \ <code>FIRST_REMINDER</code>, <code>SECOND_REMINDER</code>, <code>PAYSLIP</code>,\
          \ <code>RECURRING_INVOICE_TEMPLATE</code>) are accepted but always return\

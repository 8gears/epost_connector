          type: integer
          example: 778812
        code:
          description: Salary-type code of the added salary item.
          type: string
          example: "1005"
        salaryItemValues:
          allOf:
          - $ref: '#/components/schemas/PayslipSalaryItemValues'
          - description: The numeric value fields (Base / Percent / Quantity / Amount)
              of the added salary item.

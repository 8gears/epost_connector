- name: Payroll
  description: Klara Payroll public API (v1) — employee salary items and payslips.
    Served under /core/v1.
- name: Company documents
  description: "Upload and manage documents attached to a company (e.g. salary certificates,\
    \ work permits, contracts)."
- name: Finance
  description: "KLARA Finance public API (v1) — invoices, orders, order documents,\
    \ order numbering configurations and company bank accounts. Served under /core/v1."
- name: SHRM TimeAS
- name: SHRM Barcode print
- name: SHRM D3 Archive
- name: SHRM PWB
- name: Company general
- name: SHRM Employee Migration
- name: Email partner
- name: Store
paths:
  /core/latest/accounting/accounts:
    get:
      tags:
      - Accounting
      summary: List Klara master chart-of-account rows.
      description: "Returns the canonical debit/credit accounts maintained by Klara\
        \ as the seed of any company's bookkeeping. The data is global — the same\
        \ chart of accounts is returned for every tenant, so there are no tenant or\
        \ company path parameters. When the optional <code>legal-form</code> query\
        \ parameter is supplied, only accounts that carry a translation for that legal\
        \ form are returned, and the <code>name</code> field is resolved from the\
        \ legal-form-specific translation column. The <code>Accept-Language</code>\
        \ header selects which translation is used; if absent or unsupported the platform\
        \ default applies. The endpoint is a pure read — idempotent, no side effects.\
        \ Any authenticated bearer token is accepted; the downstream service declares\
        \ no role or permission requirement on this endpoint."
      operationId: listAccounts
      parameters:
      - name: legal-form
        in: query
        description: "Restricts the result to accounts that carry a translation for\
          \ the given Swiss legal form, and resolves <code>name</code> from that legal-form-specific\
          \ column. Allowed values: <code>LIMITED_LIABILITY</code>, <code>CORPORATION</code>,\
          \ <code>OR</code>, <code>INDIVIDUALLY_OWNED_COMPANY</code>, <code>ASSOCIATION</code>,\
          \ <code>SIMPLE_PARTNERSHIP</code>, <code>GENERAL_PARTNERSHIP</code>, <code>LIMITED_PARTNERSHIP</code>,\
          \ <code>COOPERATIVE_COMPANY</code>, <code>FOUNDATION</code>."
        schema:
          enum:
          - LIMITED_LIABILITY
          - CORPORATION
          - OR
          - INDIVIDUALLY_OWNED_COMPANY
          - ASSOCIATION
          - SIMPLE_PARTNERSHIP
          - GENERAL_PARTNERSHIP
          - LIMITED_PARTNERSHIP
          - COOPERATIVE_COMPANY
          - FOUNDATION
          type: string
          example: CORPORATION
        example: CORPORATION
      - name: Accept-Language
        in: header
        description: "IETF language tag used to resolve the localized <code>name</code>\
          \ field of each account. Examples: <code>de-CH</code>, <code>fr-CH</code>,\
          \ <code>it-CH</code>, <code>en</code>."
        schema:
          type: string
          example: de-CH
        example: de-CH
      responses:
        "200":
          description: "Master accounts, sorted by <code>code</code> ascending. Empty\
            \ array when the chart of accounts has not been seeded yet."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicApiAccount'
        "401":
          description: No Authorization header found or invalid token
        "404":
          description: The supplied <code>legal-form</code> value does not match any
            known legal form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: true
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/latest/accounting/accounts/account-displaying:
    get:
      tags:
      - Accounting
      summary: List the account-displaying picker rows for the authenticated company.
      description: "Returns a flat list of <code>AccountDisplaying</code> rows for\
        \ every account in the caller's company chart of accounts. Each row represents\
        \ one selectable combination that a bookkeeper can pick when entering a manual\
        \ journal line. Tenant and company are derived from the bearer token — there\
        \ are no tenant or company path parameters.<p><strong>How rows are produced:</strong>\
        \ For each master account the downstream service checks whether the account\
        \ carries any linked sub-account definitions (e.g. a bank account linked to\
        \ specific bank-accounts, a VAT account linked to VAT-rate items). If the\
        \ account has <em>no</em> sub-account definitions, exactly one bare row is\
        \ emitted with <code>combinedCode</code> equal to the bare account code (e.g.\
        \ <code>\"3000\"</code>), <code>linkType</code> equal to <code>null</code>,\
        \ and <code>specificationItem</code> equal to <code>null</code>. If the account\
        \ has one or more sub-account link specifications, one row is emitted per\
        \ individual sub-account entry, numbered sequentially across <em>all</em>\
        \ link types with a 0-based counter suffix: <code>\"1020-0\"</code>, <code>\"\
        1020-1\"</code>, …</p><p><strong>combinedCode:</strong> <code>\"&lt;accountCode&gt;-&lt;i&gt;\"\
        </code> when a sub-account exists (e.g. <code>\"1020-0\"</code>), or the bare\
        \ account code string (e.g. <code>\"3000\"</code>) when <code>linkType</code>\
        \ is <code>null</code>. The suffix index is a flat 0-based counter per account,\
        \ spanning all link types in declaration order.</p><p><strong>combinedName:</strong>\
        \ <code>\"&lt;accountName&gt; (&lt;subAccountDisplay&gt;)\"</code> when a\
        \ sub-account exists (e.g. <code>\"Bank (UBS)\"</code>), or the bare account\
        \ name (e.g. <code>\"Bürobedarf\"</code>) when <code>linkType</code> is <code>null</code>.</p><p><strong>parentAccount:</strong>\
        \ the full master account this row belongs to. Always populated, including\
        \ for bare rows.</p><p><strong>linkType:</strong> the link-type category name\
        \ (e.g. <code>\"BANK\"</code>, <code>\"CUSTOMER\"</code>, <code>\"VAT_RATE\"\
        </code>). <code>null</code> when the account has no sub-account definitions.</p><p><strong>linkDisplay:</strong>\
        \ the human-readable label for the link type in the current locale (e.g. <code>\"\
        Bank account\"</code>). Falls back to the German label when no translation\
        \ exists for the requested language. <code>null</code> when <code>linkType</code>\
        \ is <code>null</code>.</p><p><strong>linkOptional:</strong> <code>true</code>\
        \ when the sub-account selection is optional for the user (link keys are separated\
        \ by <code>;</code> in the account definition); <code>false</code> when selecting\
        \ a sub-account is mandatory (link keys separated by <code>,</code>); <code>null</code>\
        \ when the account has no sub-account definitions.</p><p><strong>specificationItem:</strong>\
        \ the resolved sub-account entry for this row. Its <code>link</code> field\
        \ is the URI that must be round-tripped back to the booking endpoint when\
        \ the user selects this row. Its <code>display</code> field is the human-readable\
        \ label shown to the bookkeeper (e.g. <code>\"UBS\"</code>, <code>\"8.1 %\"\
        </code>). <code>null</code> when <code>linkType</code> is <code>null</code>.</p><p>Row\
        \ order is stable: accounts are sorted by code ascending (same order as <code>GET\
        \ /core/latest/accounting/accounts</code>); sub-account rows within each account\
        \ preserve the link-type declaration order and then the entry order returned\
        \ by the underlying service.</p>The endpoint is a pure read — idempotent,\
        \ no side effects. The caller must hold the <code>ACCOUNTING</code> permission\
        \ on the company in scope."
      operationId: getAccountDisplaying
      parameters:
      - name: legal-form
        in: query
        description: "When supplied, restricts the result to accounts that carry a\
          \ translation for the given Swiss legal form and resolves the <code>parentAccount.name</code>\
          \ field from the legal-form-specific translation column. When omitted, all\
          \ accounts are returned and <code>account.name</code> is resolved from the\
          \ generic language column. Allowed values: <code>LIMITED_LIABILITY</code>,\
          \ <code>CORPORATION</code>, <code>OR</code>, <code>INDIVIDUALLY_OWNED_COMPANY</code>,\
          \ <code>ASSOCIATION</code>, <code>SIMPLE_PARTNERSHIP</code>, <code>GENERAL_PARTNERSHIP</code>,\
          \ <code>LIMITED_PARTNERSHIP</code>, <code>COOPERATIVE_COMPANY</code>, <code>FOUNDATION</code>."
        schema:
          enum:
          - LIMITED_LIABILITY
          - CORPORATION
          - OR
          - INDIVIDUALLY_OWNED_COMPANY
          - ASSOCIATION
          - SIMPLE_PARTNERSHIP
          - GENERAL_PARTNERSHIP
          - LIMITED_PARTNERSHIP
          - COOPERATIVE_COMPANY
          - FOUNDATION
          type: string
          example: CORPORATION
        example: CORPORATION
      - name: Accept-Language
        in: header
        description: "IETF language tag used to localize the <code>parentAccount.name</code>\
          \ field of each row and the <code>linkDisplay</code> label. Falls back to\
          \ German when no translation exists for the requested language. Examples:\
          \ <code>de-CH</code>, <code>fr-CH</code>, <code>it-CH</code>, <code>en</code>."
        schema:
          type: string
          example: de-CH
        example: de-CH
      responses:
        "200":
          description: "Flat list of account-displaying rows, sorted by account code\
            \ ascending. Each row contains <code>combinedCode</code>, <code>combinedName</code>,\
            \ <code>parentAccount</code>, and the link fields populated for sub-account\
            \ rows or <code>null</code> for bare rows. Returns an empty array when\
            \ no accounts match the supplied <code>legal-form</code>."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicApiAccountDisplaying'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "404":
          description: "The company associated with the caller's session could not\
            \ be resolved by the downstream accounting service, or the supplied <code>legal-form</code>\
            \ value does not match any known legal form."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: true
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/latest/accounting/accounts/by-code/{accountCode}:
    get:
      tags:
      - Accounting
      summary: Resolve a Klara master account by its chart-of-account code.
      description: "Loads a single master account row from Klara's global chart of\
        \ accounts, identified by its numeric <code>accountCode</code>. The data is\
        \ global — the same chart of accounts is shared across every tenant, so there\
        \ are no tenant or company path parameters. When the optional <code>legal-form</code>\
        \ query parameter is supplied, the <code>name</code> field is resolved from\
        \ the legal-form-specific translation column instead of the generic one. The\
        \ <code>Accept-Language</code> header selects which translation is used; if\
        \ absent or unsupported the platform default applies. The endpoint is a pure\
        \ read — idempotent, no side effects. Any authenticated bearer token is accepted;\
        \ the downstream service declares no role or permission requirement on this\
        \ endpoint."
      operationId: getAccountByCode
      parameters:
      - name: accountCode
        in: path
        description: "Numeric chart-of-account code as printed on the Klara master\
          \ chart of accounts (e.g. <code>1000</code> for cash, <code>6000</code>\
          \ for material expense)."
        required: true
        schema:
          type: string
          example: "6000"
        example: 6000
      - name: legal-form
        in: query
        description: "When supplied, resolves <code>name</code> from the legal-form-specific\
          \ translation column. Allowed values: <code>LIMITED_LIABILITY</code>, <code>CORPORATION</code>,\
          \ <code>OR</code>, <code>INDIVIDUALLY_OWNED_COMPANY</code>, <code>ASSOCIATION</code>,\
          \ <code>SIMPLE_PARTNERSHIP</code>, <code>GENERAL_PARTNERSHIP</code>, <code>LIMITED_PARTNERSHIP</code>,\
          \ <code>COOPERATIVE_COMPANY</code>, <code>FOUNDATION</code>."
        schema:
          enum:
          - LIMITED_LIABILITY
          - CORPORATION
          - OR
          - INDIVIDUALLY_OWNED_COMPANY
          - ASSOCIATION
          - SIMPLE_PARTNERSHIP
          - GENERAL_PARTNERSHIP
          - LIMITED_PARTNERSHIP
          - COOPERATIVE_COMPANY
          - FOUNDATION
          type: string
          example: CORPORATION
        example: CORPORATION
      - name: Accept-Language
        in: header
        description: "IETF language tag used to resolve the localized <code>name</code>\
          \ field of the account. Examples: <code>de-CH</code>, <code>fr-CH</code>,\
          \ <code>it-CH</code>, <code>en</code>."
        schema:
          type: string
          example: de-CH
        example: de-CH
      responses:
        "200":
          description: The master account matching <code>accountCode</code>.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiAccount'
        "401":
          description: No Authorization header found or invalid token
        "404":
          description: "No master account exists for the supplied <code>accountCode</code>,\
            \ or the supplied <code>legal-form</code> value does not match any known\
            \ legal form."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: true
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/latest/accounting/booking-types:
    get:
      tags:
      - Accounting
      summary: List Klara master accounting booking types.
      description: "Returns the canonical catalog of accounting booking types maintained\
        \ by Klara — the stable set of bookkeeping operations (general-ledger postings,\
        \ payable / receivable invoices, payments, credit notes, prepayments, amortizations,\
        \ delimitations) that every Klara company can post against. The data is global\
        \ — the same catalog is returned for every tenant, so there are no tenant\
        \ or company path parameters. The <code>Accept-Language</code> header selects\
        \ which translation of the human-readable <code>description</code> is returned;\
        \ if absent or unsupported the German translation is used as a fallback. The\
        \ endpoint is a pure read — idempotent, no side effects. Any authenticated\
        \ bearer token is accepted; the downstream service declares no role or permission\
        \ requirement on this endpoint."
      operationId: listBookingTypes
      parameters:
      - name: Accept-Language
        in: header
        description: "IETF language tag used to resolve the localized <code>description</code>\
          \ of each booking type. Examples: <code>de-CH</code>, <code>fr-CH</code>,\
          \ <code>it-CH</code>, <code>en</code>. Falls back to the German translation\
          \ when no translation exists for the requested language."
        schema:
          type: string
          example: de-CH
        example: de-CH
      responses:
        "200":
          description: "Master booking types, ordered by <code>code</code> ascending.\
            \ Empty array when the catalog has not been seeded yet."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicApiBookingType'
        "401":
          description: No Authorization header found or invalid token
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: true
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/latest/accounting/business-case-templates:
    get:
      tags:
      - Accounting
      summary: List Klara master accounting business-case templates.
      description: "Returns the global catalog of business-case templates — the manual-journal\
        \ categories that drive the booking form (operating expenses, salary payments,\
        \ asset purchases, …). The catalog is global Klara reference data: the same\
        \ list is returned for every tenant, so there are no tenant or company path\
        \ parameters. The <code>Accept-Language</code> header selects which translation\
        \ of the human-readable <code>display</code> label is returned; if absent\
        \ or unsupported the German translation is used as a fallback and the full\
        \ per-language <code>i18n</code> / <code>keywordI18ns</code> maps are returned\
        \ for client-side rendering. Optional <code>orderColumns</code> / <code>offset</code>\
        \ / <code>limit</code> query parameters are forwarded verbatim to the downstream\
        \ catalog for ordering and pagination. The endpoint is a pure read — idempotent,\
        \ no side effects. Requires a bearer token whose principal carries the <code>ACCOUNTING_GET_BUSINESS_CASE_TEMPLATE</code>\
        \ permission."
      operationId: listBusinessCaseTemplates
      parameters:
      - name: limit
        in: query
        description: "Maximum number of templates to return. When omitted, the downstream\
          \ service returns the full catalog."
        required: false
        schema:
          type: integer
          example: 50
        example: 50
      - name: offset
        in: query
        description: "Zero-based index of the first template to return. When omitted,\
          \ the response starts at the first row."
        required: false
        schema:
          type: integer
          example: 0
        example: 0
      - name: orderColumns
        in: query
        description: "Names of columns to order the result by, ascending. Repeat the\
          \ query parameter for multi-column ordering (e.g. <code>?orderColumns=group&amp;orderColumns=code</code>)."
        required: false
        schema:
          type: array
          items:
            type: string
          example: code
        example: code
      - name: Accept-Language
        in: header
        description: "IETF language tag used to resolve the localized <code>display</code>\
          \ label of each template. Examples: <code>de-CH</code>, <code>fr-CH</code>,\
          \ <code>it-CH</code>, <code>en</code>. Falls back to the German translation\
          \ when no translation exists for the requested language."
        schema:
          type: string
          example: de-CH
        example: de-CH
      responses:
        "200":
          description: Business-case templates matching the supplied ordering and
            pagination.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicApiBusinessCaseTemplate'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: true
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/latest/accounting/business-case-templates/{businessCaseTemplateId}:
    get:
      tags:
      - Accounting
      summary: Read a single Klara master accounting business-case template by id.
      description: "Returns one business-case template from the global Klara catalog\
        \ — a manual-journal category usable when entering a booking (for example\
        \ operating expenses, salary payments, asset purchases). The catalog is global\
        \ Klara reference data, so this endpoint has no tenant or company path parameters;\
        \ only the catalogue id selects the template. The <code>Accept-Language</code>\
        \ header selects which translation of the human-readable <code>display</code>\
        \ label is returned; if absent or unsupported the German translation is used\
        \ as a fallback and the full per-language <code>i18n</code> / <code>keywordI18ns</code>\
        \ maps are returned for client-side rendering. The endpoint is a pure read\
        \ — idempotent, no side effects. Returns <code>404</code> when no template\
        \ with the requested id exists in the catalog. Requires a bearer token whose\
        \ principal carries the <code>ACCOUNTING_GET_BUSINESS_CASE_TEMPLATE</code>\
        \ permission."
      operationId: getBusinessCaseTemplateById
      parameters:
      - name: businessCaseTemplateId
        in: path
        description: Numeric primary-key id of the business-case template in the Klara
          master catalog. Obtain it from a prior call to <code>GET /core/latest/accounting/business-case-templates</code>.
        required: true
        schema:
          format: int64
          type: integer
          example: 101
        example: 101
      - name: Accept-Language
        in: header
        description: "IETF language tag used to resolve the localized <code>display</code>\
          \ label of the template. Examples: <code>de-CH</code>, <code>fr-CH</code>,\
          \ <code>it-CH</code>, <code>en</code>. Falls back to the German translation\
          \ when no translation exists for the requested language."
        schema:
          type: string
          example: de-CH
        example: de-CH
      responses:
        "200":
          description: Business-case template matching the supplied id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiBusinessCaseTemplate'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "404":
          description: No business-case template carries the requested id.
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: true
      security:
      - apiKeyAuth: []
      - bearerAuth: []
  /core/latest/accounting/business-cases:
    get:
      tags:
      - Accounting
      summary: Hydrate a business case from a template id for the authenticated company.
      description: "Loads the fully hydrated business-case aggregate the booking form\
        \ needs: the template id, the company-VAT and fiscal-year context resolved\
        \ from the optional date filters, the pre-translated display label, and the\
        \ recursive snippet / field tree. When <code>dateForFilteringFiscalYear</code>\
        \ is supplied it drives the fiscal-year resolution; otherwise <code>dateForFilteringCompanyVat</code>\
        \ is used; otherwise the downstream service resolves the fiscal year that\
        \ covers today. Tenant and company are derived from the bearer-token session\
        \ — they are never accepted from the URL. The endpoint is a pure read — idempotent,\
        \ no side effects. The caller must hold the <code>ACCOUNTING</code> permission\
        \ on the company in scope."
      operationId: hydrateBusinessCaseFromTemplate
      parameters:
      - name: businessCaseTemplateId
        in: query
        description: Numeric id of the business-case template to hydrate. Obtain it
          from <code>GET /core/latest/accounting/companies/current/business-case-templates</code>.
        required: true
        schema:
          format: int64
          type: integer
          example: 101
        example: 101
      - name: dateForFilteringCompanyVat
        in: query

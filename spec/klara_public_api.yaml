          example:
          - 63f5e84ac1e69b3f45d54097
          - 63f5e9f4c1e69b3f45d555da
        hasSubDirectories:
          description: Flag indicating whether the folder has subdirectories.
          type: boolean
          example: true
    DocumentDetail:

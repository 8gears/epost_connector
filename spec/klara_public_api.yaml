  /core/latest/bookings/{id}/documents:
    put:
      tags:
      - Accounting
      summary: Replace the document attachments and document date of an existing booking.
      description: "Replaces the set of supporting-document identifiers and the document\
        \ date stored on an existing accounting booking. The operation is a full replacement\
        \ &mdash; pass an empty <code>documentIds</code> array to clear all existing\
        \ attachments, or omit <code>documentDate</code> / set it to <code>null</code>\
        \ to clear it. By default the operation fails when the booking's existing\
        \ <code>bookingDate</code> falls outside the active Klara Accounting subscription\
        \ window; set <code>ignore-unsubscripted-dates</code> to <code>true</code>\
        \ to bypass this guard. Tenant and company are derived from the bearer token\
        \ &mdash; the booking <code>{id}</code> must belong to the caller's company.\
        \ The caller must hold the <code>ACCOUNTING</code> permission on that company.\
        \ The endpoint is idempotent: re-sending the same body produces the same state.\
        \ Returns HTTP 200 with no body on success."
      operationId: updateBookingDocuments
      parameters:
      - name: id
        in: path
        description: Internal id of the booking whose documents should be replaced.
          Obtain from the <code>id</code> field returned by <code>POST /core/latest/bookings</code>.
        required: true
        schema:
          format: int64
          type: integer
          example: 12345
        example: 12345
      - name: ignore-unsubscripted-dates
        in: query
        description: "When <code>true</code>, accept the update even if the booking's\
          \ <code>bookingDate</code> falls outside the active Klara Accounting subscription\
          \ period. Defaults to <code>false</code>."
        schema:
          default: "false"
          type: boolean
          example: false
        example: false
      requestBody:
        description: "Document metadata to apply to the booking. The operation is\
          \ a full replacement of both <code>documentDate</code> and <code>documentIds</code>.<br/><br/><strong>Prerequisite\
          \ APIs &mdash; call these first to obtain valid values:</strong><ul><li><code>POST\
          \ /core/latest/bookings</code> &rarr; provides the booking <code>id</code>\
          \ used in the URL.</li><li><code>POST /core/latest/companies/{company-id}/documents</code>\
          \ &rarr; upload the file first and use the returned <code>documentId</code>\
          \ as an entry in <code>documentIds</code>. Each entry is either a numeric\
          \ Klara document id (e.g. <code>\"98765\"</code>) or a Klara document URI.</li></ul><strong>Top-level\
          \ fields:</strong><ul><li><code>documentDate</code> (string, ISO date <code>yyyy-MM-dd</code>,\
          \ optional) &mdash; date printed on the underlying paper document. Set to\
          \ <code>null</code> or omit to clear the existing value.</li><li><code>documentIds</code>\
          \ (array of string, optional, max 50 entries, each &le; 512 chars) &mdash;\
          \ full replacement of the attached document references. Send <code>[]</code>\
          \ to clear.</li></ul><strong>Rules:</strong><ul><li>Replacement semantics\
          \ &mdash; missing or empty <code>documentIds</code> clears all existing\
          \ attachments on the booking.</li><li>The booking must belong to the caller's\
          \ company; tenant and company are derived from the bearer token.</li><li>By\
          \ default the booking's existing <code>bookingDate</code> must fall in an\
          \ active Klara Accounting subscription window; use <code>ignore-unsubscripted-dates=true</code>\
          \ to bypass.</li></ul>"
        content:
          application/json:
            schema:
              description: Document metadata to attach to (or replace on) an existing
                accounting booking.
              type: object
              properties:
                documentDate:
                  format: date
                  description: "Date printed on the underlying paper document (e.g.\
                    \ supplier invoice date). When omitted or null, the booking's\
                    \ existing documentDate is cleared."
                  type: string
                  example: 2024-06-15
                documentIds:
                  description: "Identifiers of supporting documents attached to the\
                    \ booking. Replaces the current set on the booking; pass an empty\
                    \ array to clear. Obtain each id by first uploading a file with\
                    \ POST /core/latest/companies/{company-id}/documents and then\
                    \ copying the returned documentId into this array."
                  maxItems: 50
                  type: array
                  items:
                    type: string
                  example:
                  - "98765"
              example:
                documentDate: 2024-06-15
                documentIds:
                - "98765"
        required: true
      responses:
        "200":
          description: Document attachments and date applied to the booking (or accepted
            as a no-op when the booking does not exist on the downstream side).
        "400":
          description: Data invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: true
      security:
      - apiKeyAuth: []
      - bearerAuth: []

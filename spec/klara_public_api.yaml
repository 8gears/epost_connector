    DigitalAdditionalInfo:
      description: Group of the digital delivery information.
      type: object
      properties:
        digitalDeliveryVariant:
          allOf:
          - $ref: '#/components/schemas/DigitalDeliveryVariant'
          - description: "Specifies the tier for the delivery via channel DIGITAL.\
              \ This selection determines the availability of digital receipts, tracking\
              \ capabilities, and recipient identification requirements. If digitalDeliveryVariant\
              \ is omitted, the system defaults to 'STANDARD'.<br/><br/><b>STANDARD</b>:\
              \ Standard digital delivery with proof of dispatch. Includes a digital\
              \ timestamp and signature upon acceptance by ePost. [ePost Standard]<br/><b>NO_CONFIRMATION</b>:\
              \ Basic digital delivery. Provides a digital delivery without additional\
              \ digital receipts or tracking features. [ePost Light]<br/><b>TRACKED</b>:\
              \ Enhanced delivery with retrieval tracking. Includes all features of\
              \ STANDARD, plus 'Retrieval' and 'Non-retrieval' receipts to track if\
              \ and when the recipient opened the message. [ePost Plus]<br/><b>REGISTERED</b>:\
              \ Full legal-grade digital registered mail. Includes all TRACKED features,\
              \ as well as recipient acceptance/rejection tracking and mandatory Person\
              \ Identification. Important note: 'minimumLevelOfTrust' must be set\
              \ to GOLD for the recipient, as verification of the recipient as a person\
              \ by an online identification process is prerequisite for ePost Registered.\
              \ [ePost Registered]"
            default: STANDARD
            example: STANDARD
        letterAnswer:
          description: "Specifies an optional recipient response option for the delivery\
            \ via channel DIGITAL. When set to a supported value, the recipient is\
            \ offered a corresponding action on the delivered document in the digital\
            \ letterbox. This field is only considered for the DIGITAL channel; it\
            \ is ignored for all other channels. Supported values are provisioned\
            \ per agreement with ePost. If omitted, empty, or set to an unrecognised\
            \ value, no response option is offered and the delivery proceeds normally."
          type: string
    DigitalDeliveryVariant:
      enum:
      - STANDARD
      - NO_CONFIRMATION
      - TRACKED
      - REGISTERED
      type: string
    DimensionUnit:
      description: Dimension unit used for shipping of the article
      enum:
      - CENTIMETER
      - METER
      type: string
    Directory:

    HashedPrimaryCredentialType:
      enum:
      - email
      - postaladdress
      - mobilenumber
      type: string
    IdentityMatchingRecipient:
      description: Recipient's info include hashed and unhashed data for identity
        matching process.
      type: object
      properties:
        senderUserId:
          description: This id is for the sender to recognize the recipient.
          type: string
        hashedPrimaryCredential:
          allOf:
          - $ref: '#/components/schemas/HashedPrimaryCredentialType'
          - description: Type of the primary credential which is hashed.
            example: email
        hashedPrimaryValue:
          description: Value of the primary credential.
          type: string
          example: adu7adsfnn3489asdfn334jk
        derivedHashedCredentials:
          description: These are credentials that are hashed but aren't "Primary Credentials".
            There could be more than one credential.
          type: array
          items:
            $ref: '#/components/schemas/DerivedHashedCredentialType'
        derivedHashedValue:
          description: This hash value is derived from the other value "hashedPrimaryValue".
          type: string
          example: adu7adsfnn3489asdfn334jk
        unhashedCredentials:
          allOf:
          - $ref: '#/components/schemas/UnhashedCredential'
          - description: Unhashed credential for identity matching process.
        allCredentialShouldMatch:
          description: "Decides if the recipient should be strictly processed with\
            \ all credentials matched or not.<br />If not specified, then default\
            \ value of TRUE will be used."
          type: boolean
    InventoryNumberType:
      enum:
      - NO_NUMBER
      - BATCH_NUMBER
      - SERIAL_NUMBER
      type: string
    Invoice:
      description: "An invoice document (creation or update). The polymorphic discriminator\
        \ <code>orderType</code> is always <code>INVOICE</code>. Server-managed read-only\
        \ fields (<code>vatDate</code>, <code>lastModified</code>, <code>createDate</code>,\
        \ <code>bookingDueDate</code>, <code>bookingNumbers</code>, <code>businessCaseId</code>)\
        \ are populated on the response."
      required:
      - invoiceCode
      type: object
      properties:
        id:
          format: int64
          description: Invoice id. Must be <code>0</code> or omitted when creating
            a new invoice. This endpoint only supports creation; updating an existing
            invoice is not supported.
          type: integer
          example: 0
        orderType:
          description: "Polymorphic discriminator. Must be <code>INVOICE</code>. Allowed\
            \ values: <code>INVOICE</code>."
          default: INVOICE
          type: string
          example: INVOICE
        status:
          description: "Invoice status. Allowed values: <code>DRAFT</code>, <code>INVOICED</code>,\
            \ <code>SENT</code>, <code>PAID</code>, <code>CANCELLED</code>. Required.\
            \ Status <code>INVOICED</code> or <code>SENT</code> triggers accounting\
            \ booking."
          type: string
          example: INVOICED
        invoiceCode:
          description: Human-readable invoice code. Required and unique per company.
          maxLength: 64
          pattern: \S
          type: string
          example: INV-2026-001
          nullable: false
        invoiceNumber:
          format: int64
          description: "Sequential invoice number, typically obtained from <code>GET\
            \ /invoices/next-invoice-number</code>."
          type: integer
          example: 2026001
        documentDate:
          format: date
          description: Invoice document date (ISO 8601). Required when <code>amount</code>
            is greater than 0. Must fall inside the company's active Order Management
            subscription period.
          type: string
          example: 2026-05-28
        paymentDate:
          format: date
          description: Payment due date (ISO 8601). Required when <code>amount</code>
            is greater than 0. Must be on or after <code>documentDate</code>.
          type: string
          example: 2026-06-27
        deliveryDate:
          format: date
          description: Service delivery date (ISO 8601).
          type: string
          example: 2026-05-25
        issuedDate:
          format: date
          description: Date the invoice was issued (ISO 8601).
          type: string
          example: 2026-05-28
        servicePeriodFrom:
          format: date
          description: Service period start date (ISO 8601).
          type: string
          example: 2026-05-01
        servicePeriodTo:
          format: date
          description: Service period end date (ISO 8601).
          type: string
          example: 2026-05-31
        servicePeriodPattern:
          description: "Service period pattern label (e.g. <code>MONTHLY</code>, <code>YEARLY</code>)."
          maxLength: 32
          type: string
          example: MONTHLY
        vatDate:
          format: date
          description: VAT date. Server-managed (read-only).
          type: string
        bookingDueDate:
          format: date
          description: Booking due date returned by accounting. Server-managed (read-only).
          type: string
        lastModified:
          format: date-time
          description: Last modification timestamp. Server-managed (read-only).
          type: string
        createDate:
          format: date-time
          description: Creation timestamp. Server-managed (read-only).
          type: string
        amount:
          description: Invoice total. When <code>usingVAT=false</code> (VAT-exclusive
            items) this is the gross total = net + VAT; when <code>usingVAT=true</code>
            (VAT-inclusive items) it is the sum of the gross item amounts (VAT already
            inside). <strong>Caller-supplied — the server does not recompute it.</strong>
          type: number
          example: 1080.0
        usingVAT:
          description: Controls whether each item <code>price</code>/<code>amount</code>
            is <strong>VAT-inclusive (gross)</strong> or <strong>VAT-exclusive (net)</strong>.
            This is the GUI checkbox <em>"VAT included in amount of each item"</em>.
            <code>true</code> = amounts already include VAT (INCLUDE_VAT); <code>false</code>
            = VAT is added on top of the net amounts (EXCLUDE_VAT). It does <strong>not</strong>
            turn VAT on or off — whether VAT applies at all is governed by the company's
            VAT registration. Use <code>GET /core/latest/company-configuration/including-vat</code>
            for the company default. <strong>The server stores the amounts you send
            verbatim and does not recompute them from this flag</strong> — send <code>price</code>/<code>amount</code>
            consistent with the chosen mode (see the create operation's VAT-handling
            notes).
          default: "false"
          type: boolean
          example: true
        usingExportVat:
          description: "Export invoice flag — the GUI <em>\"Export\"</em> checkbox.\
            \ When <code>true</code>, the invoice is treated as an export: every <code>orderItems[].vat.rate</code>\
            \ must be <code>0</code> (export/zero VAT code), so no VAT is charged.\
            \ When <code>false</code> (default) the items' normal VAT rates apply.\
            \ The server does not recompute item VAT from this flag — set the per-item\
            \ VAT accordingly."
          default: "false"
          type: boolean
          example: false
        subject:
          description: Free-text invoice subject.
          maxLength: 1024
          type: string
          example: Invoice 2026-001
        closeAndSignature:
          description: Free-text closing remarks / signature block.
          maxLength: 4096
          type: string
          example: Thank you for your business.
        ourReference:
          description: Internal sender reference.
          maxLength: 128
          type: string
          example: ACC-2026
        yourReference:
          description: Customer-side reference (e.g. PO number).
          maxLength: 128
          type: string
          example: PO-9981
        companyCityAndDate:
          description: "Header line such as 'Zurich, 28.05.2026'."
          maxLength: 256
          type: string
          example: "Zurich, 28.05.2026"
        postMethod:
          description: "Distribution channel recorded on the invoice. <strong>Stored\
            \ only — creating an invoice does not deliver it</strong> (no email/ePost/eBill/print&amp;send).\
            \ Allowed values: <code>A_POST</code>, <code>B_POST</code>, <code>SEND_EMAIL</code>,\
            \ <code>PRINT_AND_MANUAL_SEND</code>, <code>EPOST</code>, <code>EBILL</code>."
          type: string
          example: SEND_EMAIL
        delivery:
          description: Delivery method label (free text).
          maxLength: 64
          type: string
          example: DHL
        ibanNumberCHF:
          description: CHF IBAN for payment. Validated by downstream service.
          type: string
          example: CH9300762011623852957
        ibanNumberCHW:
          description: WIR-franc IBAN for payment.
          type: string
          example: CH9300762011623852957
        wirAcceptanceRate:
          description: WIR acceptance percentage.
          type: number
          example: 0
        referenceNumber:
          description: QR / ISR reference number.
          maxLength: 64
          type: string
          example: 21 00000 00003 13947 14300 09017
        qrInvoice:
          description: "When <code>true</code>, the invoice is rendered/booked as\
            \ a Swiss QR-invoice. Defaults to false."
          default: "false"
          type: boolean
          example: true
        fromAutoInvoicing:
          description: Indicates the invoice was generated by auto-invoicing. Defaults
            to false.
          default: "false"
          type: boolean
          example: false
        fromInvoiceRun:
          description: "Indicates the invoice was produced by a recurring invoice\
            \ run. When <code>true</code>, accounting booking and inventory transactions\
            \ are skipped. Defaults to false."
          default: "false"
          type: boolean
          example: false
        invoiceType:
          description: "Invoice type. Allowed values: <code>MANUAL</code>, <code>CREDIT_DEBIT</code>."
          type: string
          example: MANUAL
        originDistributionMethod:

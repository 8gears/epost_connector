        \ Only meaningful for <code>OFFER</code>, <code>CONFIRMATION</code>, <code>DELIVERY_NOTE</code>,\
        \ and <code>INVOICE</code>; other types always return <code>documentNumber\
        \ = 0</code>. If the company has configured <code>MANUAL</code> numbering\
        \ for the requested type, the downstream service returns HTTP 500 — check\

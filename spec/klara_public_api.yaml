      - XING
      - YOUTUBE
      type: string
    OrderDocument:
      description: "An order-management document — offer, confirmation, delivery-note,\
        \ invoice, credit note or recurring invoice template. The polymorphic discriminator\
        \ <code>orderType</code> identifies the concrete subtype. Server-managed fields\
        \ (<code>vatDate</code>, <code>lastModified</code>, <code>createDate</code>)\
        \ are populated on the response."
      type: object
      properties:
        id:
          format: int64
          description: Document id (database primary key).
          type: integer
          example: 1234
        orderType:
          description: "Polymorphic discriminator. Allowed values: <code>OFFER</code>,\
            \ <code>CONFIRMATION</code>, <code>DELIVERY_NOTE</code>, <code>INVOICE</code>,\
            \ <code>CREDIT_NOTE</code>, <code>FRIENDLY_REMINDER</code>, <code>FIRST_REMINDER</code>,\
            \ <code>SECOND_REMINDER</code>, <code>PAYSLIP</code>, <code>RECURRING_INVOICE_TEMPLATE</code>."
          type: string
          example: DELIVERY_NOTE
        status:
          description: "Document status (subtype-specific). For invoices: <code>DRAFT</code>,\
            \ <code>INVOICED</code>, <code>SENT</code>, <code>PAID</code>, <code>CANCELLED</code>."
          type: string
          example: SENT
        documentDate:
          format: date
          description: Document creation/business date (ISO 8601).
          type: string
          example: 2026-05-28
        issuedDate:
          format: date
          description: Date the document was issued (ISO 8601).
          type: string
          example: 2026-05-28
        amount:
          description: Document gross total (incl. VAT when applicable).
          type: number
          example: 500.0
        ourReference:
          description: Internal sender reference.
          type: string
          example: ACC-2026
        yourReference:
          description: Customer-side reference (e.g. PO number).
          type: string
          example: PO-9981
        subject:
          description: Free-text document subject.
          type: string
          example: Delivery note 377
        closeAndSignature:
          description: Free-text closing remarks / signature block.
          type: string
          example: Thank you for your business.
        companyCityAndDate:
          description: "Header line such as 'Zurich, 28.05.2026'."
          type: string
          example: "Zurich, 28.05.2026"
        usingVAT:
          description: Whether VAT is applied on this document.
          default: "false"
          type: boolean
          example: true
        vatDate:
          format: date
          description: VAT date. Server-managed (read-only).
          type: string
        printedFileId:
          description: Document file id of the rendered PDF (if any).
          type: string
          example: "1771764"
    OrderNextNumberResult:
      type: object
      properties:
        nextOrderNumber:
          format: int32
          description: The next available business order number for the authenticated
            company. Reserved exclusively for this call — use it as the orderNumber
            when subsequently creating the order. Gaps may appear in the sequence
            if the order creation fails after this call.
          type: integer
          example: 10041
    OrderNumberingConfiguration:
      type: object
      properties:
        orderType:
          allOf:
          - $ref: '#/components/schemas/OrderType'
          - description: Order-document type this configuration applies to.
            example: INVOICE
        orderNumberingType:
          allOf:
          - $ref: '#/components/schemas/OrderNumberingType'
          - description: "Strategy used to assign document numbers. <code>STANDARD</code>:\
              \ server auto-increments from <code>startingNumber</code>; <code>MANUAL</code>:\
              \ caller must supply a number in <code>POST /invoices</code>; <code>CUSTOMISED</code>:\
              \ caller must supply a code matching <code>format</code>."
            example: STANDARD
        startingNumber:
          format: int64
          description: The first number in the auto-increment sequence (relevant for
            STANDARD). Null when not configured.
          type: integer
          example: 1000
        increment:
          format: int64
          description: Step size between successive auto-incremented numbers (relevant
            for STANDARD). Null when not configured.
          type: integer
          example: 1
        format:
          description: "Alphanumeric format pattern for CUSTOMISED numbering (e.g.\
            \ <code>INV-{YYYY}-{SEQ}</code>). Null when not configured."
          type: string
          example: "INV-2026-{SEQ}"
    OrderNumberingResult:
      type: object
      properties:
        orderType:
          allOf:
          - $ref: '#/components/schemas/OrderType'
          - description: Order-document type this result applies to.
            example: INVOICE
        orderNumberingType:
          allOf:
          - $ref: '#/components/schemas/OrderNumberingType'
          - description: "Numbering strategy for this document type: STANDARD (server\
              \ auto-assigns), MANUAL (caller supplies invoiceCode), CUSTOMISED (caller\
              \ supplies formatted code)."
            example: STANDARD
        startingNumber:
          format: int64
          description: Starting sequence number for STANDARD and CUSTOMISED strategies.
          type: integer
          example: 1000
        increment:
          format: int64
          description: Step size between successive auto-incremented numbers.
          type: integer
          example: 1
        format:
          description: Alphanumeric prefix for CUSTOMISED numbering (the server appends
            the sequence number).
          type: string
          example: INV-2026-
        documentNumber:
          format: int64
          description: The next document number to use (the sequence integer). For
            INVOICE this counter is persisted on every call — do not call speculatively.
          type: integer
          example: 1001
        documentCode:
          description: The next document code to use as invoiceCode / offerCode. For
            STANDARD and MANUAL this equals String.valueOf(documentNumber); for CUSTOMISED
            it equals format + documentNumber (e.g. "INV-2026-1001").
          type: string
          example: "1001"
    OrderNumberingType:
      description: Strategy used to assign document numbers for an order type. <code>STANDARD</code>
        — server auto-increments; <code>MANUAL</code> — caller supplies the number;
        <code>CUSTOMISED</code> — caller supplies a formatted code matching the configured
        pattern.
      enum:
      - STANDARD
      - MANUAL
      - CUSTOMISED
      type: string
    OrderType:
      description: Order-management document type. Used as the discriminator on <code>OrderDocument.orderType</code>.
      enum:
      - OFFER
      - CONFIRMATION
      - DELIVERY_NOTE
      - INVOICE
      - CREDIT_NOTE
      - FRIENDLY_REMINDER
      - FIRST_REMINDER
      - SECOND_REMINDER
      - PAYSLIP
      - RECURRING_INVOICE_TEMPLATE
      type: string
    Partner:

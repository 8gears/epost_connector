  title: KLARA Public API
  description: "This specification describes the API endpoints available for KLARA\
    \ Public API.<br/><br/><b>Important notes:</b><br/>Effective November 15th, 2024,\
    \ HTTP protocol version 1.0 (HTTP/1.0) won’t be supported anymore, due to security\
    \ issues.<br/>Only HTTP protocol versions 1.1 (HTTP/1.1) and 2 (HTTP/2) will be\
    \ supported on our platform.<br/>We encourage all users to ensure their systems\
    \ are compatible with these versions to avoid any service disruptions."
  version: 0.0.1
servers:
- url: /

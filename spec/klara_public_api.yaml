  /core/latest/bank-reconciliation/open-positions:
    get:
      tags:
      - Accounting
      summary: List the bank-reconciliation open positions of the authenticated company.
      description: "Returns the list of open booking-detail positions (AR / AP invoices,\
        \ payments, prepayments, credit notes, general-ledger entries) of the caller's\
        \ company that match the supplied filters, enriched with partner-name display,\
        \ business-case message id, computed open amount and a stable booking-detail\
        \ URI. Used by the bank-reconciliation UI to populate the open-position picker\
        \ for a selected bank or credit-card transaction. The <code>action</code>\
        \ parameter selects the multi-condition combinator: <code>search</code> (default)\
        \ is OR-of-conditions, <code>filter</code> is AND-of-conditions. Tenant and\
        \ company are derived from the bearer-token session — they are never accepted\
        \ from the URL. The endpoint is a pure read — idempotent, no side effects.\
        \ The caller must hold the <code>ACCOUNTING_GET_OPEN_POSITION</code> permission\
        \ on the company in scope."
      operationId: listBankReconciliationOpenPositions
      parameters:
      - name: action
        in: query
        description: Multi-condition combinator. <code>search</code> (default) = OR-of-conditions;
          <code>filter</code> = AND-of-conditions.
        required: false
        schema:
          default: search
          enum:
          - search
          - filter
          type: string
          example: filter
        example: filter
      - name: booking-type-codes
        in: query
        description: "Comma-separated list of booking-type codes to restrict to. Allowed\
          \ values: <code>GENERAL_LEDGER</code>, <code>AP_INVOICE</code>, <code>AP_PAYMENT</code>,\
          \ <code>AR_INVOICE</code>, <code>AR_PAYMENT</code>, <code>AP_PREPAYMENT</code>,\
          \ <code>AP_PREPAYUSE</code>, <code>AR_PREPAYMENT</code>, <code>AR_PREPAYUSE</code>,\
          \ <code>AR_CREDITNOTE</code>, <code>AR_CREDITUSE</code>, <code>AP_CREDITNOTE</code>,\
          \ <code>AP_CREDITUSE</code>, <code>AMORTIZATION</code>, <code>SELLOFF_AMORTIZATION</code>,\
          \ <code>DELIMIT</code>."
        required: false
        schema:
          type: string
          example: "AR_PREPAYMENT,AR_CREDITNOTE"
        example: "AR_PREPAYMENT,AR_CREDITNOTE"
      - name: crdr-type
        in: query
        description: Restrict to credit (<code>CR</code>) or debit (<code>DR</code>)
          postings.
        required: false
        schema:
          $ref: '#/components/schemas/PublicApiCrDrType'
        example: CR
      - name: credit-card-not-reconciled
        in: query
        description: "When <code>true</code>, restricts to credit-card transactions\
          \ still pending reconciliation."
        required: false
        schema:
          type: boolean
          example: true
        example: true
      - name: general-search
        in: query
        description: "Free-text search across description, partner name, document\
          \ id and reference fields. Combined with the other filters using the mode\
          \ selected by <code>action</code>."
        required: false
        schema:
          maxLength: 256
          type: string
          example: Migros
        example: Migros
      - name: invoice-date
        in: query
        description: Exact-match invoice (document) date filter (ISO date <code>yyyy-MM-dd</code>).
        required: false
        schema:
          format: date
          type: string
          example: 2026-04-15
        example: 2026-04-15
      - name: partner
        in: query
        description: "Klara partner URI to filter by. Format: <code>/api/luz_person/api/{tenantId}/companies/{companyId}/partners/{partnerId}</code>.\
          \ Construct from the partner id returned by the public partner endpoints."
        required: false
        schema:
          type: string
          example: /api/luz_person/api/c60d31fa-f335-4957-872a-90b035632081/companies/1/partners/123
        example: /api/luz_person/api/c60d31fa-f335-4957-872a-90b035632081/companies/1/partners/123
      - name: payment-date
        in: query
        description: Exact-match payment date filter (ISO date <code>yyyy-MM-dd</code>).
        required: false
        schema:
          format: date
          type: string
          example: 2026-05-28
        example: 2026-05-28
      - name: payment-date-from
        in: query
        description: Inclusive lower bound of the payment-date range filter (ISO date
          <code>yyyy-MM-dd</code>).
        required: false
        schema:
          format: date
          type: string
          example: 2026-01-01
        example: 2026-01-01
      - name: payment-date-to
        in: query
        description: Inclusive upper bound of the payment-date range filter (ISO date
          <code>yyyy-MM-dd</code>).
        required: false
        schema:
          format: date
          type: string
          example: 2026-06-30
        example: 2026-06-30
      - name: position-status
        in: query
        description: "Comma-separated list of open-position lifecycle statuses to\
          \ restrict to. Allowed values: <code>OPEN</code>, <code>PARTLY_PAID</code>,\
          \ <code>PAID</code>, <code>PARTLY_CLEARED</code>, <code>CLEARED</code>."
        required: false
        schema:
          type: string
          example: "OPEN,PARTLY_CLEARED"
        example: "OPEN,PARTLY_CLEARED"
      - name: tags
        in: query
        description: Comma-separated list of tag names to filter by (free-form).
        required: false
        schema:
          maxLength: 256
          type: string
          example: "vendor-x,q2"
        example: "vendor-x,q2"
      responses:
        "200":
          description: List of open positions matching the filters. Empty array when
            nothing matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicApiSuitableOpenPosition'
        "400":
          description: "One of the date filters is not a valid ISO date (<code>yyyy-MM-dd</code>),\
            \ or one of the enum filters (<code>position-status</code>, <code>booking-type-codes</code>,\
            \ <code>crdr-type</code>) carries a value that is not in the documented\
            \ value set, or a free-text filter exceeds 256 characters."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "401":
          description: No Authorization header found or invalid token
        "403":
          description: The current user is not allowed to access this company data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        "429":
          description: API rate limit exceeded
        "500":
          description: Something went wrong on our side while processing the request.
            Please kindly contact our support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: true
      security:
      - apiKeyAuth: []
      - bearerAuth: []
